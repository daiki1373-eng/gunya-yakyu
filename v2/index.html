<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>ぐにゃ野球</title>
<!--
  ぐにゃ野球 段階2入口（画面シェル＋試合エンジン統合）
  仕様の正：ぐにゃ野球 拡張仕様書 v0.1（A-3 デザイン方針／A-12 モジュール境界／C 段階計画）
  受け渡し先：Claude Code（実装・検証）
  含むもの：13画面、試合の物理演算・投打・オート守備、フォーム・球種・モーション設定、デモ広告
  含まないもの：リーグ進行・育成・スカウト・ミッションの本実装、実広告SDK、実課金
  仮置き：Q1=B（リーグ戦以外のコインは1日300まで）、Q2=B（k=0.30）、Q3=A（全画面を縦で統一）
  デバッグ：URL の末尾に ?debug=1
-->
<style>
/* =====================================================================
   デザイン基盤（仕様書 A-3：ナイターの電光掲示板 × 選手名鑑）
   色はすべてここの変数から使う。紫系の色と背景グラデーションは使わない（★4の枠だけ例外）
   ===================================================================== */
:root{
  color-scheme:dark;
  --navy:#0E1A2B;--stand:#0A1422;--panel:#16263D;--panel-2:#1D3253;--line:#2A3D57;--line-2:#1E3048;
  --text:#F4F6F8;--text-2:#9FB0C3;
  --amber:#FFB020;--amber-ink:#1B1303;--turf:#2F8F4E;--turf-text:#5BC27E;--red:#E5484D;--red-text:#FF6B6F;
  --rk-S:#F5B700;--rk-A:#FF5A5F;--rk-B:#F07A28;--rk-C:#E8C547;--rk-D:#9BC53D;--rk-E:#3FA34D;--rk-F:#4C94FF;--rk-G:#8D99AE;
  --r1:#A86B3C;--r2:#B8C2CC;--r3:#D4A72C;
  --f-num:"Oswald","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  --hdr-h:56px;--tab-h:64px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#060D17;color:var(--text);font:500 15px/1.55 var(--f-ja);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ic{width:24px;height:24px;flex:0 0 auto}
.ic.sm{width:15px;height:15px;vertical-align:-2px}
.ic-coin{color:var(--amber)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--navy);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:432px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ヘッダー・下部タブ（画面シェル） */
.hdr{flex:0 0 auto;padding-top:var(--safe-t);background:var(--navy);border-bottom:1px solid var(--line)}
.hdr-in{height:var(--hdr-h);display:flex;align-items:center;gap:6px;padding:0 4px 0 14px}
.hdr-team{flex:1 1 auto;min-width:0}
.hdr-team b{display:block;font-size:17px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-team span{display:block;font-size:11.5px;color:var(--text-2);line-height:1.3}
.wallet{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px 0 6px;border-radius:15px;background:var(--panel);border:1px solid var(--line)}
.wallet .ic{width:18px;height:18px}
.wallet .num{font-size:15.5px;font-weight:600;min-width:2ch;text-align:right}
.wallet .ic-ticket{color:var(--text-2)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;border-radius:10px;color:var(--text-2)}
.icon-btn:active{background:var(--panel)}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--safe-b);background:var(--stand);border-top:1px solid var(--line)}
.tab{position:relative;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2);font-size:11.5px;font-weight:700}
.tab[aria-current="page"]{color:var(--amber)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
.app.is-immersive .hdr,.app.is-immersive .tabs{display:none}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;outline:none}

/* 画面の共通部品 */
.screen{padding:14px 14px 28px}
.screen>*+*{margin-top:14px}
.page-h{display:flex;align-items:center;gap:2px;margin:-6px 0 0 -10px}
.page-h h1{font-size:19px;font-weight:900;line-height:1.3}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:22px}
.sec-h.first{margin-top:2px}
.sec-h h2{font-size:15.5px;font-weight:900;white-space:nowrap}
.sec-h p{font-size:12px;color:var(--text-2);text-align:right}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.note{font-size:12.5px;color:var(--text-2)}
.draft{display:inline-block;padding:0 7px;border:1px solid var(--amber);border-radius:4px;color:var(--amber);font-size:11px;font-weight:700;line-height:1.7;white-space:nowrap}
.lock-note{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--text-2)}
.lock-note .ic{width:16px;height:16px;margin-top:1px}
.warn{color:var(--red-text)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 16px;border-radius:10px;font-size:16px;font-weight:900;text-align:center}
.btn-turf{background:var(--turf);color:#fff;font-size:19px}
.btn-amber{background:var(--amber);color:var(--amber-ink)}
.btn-line{background:var(--panel);border:1px solid var(--line)}
.btn-danger{background:var(--red);color:#fff}
.btn:disabled,.btn-s:disabled{opacity:.42}
.btn:not(:disabled):active,.btn-s:not(:disabled):active{transform:translateY(1px)}
.btn.two-line{flex-direction:column;gap:1px;min-height:60px}
.btn .cost{font-size:12px;font-weight:700}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}
.btn-s{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;min-width:44px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:900;white-space:nowrap}

/* ホーム：チームの数字と電光掲示板 */
.status{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.ovr{display:grid;place-items:center;align-content:center;gap:4px;height:96px;border:2px solid var(--amber);border-radius:12px}
.ovr small{font-size:11px;color:var(--text-2);font-weight:700}
.ovr b{font:700 44px/1 var(--f-num);color:var(--amber)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.fact dt{font-size:11.5px;color:var(--text-2);font-weight:700}
.fact dd{font-size:13px;font-weight:700;white-space:nowrap}
.fact dd b{font:600 24px/1.15 var(--f-num);margin-right:1px}
.fact.wide{grid-column:1/-1}
.board{background:var(--stand);border:2px solid #23384F;border-radius:6px;padding:6px 12px 4px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0 5px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--text-2);font-weight:700}
.board-head .led{font:600 16px/1 var(--f-num)}
.led{color:var(--amber);text-shadow:0 0 10px rgba(255,176,32,.35)}
.board-row{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line-2)}
.board-row:last-child{border-bottom:0}
.board-side{font-size:11.5px;color:var(--text-2);font-weight:700}
.board-team{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-team.me{color:var(--amber)}
.board-num{font:600 30px/1 var(--f-num);text-align:right;min-width:2ch}
.board-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);padding:4px 0 2px;border-top:1px solid var(--line-2)}
.res-badge{font:900 13px/1 var(--f-ja);padding:4px 8px;border-radius:4px;color:var(--navy);background:var(--text-2)}
.res-badge.W{background:var(--turf-text)}.res-badge.L{background:var(--red-text)}

/* 選手カード（主役） */
.cards2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:5/7;min-width:0;padding:8px 8px 9px;border-radius:10px;background:var(--panel);border:2px solid var(--r1);text-align:left;overflow:hidden}
.pcard.r2{border-color:var(--r2)}.pcard.r3{border-color:var(--r3)}
.pcard.r4{border-color:transparent;background:linear-gradient(#0C1119,#0C1119) padding-box,linear-gradient(135deg,#7E5E10,#F2D27A 32%,#B4861B 58%,#F6E2A0 84%,#7E5E10) border-box}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.pc-pos{display:grid;place-items:center;min-width:28px;height:28px;padding:0 5px;border-radius:6px;background:var(--navy);border:1px solid var(--line);font-size:15px;font-weight:900}
.pc-ovr{display:block;text-align:right;line-height:1}
.pc-ovr small{display:block;font-size:10.5px;color:var(--text-2);font-weight:700;margin-bottom:2px}
.pc-ovr b{font:700 30px/1 var(--f-num);color:var(--amber)}
.pc-fig{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:2px;margin-bottom:4px;overflow:hidden}
.pc-fig svg{display:block;height:100%;max-height:110px;width:auto}
.pc-name{display:block;font-size:14px;font-weight:900;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-sub{display:block;font-size:11px;color:var(--text-2);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-abs{display:grid;gap:3px;margin-top:5px}
.ab{display:grid;grid-template-columns:4.2em 1em 2.3em minmax(0,1fr);align-items:center;gap:4px;font-size:11px;line-height:1.1}
.ab-l{color:var(--text-2);font-weight:700;white-space:nowrap}
.ab-r{font:700 13px/1 var(--f-num);text-align:center}
.ab-v{font:600 13px/1 var(--f-num);text-align:right}
.ab-bar{display:block;height:4px;border-radius:2px;background:#0A1524;overflow:hidden}
.ab-bar i{display:block;height:100%}
.pc-ranks{display:flex;justify-content:space-between;margin-top:3px}
.pc-ranks span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text-2);line-height:1.2}
.pc-ranks b{font:700 14px/1 var(--f-num)}
.pcard.is-big{max-width:300px;margin-left:auto;margin-right:auto;padding:12px}
.is-big .pc-pos{min-width:36px;height:36px;font-size:19px}
.is-big .pc-ovr b{font-size:46px}
.is-big .pc-name{font-size:20px}
.is-big .pc-sub{font-size:12.5px}
.is-big .ab{grid-template-columns:4.6em 1.2em 2.8em minmax(0,1fr);font-size:13px}
.is-big .ab-r,.is-big .ab-v{font-size:17px}
.is-big .ab-bar{height:6px}
.is-big .pc-fig svg{max-height:190px}
.pcard.is-mini{padding:6px}
.is-mini .pc-pos{min-width:24px;height:24px;font-size:13px}
.is-mini .pc-ovr small{display:none}
.is-mini .pc-ovr b{font-size:22px}
.is-mini .pc-name{font-size:12.5px}
.is-mini .pc-sub{font-size:10px}
.fig-body{fill:#22395A}.fig-cap{fill:#2E4B72}
.fig-num{fill:var(--text);font:700 21px var(--f-num)}
.r3 .fig-num,.r4 .fig-num{fill:var(--amber)}
.rk-S{color:var(--rk-S)}.rk-A{color:var(--rk-A)}.rk-B{color:var(--rk-B)}.rk-C{color:var(--rk-C)}.rk-D{color:var(--rk-D)}.rk-E{color:var(--rk-E)}.rk-F{color:var(--rk-F)}.rk-G{color:var(--rk-G)}
.bg-S{background:var(--rk-S)}.bg-A{background:var(--rk-A)}.bg-B{background:var(--rk-B)}.bg-C{background:var(--rk-C)}.bg-D{background:var(--rk-D)}.bg-E{background:var(--rk-E)}.bg-F{background:var(--rk-F)}.bg-G{background:var(--rk-G)}

/* 一覧・表 */
.lineup{display:grid}
.lu{display:grid;grid-template-columns:28px 32px minmax(0,1fr) 34px;align-items:center;gap:8px;width:100%;min-height:60px;padding:7px 10px;border-top:1px solid var(--line-2);text-align:left}
.lu:first-child{border-top:0}
.lu-no{font:700 22px/1 var(--f-num);color:var(--amber);text-align:center}
.lu-pos{display:grid;place-items:center;height:30px;border-radius:6px;background:var(--navy);border:1px solid var(--line);font-weight:900;font-size:15px}
.lu-pos.misfit{border-color:var(--red);color:var(--red-text)}
.lu-main{min-width:0}
.lu-main[type="button"]{width:100%}
.lu-edit .lu-pos{cursor:pointer}
.lu-swap{grid-column:3/5;min-height:32px;margin:0 0 5px 68px;border:1px solid var(--line);border-radius:6px;color:var(--text-2);font-size:11.5px;font-weight:700;text-align:center}
.lu-main b{display:block;font-size:14.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-main small{display:block;font-size:11px;color:var(--text-2)}
.lu-ovr{font:700 22px/1 var(--f-num);text-align:right}
.mini-abs{display:flex;gap:8px;margin-top:2px;font-size:11px;color:var(--text-2);white-space:nowrap}
.mini-abs span{display:inline-flex;align-items:baseline;gap:2px}
.mini-abs b{font:700 13px/1 var(--f-num)}
.mini-abs em{font:600 13px/1 var(--f-num);font-style:normal;color:var(--text)}
.next-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--turf);color:#fff;font-size:10.5px;line-height:1.7;vertical-align:2px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:8px 5px;font-size:11.5px;font-weight:700;color:var(--text-2);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 5px;text-align:right;font:600 15px/1 var(--f-num);border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:12px}
.tbl th:last-child,.tbl td:last-child{padding-right:12px}
.tbl .t-team{text-align:left;font:700 13.5px/1.2 var(--f-ja)}
.tbl tr.me td{background:rgba(255,176,32,.09)}
.tbl tr.me .t-team{color:var(--amber)}
.tbl tbody tr:last-child td{border-bottom:0}
.sched-row{display:grid;grid-template-columns:3.6em minmax(0,1fr) 3.6em 4.4em;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-top:1px solid var(--line-2);font-size:13.5px}
.sched-row:first-child{border-top:0}
.sched-row.is-next{background:rgba(47,143,78,.16)}
.sched-row .rd{font:600 13px/1 var(--f-num);color:var(--text-2)}
.sched-row .vs{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-row .ha{font-size:11.5px;color:var(--text-2)}
.res{text-align:right;font:600 14px/1 var(--f-num);color:var(--text-2)}
.res.W{color:var(--turf-text)}.res.L{color:var(--red-text)}.res.next{color:var(--amber);font-family:var(--f-ja);font-weight:900}
.modes{display:grid;gap:8px}
.mode,.row-link{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:left}
.mode b,.row-link b{display:block;font-size:15px;font-weight:900}
.mode small,.row-link small{display:block;font-size:11.5px;color:var(--text-2)}
.mode .ic,.row-link .ic{color:var(--text-2)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font:600 12.5px/1 var(--f-num)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:10px;background:var(--stand);border:1px solid var(--line)}
.seg button{min-height:44px;border-radius:7px;font-size:13.5px;font-weight:700;color:var(--text-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip-btn{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--text-2)}
.chip-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 12px;border-top:1px solid var(--line-2);font-size:13.5px}
.kv:first-child{border-top:0}
.kv>span:first-child{color:var(--text-2);font-weight:700}
.kv b{font-weight:900}
.kv b.num{font-size:18px}
.kv small{font-size:12px;color:var(--text-2)}
.prog{display:block;height:5px;margin-top:6px;border-radius:3px;background:var(--navy);overflow:hidden}
.prog i{display:block;height:100%;background:var(--amber)}
.detail .prog{margin:0 12px 10px}
.pips{display:inline-flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:2px;border:1px solid var(--amber)}
.pips i.on{background:var(--amber)}
.mission,.shop-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line-2)}
.mission:first-child,.shop-item:first-child{border-top:0}
.mission b,.shop-item b{display:block;font-size:14px;font-weight:700}
.mission small,.shop-item small{display:block;font-size:11.5px;color:var(--text-2)}
.owned{font-size:12px;font-weight:700;color:var(--turf-text);white-space:nowrap}
.scout-hero{display:grid;justify-items:center;gap:4px;padding:16px;border-radius:10px;background:var(--stand);border:2px solid #23384F}
.scout-pity{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--text-2)}
.scout-pity b{font:600 46px/1 var(--f-num)}
.scout-btns{display:grid;gap:10px}
.season-hero{display:flex;justify-content:center;align-items:baseline;gap:8px;padding:12px;font-weight:900;color:var(--text-2)}
.season-hero b{font:600 64px/1 var(--f-num)}
.data-btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.field{display:grid;gap:6px;padding:12px;border-top:1px solid var(--line-2)}
.field:first-child{border-top:0}
.field label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
.field output{font:600 15px/1 var(--f-num);color:var(--amber)}
.field input[type=range]{width:100%;height:44px;accent-color:var(--amber)}
.field select,.field input[type=text],.field input[type=number]{width:100%;min-height:44px;padding:0 10px;border-radius:8px;background:var(--navy);border:1px solid var(--line)}
.tag-protag{display:inline-block;padding:0 6px;border-radius:4px;background:var(--amber);color:var(--amber-ink);font-size:10.5px;font-weight:900;line-height:1.6;vertical-align:1px;margin-left:4px}
.tag-grade{display:inline-block;padding:0 5px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);font-size:10.5px;font-weight:700;line-height:1.5;vertical-align:1px;margin-left:4px}
.data-import{width:100%;min-height:132px;padding:10px;border-radius:8px;background:var(--navy);border:1px solid var(--line);color:var(--text);font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}
.data-file{width:100%;min-height:44px;padding:8px;border-radius:8px;background:var(--navy);border:1px solid var(--line);color:var(--text-2)}

/* スカウト演出 */
.reveal{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));background:var(--stand)}
.reveal-kind{font-size:13px;font-weight:700;color:var(--text-2)}
.flip{display:block;width:min(240px,64vw);aspect-ratio:5/7;perspective:900px}
.flip-in{position:relative;display:block;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.is-open .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;display:block;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip-back{display:grid;place-items:center;align-content:center;gap:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text-2);font-size:13px;font-weight:700}
.flip-back .ic{width:72px;height:72px;color:var(--amber)}
.flip-front{transform:rotateY(180deg)}
.flip-front .pcard{height:100%}
.flip.r3.is-open .pcard,.flip.r4.is-open .pcard{box-shadow:0 0 0 3px rgba(212,167,44,.35),0 0 40px rgba(212,167,44,.35)}
.reveal-after{display:grid;gap:12px;width:100%;max-width:340px}
.reveal-tag{text-align:center;font-weight:900}
.reveal-tag .new{display:inline-block;margin-right:8px;padding:0 8px;border-radius:4px;background:var(--amber);color:var(--amber-ink);font:700 13px/1.7 var(--f-num)}
.skip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);color:var(--text-2);font-weight:700}

/* 試合画面（試合エンジン接続点の外側だけを画面遷移が描く） */
.game{display:flex;flex-direction:column;height:100%;background:var(--navy)}
.game-top{flex:0 0 auto;display:flex;align-items:flex-start;gap:6px;padding:calc(8px + var(--safe-t)) 6px 8px 10px}
.sb{flex:1 1 auto;min-width:0;background:var(--stand);border:2px solid #23384F;border-radius:6px;padding:3px 8px 4px}
.sb table{width:100%;border-collapse:collapse;table-layout:fixed}
.sb th{font-size:10.5px;color:var(--text-2);font-weight:700;text-align:center;padding:1px 0}
.sb th:first-child{width:44%}
.sb td{font:600 17px/1.3 var(--f-num);text-align:center;color:var(--amber)}
.sb td.t{text-align:left;font:900 12.5px/1.3 var(--f-ja);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb td.now{background:rgba(255,176,32,.14)}
.sb td.sum{color:var(--text)}
.sb-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-2);margin-top:1px}
.sb-meta .outs{color:var(--amber);letter-spacing:1px}
.engine-mount{flex:1 1 auto;min-height:0;margin:0 10px;border:1px solid #3A506E;border-radius:8px;overflow-y:auto;background:#07152B}
.game-strip{flex:0 0 auto;height:64px;margin-bottom:var(--safe-b);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px 10px}
.strip-card{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:center;padding:3px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0}
.strip-card.wide{grid-column:1/-1;grid-template-columns:minmax(0,1fr)}
.sc-pos{display:grid;place-items:center;height:28px;border-radius:6px;background:var(--navy);font-weight:900;font-size:14px}
.sc-main{min-width:0}
.sc-main b{display:block;font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-main small{display:block;font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 2b 試合エンジン：キャンバスと操作盤（DOMは画面層の GameSurface が管理） */
.eng{position:relative;display:flex;flex-direction:column;min-height:100%}
.eng-stage{position:relative;flex:0 0 auto;background:#07152B;overflow:hidden}
.eng-canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:manipulation}
.eng-banner{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0;background:rgba(4,10,18,.24);transition:opacity .16s}
.eng-banner.show{opacity:1}.eng-banner b{font-size:32px;font-weight:900;color:#fff;text-shadow:0 3px 0 #101820}.eng-banner span{font-size:13px;font-weight:900;color:var(--amber)}
.eng-controls{display:grid;gap:8px;padding:9px;background:var(--stand);border-top:1px solid var(--line)}
.eng-row{display:flex;gap:8px;align-items:center}
.eng-row .eng-action{flex:1}
.eng-shift-val{font-size:13px;font-weight:900;min-width:86px;text-align:center}
.eng-aim{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:260px}
.eng-action.aim-cell{min-height:38px;font-size:12px}
.eng-action.aim-cell.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.eng-action.mash{background:var(--red);border-color:var(--red);color:#fff}
.anthem-row{display:flex;gap:4px;overflow:hidden;margin-bottom:10px}
.anthem-fig{flex:1;min-width:0}
.anthem-fig svg{width:100%;height:auto}
.screen{animation:scrIn .28s cubic-bezier(.22,.9,.3,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn,.tab,.mode,.row-link,.lu,.pcard,.eng-action,.seg button{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease;-webkit-tap-highlight-color:transparent}
.btn:active,.mode:active,.row-link:active,.lu:active,.eng-action:active{transform:scale(.97)}
.pcard:active{transform:scale(.985)}
button{ touch-action:manipulation }
.pcard{animation:cardIn .3s cubic-bezier(.22,.9,.3,1) both}
.pcard:nth-child(2){animation-delay:.03s}.pcard:nth-child(3){animation-delay:.06s}.pcard:nth-child(4){animation-delay:.09s}.pcard:nth-child(5){animation-delay:.12s}.pcard:nth-child(6){animation-delay:.15s}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eng-banner{transition:transform .16s cubic-bezier(.2,1.4,.4,1),opacity .16s ease;transform:scale(.85);opacity:0}
.eng-banner.show{transform:scale(1);opacity:1}
.eng-range{flex:1;accent-color:var(--amber);height:34px}
.eng-commentary{min-height:20px;font-size:14px;font-weight:900;color:var(--amber);letter-spacing:.02em}
.eng-commentary.pop{animation:cmtPop .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cmtPop{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
.eng-canvas{image-rendering:pixelated}
.hdr-in{padding-top:env(safe-area-inset-top)}
#tabs{padding-bottom:env(safe-area-inset-bottom)}
.eng-controls{padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.eng-status{min-height:20px;font-size:12px;font-weight:700;color:var(--text-2);text-align:center}
.eng-pitch-row{display:grid;grid-template-columns:minmax(0,1fr) 1fr;gap:8px}
.eng-select,.eng-action{min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font-size:14px;font-weight:900;text-align:center}
.eng-action.main{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.eng-action.swing{min-height:54px;background:var(--red);border-color:var(--red);color:#fff;font-size:19px;letter-spacing:.08em}
.eng-action.swing.pulse{transform:scale(.97)}
.eng-action:disabled,.eng-select:disabled{opacity:.38}
.eng-meter{height:6px;border-radius:3px;background:var(--panel);overflow:hidden}.eng-meter i{display:block;width:50%;height:100%;background:var(--turf-text)}
@media (max-height:700px){.eng-controls{gap:5px;padding:6px}.eng-action.swing{min-height:46px}.game-strip{height:58px}}

/* モーダル・広告・通知 */
.sheet-back{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,8,15,.74)}
.sheet{width:100%;max-width:430px;max-height:88%;overflow-y:auto;padding:18px 16px calc(18px + var(--safe-b));border-radius:14px 14px 0 0;background:var(--panel);border-top:2px solid var(--amber)}
.sheet h2{font-size:18px;font-weight:900}
.sheet>p{font-size:13.5px;color:var(--text-2);margin-top:6px}
.sheet .btn,.sheet .btn-row{margin-top:14px}
.lb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.lb-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:78px;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--navy);text-align:center}
.lb-day small{font-size:11px;color:var(--text-2);font-weight:700}
.lb-day b{font:600 20px/1 var(--f-num)}
.lb-day span{font-size:10.5px;line-height:1.3}
.lb-day.today{border:2px solid var(--amber)}
.lb-day.done{opacity:.5}
.lb-day.big{grid-column:span 2}
.ad{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#04080E}
.ad-tag{font-size:12px;font-weight:700;color:var(--text-2);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.ad-box{width:min(300px,80vw);aspect-ratio:4/5;display:grid;place-items:center;padding:20px;border:2px dashed #3A506E;border-radius:12px;text-align:center;color:var(--text-2);font-size:13.5px}
.ad-count{font:700 52px/1 var(--f-num);color:var(--amber)}
.toast-layer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b) + 12px);z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast{max-width:min(380px,calc(100% - 28px));padding:11px 16px;border-radius:10px;background:var(--text);color:var(--navy);font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px){.rotate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:var(--navy);text-align:center}.rotate b{font-size:18px;font-weight:900}}
.dbg-fab{position:fixed;right:max(10px,calc(50% - 205px));bottom:calc(var(--tab-h) + var(--safe-b) + 70px);z-index:60;min-height:44px;padding:0 14px;border-radius:22px;background:#000;border:1px solid var(--amber);color:var(--amber);font-size:12.5px;font-weight:700}
.fps{position:fixed;left:8px;top:calc(var(--safe-t) + 62px);z-index:70;padding:3px 7px;border-radius:5px;background:#000;color:var(--turf-text);font:600 12px/1.2 var(--f-num);pointer-events:none}
.dbg-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dbg-list .btn{margin-top:0;min-height:48px;font-size:13.5px}
.dbg-out{margin-top:12px;max-height:38vh;overflow:auto;padding:10px;border-radius:8px;background:var(--navy);font:500 11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   コードの区画は仕様書 A-12「モジュール境界」と同じ。定義の順番＝依存の順番：
     共通基盤（CONFIG・Util・Events・Save・SelfTest）
     → 4 経済・広告（Economy・Ads・Missions・LoginBonus）
     → 3 育成（Growth）
     → 2a リーグ進行（League・Correction）
     → 2b 試合エンジン本体（MatchEngine：legacy-game.html から統合済み）
     → 1 画面遷移（View・Shell・Modals・GameHud・Screens・Router・Actions・App）
     → デバッグ（Debug）→ 自己テストの登録 → 起動
   依存の向き：1 → 2a・2b・3・4 ／ 2a → 3・4 ／ 3 → 4 ／ 2b → なし（試合の通知を出すだけ）
   localStorage に触れてよいのは Save だけ。index.html は開発用キーだけを使い、本番キーには触れない。
   ===================================================================== */

/* =====================================================================
   共通基盤：定数 CONFIG（バランス値・仮置き値・段階ごとの機能スイッチ・表示名）
   ===================================================================== */
const CONFIG = Object.freeze({
  VERSION: "'98甲子園準拠 段階A 1.0",
  /* BUILD_CONFIG_START: build-prod.js はこの範囲だけを置換する */
  BUILD: 'development',
  STORAGE: Object.freeze({
    main: 'gunya.save.v2.dev',
    bak: 'gunya.save.v2.dev.bak',
    broken: 'gunya.save.v2.dev.broken',
    legacyV1: 'gunya-yakyu-save-v3.dev',
    backupV1: 'gunya.backup.v1.dev',
    migrationEnabled: true,
  }),
  /* BUILD_CONFIG_END */
  FEATURES: Object.freeze({
    persistence: true,     // CONFIG.STORAGE で開発用／本番用キーを切り替える
    league: false,         // 段階A：6球団リーグは主モードから外し無効化
    tournament: true,      // 段階A：地方予選（3試合）→甲子園本大会（3試合）の大会トーナメント
    leagueProgress: false, // 旧リーグ進行は無効化（大会カレンダー進行に置換）
    leagueRewards: true,   // 段階2・A：公式戦の報酬を試合終了時にまとめて付与
    correction: true,      // 段階2・A：能力補正・学校特性補正を MatchEngine.HOOKS 経由で有効にする
    growth: true,          // 段階3・A：経験値・特訓・限界突破・スカウト1年生排出・進級と卒業
    daily: true,           // 段階3：ログボ・ミッションの付与と公式戦以外の1日上限
  }),
  PROVISIONAL: Object.freeze({  // 仕様書 D の仮置き
    Q1_nonLeagueDailyCap: 300,  // Q1=B：リーグ戦以外のコイン獲得は1日合計300まで
    Q2_correctionK: 0.30,       // Q2=B：能力の効き具合 k
    Q3_orientation: 'portrait', // Q3=A：全画面を縦で統一（横向きのスマホでは案内を出す）
  }),
  ECONOMY: Object.freeze({
    startCoins: 100, startScoutTickets: 3, hitCoins: 20, homerunCoins: 50,
    leagueResultCoins: Object.freeze({ W: 100, D: 60, L: 40 }),
    seasonRankRewards: Object.freeze([
      { label: '1位', coins: 1500, guaranteeTickets: 1 }, { label: '2位', coins: 1000 },
      { label: '3位', coins: 700 }, { label: '4位以下', coins: 400 },
    ]),
    maxCoins: 9999999, maxTickets: 999, ledgerSize: 50,
  }),
  ADS: Object.freeze({ settingsAdSeconds: 4, rewardAdSeconds: 5 }),
  SCOUT: Object.freeze({
    rates: Object.freeze({ 4: 0.03, 3: 0.12, 2: 0.35, 1: 0.50 }),
    guaranteeRates: Object.freeze({ 4: 0.20, 3: 0.80 }),
    costs: Object.freeze({ single: { coins: 300, scoutTickets: 1 }, ten: { coins: 3000 }, guarantee: { guaranteeTickets: 1 } }),
    pity: 50,
  }),
  GROWTH: Object.freeze({
    maxLv: Object.freeze({ 1: 20, 2: 30, 3: 40, 4: 50 }), limitBreakLv: 5, limitBreakMax: 4,
    trainCost: 100, trainExp: 150, appearanceExp: 60, winExp: 40, mvpExp: 100, misfitDefense: 0.7,
    duplicateCoins: Object.freeze({ 1: 100, 2: 200, 3: 500, 4: 1000 }),
  }),
  LEAGUE: Object.freeze({ rounds: 10, innings: 3, dayBoundaryHour: 4 }),

/* ---- 共通基盤：道具 Util ---- */
const Util = (() => {
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  const fmt = (n) => Number(n || 0).toLocaleString('ja-JP');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  // 日付キー：端末時刻から4時間引いた日の年月日（仕様書 A-8）
  const dayKey = (date = new Date()) => {
    const d = new Date(date.getTime() - CONFIG.LEAGUE.dayBoundaryHour * 3600000);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };
  // シード付き乱数（mulberry32）。同じシードなら同じ並び
  const seeded = (seed) => () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const copy = (o) => JSON.parse(JSON.stringify(o));
  return { esc, fmt, clamp, dayKey, seeded, copy };
})();

/* ---- 共通基盤：通知バス Events（試合の通知 match:* は 2b だけが出す） ---- */
const Events = (() => {
  const map = new Map();
  function on(type, fn) {
    if (!map.has(type)) map.set(type, new Set());
    map.get(type).add(fn);
    return () => map.get(type).delete(fn);
  }
  function emit(type, payload) {
    const set = map.get(type);
    if (!set) return;
    [...set].forEach((fn) => { try { fn(payload); } catch (e) { console.error('[Events]', type, e); } });
  }
  return { on, emit };
})();

/* ---- 共通基盤：保存基盤 Save（localStorage に触れてよいのはここだけ） ---- */
const Save = (() => {
  // キーと移行スイッチはCONFIGだけで切り替える。v1キーはgetItem以外に使用しない。
  const KEYS = Object.freeze({ ...CONFIG.STORAGE });
  const slices = new Map();
  const meta = { createdAt: new Date().toISOString(), migratedFrom: null, migrationReport: [], migration: { completed: false, status: 'pending', sourceKey: KEYS.legacyV1, at: null } };
  let last = null;
  let defaults = null;
  let commits = 0;
  let testDepth = 0;
  const register = (name, api) => { slices.set(name, api); };
  function snapshot() {
    const data = { schemaVersion: 2, meta: { ...meta, updatedAt: new Date().toISOString() } };
    slices.forEach((api) => Object.assign(data, api.exportSlice()));
    return data;
  }
  const plain = (o) => !!(o && typeof o === 'object' && !Array.isArray(o));
  const valid = (data) => !!(plain(data) && data.schemaVersion === 2);
  const parse = (raw) => {
    if (!raw) return null;
    try { const data = JSON.parse(raw); return valid(data) ? data : null; } catch (e) { return null; }
  };
  function memoryStorage(initial = {}) {
    const map = new Map(Object.entries(initial).map(([k, v]) => [k, String(v)]));
    return { getItem: (k) => map.has(k) ? map.get(k) : null, setItem: (k, v) => map.set(k, String(v)), removeItem: (k) => map.delete(k), seed: (k, v) => map.set(k, String(v)), dump: () => Object.fromEntries(map) };
  }
  function validateData(data) {
    const errors = [];
    const reqObj = (key) => { if (!plain(data && data[key])) errors.push(`${key} がオブジェクトではありません`); };
    if (!plain(data)) return { ok: false, reason: 'JSONのルートがオブジェクトではありません' };
    if (data.schemaVersion !== 2) errors.push('schemaVersion は 2 である必要があります');
    ['meta', 'wallet', 'unlocks', 'premium', 'team', 'cards', 'scout', 'league', 'stats', 'settings'].forEach(reqObj);
    if (plain(data.wallet)) {
      [['coins', 9999999], ['scoutTickets', 999], ['guaranteeTickets', 999]].forEach(([key, max]) => {
        if (!Number.isInteger(data.wallet[key]) || data.wallet[key] < 0 || data.wallet[key] > max) errors.push(`wallet.${key} が範囲外です`);
      });
    }
    if (plain(data.unlocks)) ['pitches', 'pitchingForms', 'battingForms'].forEach((key) => { if (!Array.isArray(data.unlocks[key]) || data.unlocks[key].some((x) => typeof x !== 'string')) errors.push(`unlocks.${key} が文字列配列ではありません`); });
    if (plain(data.premium) && typeof data.premium.pass !== 'boolean') errors.push('premium.pass が真偽値ではありません');
    if (plain(data.team)) {
      if (typeof data.team.name !== 'string' || !data.team.name.trim()) errors.push('team.name が空です');
      if (!Array.isArray(data.team.lineup) || data.team.lineup.length !== 9) errors.push('team.lineup は9人必要です');
      if (!Array.isArray(data.team.rotation) || data.team.rotation.length !== 3) errors.push('team.rotation は3人必要です');
    }
    if (plain(data.league) && (!Number.isInteger(data.league.season) || data.league.season < 1 || !Array.isArray(data.league.results))) errors.push('league のシーズンまたは結果が不正です');
    if (plain(data.stats) && !plain(data.stats.career)) errors.push('stats.career がありません');
    if (plain(data.settings)) {
      if (typeof data.settings.pitchingForm !== 'string' || typeof data.settings.battingForm !== 'string') errors.push('settings のフォームが不正です');
      if (!plain(data.settings.myPitch) || !plain(data.settings.motion)) errors.push('settings の変化球またはモーションが不正です');
    }
    ['school', 'protagonist', 'calendar', 'grades'].forEach((key) => { if (data[key] !== undefined && !plain(data[key])) errors.push(`${key} がオブジェクトではありません`); });
    if (data.graduates !== undefined && !Array.isArray(data.graduates)) errors.push('graduates が配列ではありません');
    return errors.length ? { ok: false, reason: errors.slice(0, 4).join('／'), errors } : { ok: true, data };
  }
  const safeInt = (v, fallback = 0, max = Number.MAX_SAFE_INTEGER) => Number.isFinite(v) ? Math.min(max, Math.max(0, Math.floor(v))) : fallback;
  function convertV1(v1) {
    const data = Util.copy(defaults || snapshot());
    const report = [];
    const pitchMap = { straight: 'fastball', curve: 'curve', slider: 'slider', fork: 'fork', shoot: 'shoot', sinker: 'sinker', custom: 'mypitch' };
    const poseMap = { square: 'standard', open: 'open', closed: 'closed', ichi: 'oneLeg' };
    const dirMap = { type: 'down', drop: 'down', slide: 'left', rise: 'up', diag: 'left', rev: 'right' };
    data.wallet.coins = safeInt(v1.coins, data.wallet.coins, 9999999);
    if (plain(v1.app)) data.wallet.scoutTickets = safeInt(v1.app.tickets, data.wallet.scoutTickets, 999);
    const unlockedPitches = new Set(data.unlocks.pitches);
    if (plain(v1.ownedPitch)) Object.keys(v1.ownedPitch).forEach((id) => { if (v1.ownedPitch[id] === true && pitchMap[id]) unlockedPitches.add(pitchMap[id]); });
    data.unlocks.pitches = [...unlockedPitches];
    const unlockedForms = new Set(data.unlocks.battingForms);
    if (plain(v1.ownedPose)) Object.keys(v1.ownedPose).forEach((id) => { if (v1.ownedPose[id] === true && poseMap[id]) unlockedForms.add(poseMap[id]); });
    data.unlocks.battingForms = [...unlockedForms];
    if (plain(v1.ownedPose) && v1.ownedPose.kannushi === true) report.push('神主打法：v2に同一フォームがないため未移行');
    data.premium.pass = v1.premium === true;
    if (pitchMap[v1.selPitch]) data.settings.selectedPitch = pitchMap[v1.selPitch];
    if (poseMap[v1.pose]) data.settings.battingForm = poseMap[v1.pose];
    else if (v1.pose === 'kannushi') report.push('選択中の神主打法：v2標準フォームのまま');
    if (dirMap[v1.brkDir]) data.settings.myPitch.direction = dirMap[v1.brkDir];
    data.settings.myPitch.amount = safeInt(v1.brkAmt, data.settings.myPitch.amount, 100);
    if (plain(v1.mot)) {
      data.settings.motion.armSwing = safeInt(v1.mot.arm, data.settings.motion.armSwing, 100);
      data.settings.motion.release = safeInt(v1.mot.rel, data.settings.motion.release, 100);
      data.settings.motion.swingSpeed = safeInt(v1.mot.swing, data.settings.motion.swingSpeed, 100);
      if (['fol', 'take', 'batFol'].some((k) => Number.isFinite(v1.mot[k]))) report.push('フォロースルー・テイクバック：v2に保存先がないため未移行');
    }
    if (plain(v1.records)) {
      const hr = safeInt(v1.records.totalHR);
      data.stats.career.homeruns = hr;
      data.stats.career.hits = safeInt(v1.records.totalHits) + hr;
      report.push('ベストスコア・最長飛距離・プレイ回数・累計獲得コイン：v2に保存先がないため未移行');
    }
    if (plain(v1.app)) {
      if (plain(v1.app.settings) && typeof v1.app.settings.teamName === 'string' && v1.app.settings.teamName.trim()) data.team.name = v1.app.settings.teamName.trim().slice(0, 20);
      if (Number.isFinite(v1.app.scoutCount)) data.scout.totalPulls = safeInt(v1.app.scoutCount);
      const results = plain(v1.app.league) && Array.isArray(v1.app.league.results) ? v1.app.league.results : [];
      data.stats.career.leagueWins = results.filter((x) => x && x.res === 'win').length;
      if (plain(v1.app.players) || plain(v1.app.league) || plain(v1.app.missions)) report.push('旧選手・旧リーグ進行・旧ミッション：v2とデータモデルが異なるため未移行');
    }
    data.meta.migratedFrom = KEYS.legacyV1;
    data.meta.migrationReport = report;
    data.meta.migration = { completed: true, status: 'migrated', sourceKey: KEYS.legacyV1, at: new Date().toISOString() };
    return data;
  }
  function migrateFromV1(store = window.localStorage) {
    const raw = store.getItem(KEYS.legacyV1);
    const data = Util.copy(defaults || snapshot());
    let status = 'absent';
    let out = data;
    if (raw !== null) {
      store.setItem(KEYS.backupV1, raw); // 検証前の原文を必ず退避する
      let old = null;
      try { old = JSON.parse(raw); } catch (e) { old = null; }
      if (plain(old)) { out = convertV1(old); status = 'migrated'; }
      else {
        status = 'corrupt';
        out.meta.migrationReport = ['v1原文をJSONオブジェクトとして読めなかったため新規開始'];
      }
    }
    if (status !== 'migrated') {
      out.meta.migratedFrom = null;
      out.meta.migration = { completed: true, status, sourceKey: KEYS.legacyV1, at: new Date().toISOString() };
    }
    store.setItem(KEYS.main, JSON.stringify(out));
    return { data: out, source: status === 'migrated' ? 'v1-migrated' : status === 'corrupt' ? 'new-v1-corrupt' : 'new-v1-absent', migrated: status === 'migrated' };
  }
  function readForLoad(store = window.localStorage) {
    try {
      const raw = store.getItem(KEYS.main);
      if (!raw) return { data: null, source: 'new' };
      const main = parse(raw);
      if (main) return { data: main, source: 'v2' };
      store.setItem(KEYS.broken, raw);
      const backupRaw = store.getItem(KEYS.bak);
      const backup = parse(backupRaw);
      if (!backup) return { data: null, source: 'new-corrupt' };
      // 復旧時は壊れた本体を .bak に回さず、検証済みバックアップを本体へ戻す。
      store.setItem(KEYS.main, backupRaw);
      return { data: backup, source: 'backup', recovered: true };
    } catch (e) { return { data: null, source: 'storage-unavailable', error: e.name }; }
  }
  function takeMeta(data) {
    if (!plain(data && data.meta)) return;
    if (typeof data.meta.createdAt === 'string') meta.createdAt = data.meta.createdAt;
    meta.migratedFrom = typeof data.meta.migratedFrom === 'string' ? data.meta.migratedFrom : null;
    meta.migrationReport = Array.isArray(data.meta.migrationReport) ? data.meta.migrationReport.map(String) : [];
    if (plain(data.meta.migration)) meta.migration = { ...meta.migration, ...data.meta.migration };
  }
  // 読み込んで各モジュールに渡す。破損本体は .broken に退避して .bak から復旧する。
  function load(store = window.localStorage) {
    if (!defaults) defaults = Util.copy(snapshot());
    let found = CONFIG.FEATURES.persistence ? readForLoad(store) : { data: null, source: 'new' };
    if (!found.data && found.source !== 'storage-unavailable' && CONFIG.FEATURES.persistence && KEYS.migrationEnabled) {
      try { found = migrateFromV1(store); } catch (e) { found = { data: null, source: 'storage-unavailable', error: e.name }; }
    }
    let data = found.data;
    const needsV2Upgrade = !!(data && KEYS.migrationEnabled && !(data.meta && data.meta.migration && data.meta.migration.completed));
    const needsGradeMigration = !!(data && !(data.grades && data.grades.migrated === true));
    // 段階3以前の有効なv2がある場合は上書き移行せず、二重移行防止フラグだけを追加する。
    if (needsV2Upgrade) {
      const upgraded = Util.copy(data);
      upgraded.meta = plain(upgraded.meta) ? upgraded.meta : {};
      upgraded.meta.migration = { completed: true, status: 'existing-v2', sourceKey: KEYS.legacyV1, at: new Date().toISOString() };
      data = upgraded;
    }
    takeMeta(data);
    slices.forEach((api) => api.importSlice(data || {}));
    last = snapshot();
    if ((needsV2Upgrade || needsGradeMigration) && CONFIG.FEATURES.persistence) {
      try {
        if (!parse(store.getItem(KEYS.bak))) store.setItem(KEYS.bak, JSON.stringify(found.data));
        store.setItem(KEYS.main, JSON.stringify(last));
      } catch (e) {}
    }
    return { source: found.source, recovered: !!found.recovered, migrated: !!found.migrated, gradeMigrated: needsGradeMigration };
  }
  // 状態が変わる操作の直後に呼ぶ。保存前の世代は毎回 .bak へ退避する。
  function commit(reason) {
    last = snapshot();
    last.meta.reason = reason;
    if (testDepth) return { ok: true, persisted: false, test: true };
    if (!CONFIG.FEATURES.persistence) return { ok: true, persisted: false };
    try {
      const prev = window.localStorage.getItem(KEYS.main);
      if (parse(prev)) window.localStorage.setItem(KEYS.bak, prev);
      window.localStorage.setItem(KEYS.main, JSON.stringify(last));
      commits += 1;
      return { ok: true, persisted: true };
    } catch (e) { return { ok: false, persisted: false, error: e.name }; }
  }
  const peek = () => snapshot();
  const exportText = () => JSON.stringify(peek(), null, 2);
  function importText(text, store = window.localStorage) {
    let data;
    try { data = JSON.parse(String(text || '')); } catch (e) { return { ok: false, reason: `JSONの構文エラー：${e.message}` }; }
    const checked = validateData(data);
    if (!checked.ok) return checked;
    try {
      const current = store.getItem(KEYS.main);
      store.setItem(KEYS.bak, parse(current) ? current : JSON.stringify(peek()));
      store.setItem(KEYS.main, JSON.stringify(data));
      if (store === window.localStorage) { takeMeta(data); last = Util.copy(data); }
      return { ok: true, data };
    } catch (e) { return { ok: false, reason: `保存できません：${e.name}` }; }
  }
  function reset(store = window.localStorage) {
    try {
      [KEYS.main, KEYS.bak, KEYS.broken, KEYS.backupV1].forEach((key) => store.removeItem(key));
      const clean = Util.copy(defaults || snapshot());
      clean.meta.createdAt = new Date().toISOString();
      clean.meta.updatedAt = clean.meta.createdAt;
      clean.meta.migratedFrom = null;
      clean.meta.migrationReport = [];
      clean.meta.migration = { completed: true, status: 'reset', sourceKey: KEYS.legacyV1, at: clean.meta.createdAt };
      store.setItem(KEYS.main, JSON.stringify(clean)); // v1を残したまま再移行を防ぎ、新規状態で起動する
      if (store === window.localStorage) { takeMeta(clean); last = clean; }
      return { ok: true };
    } catch (e) { return { ok: false, reason: `初期化できません：${e.name}` }; }
  }
  // 内蔵テストはメモリ上の隔離ストレージだけを使い、ブラウザの実データに触れない。
  function testPersistence() {
    if (!CONFIG.FEATURES.persistence) return { roundTrip: false, recovery: false };
    const store = memoryStorage();
    const sample = snapshot(); sample.meta.reason = 'selftest-roundtrip';
    const text = JSON.stringify(sample);
    store.setItem(KEYS.main, text);
    const roundTrip = JSON.stringify(parse(store.getItem(KEYS.main))) === text;
    store.setItem(KEYS.bak, text); store.setItem(KEYS.main, '{broken-json');
    const recovered = readForLoad(store);
    const recovery = recovered.source === 'backup' && store.getItem(KEYS.broken) === '{broken-json' && store.getItem(KEYS.main) === text;
    return { roundTrip, recovery };
  }
  function testMigration() {
    const fixture = { coins: 4321, ownedPitch: { straight: true, curve: true, custom: true }, ownedPose: { square: true, open: true, ichi: true, kannushi: true }, premium: true, pose: 'ichi', selPitch: 'custom', brkDir: 'rev', brkAmt: 77, mot: { arm: 11, rel: 22, fol: 33, swing: 44, take: 55, batFol: 66 }, records: { bestScore: 99, bestDist: 123, totalHR: 7, totalHits: 13, games: 8, totalCoins: 9000 }, app: { tickets: 4, scoutCount: 9, players: { ponta: 2 }, league: { results: [{ res: 'win' }, { res: 'loss' }, { res: 'win' }] }, missions: { hr1: true }, settings: { teamName: '移行テスト球団' } } };
    const raw = JSON.stringify(fixture);
    const store = memoryStorage({ [KEYS.legacyV1]: raw });
    const first = migrateFromV1(store);
    const mapped = first.data;
    const legacyAfterFirst = store.getItem(KEYS.legacyV1);
    store.seed(KEYS.legacyV1, JSON.stringify({ ...fixture, coins: 1 }));
    const second = readForLoad(store);
    const corruptRaw = '{v1-broken';
    const brokenStore = memoryStorage({ [KEYS.legacyV1]: corruptRaw });
    const broken = migrateFromV1(brokenStore);
    return {
      mapped, raw, backup: store.getItem(KEYS.backupV1), legacyAfterFirst, legacyAfter: JSON.parse(store.getItem(KEYS.legacyV1)), second: second.data,
      broken: broken.data, brokenBackup: brokenStore.getItem(KEYS.backupV1), brokenRaw: corruptRaw,
    };
  }
  function testDataManagement() {
    const store = memoryStorage();
    const text = exportText();
    store.setItem(KEYS.main, text);
    const resetResult = reset(store);
    const clean = store.getItem(KEYS.main);
    const imported = importText(text, store);
    const roundTrip = imported.ok && JSON.stringify(JSON.parse(store.getItem(KEYS.main))) === JSON.stringify(JSON.parse(text)) && store.getItem(KEYS.bak) === clean;
    const before = store.getItem(KEYS.main);
    const badSyntax = importText('{bad', store);
    const badShape = importText(JSON.stringify({ schemaVersion: 2 }), store);
    return { resetResult, imported, roundTrip, badSyntax, badShape, unchanged: before === store.getItem(KEYS.main) };
  }
  function testScope(fn) {
    const beforeLast = last;
    const beforeCommits = commits;
    testDepth += 1;
    try { return fn(); }
    finally { testDepth -= 1; last = beforeLast; commits = beforeCommits; }
  }
  return { KEYS, register, load, commit, peek, exportText, importText, reset, validateData, testPersistence, testMigration, testDataManagement, testScope, commitCount: () => commits };
})();

/* ---- 共通基盤：自己テスト SelfTest（関数は true か、ずれの説明を返す） ---- */
const SelfTest = (() => {
  const tests = [];
  const add = (name, fn) => { tests.push({ name, fn }); };
  function run() {
    const failures = [];
    let passed = 0;
    tests.forEach(({ name, fn }) => {
      try { const r = fn(); if (r === true) passed++; else failures.push(`${name}：${r === false ? '期待と違う' : r}`); }
      catch (e) { failures.push(`${name}：${e.message}`); }
    });
    return { total: tests.length, passed, failed: failures.length, failures };
  }
  return { add, run };
})();

  // ショップの品目。名前と価格は仮：現行HTMLの値に置き換える（initial は最初から使える）

    { id: 'pform-over', kind: 'pitchingForm', key: 'overhand', name: 'オーバースロー', price: 0, initial: true },
    { id: 'pform-three', kind: 'pitchingForm', key: 'threeQuarter', name: 'スリークォーター', price: 200 },
    { id: 'pform-side', kind: 'pitchingForm', key: 'side', name: 'サイドスロー', price: 300 },
    { id: 'pform-under', kind: 'pitchingForm', key: 'under', name: 'アンダースロー', price: 300 },
    { id: 'pform-tornado', kind: 'pitchingForm', key: 'tornado', name: 'トルネード', price: 500 },
    { id: 'pform-spread', kind: 'pitchingForm', key: 'spread', name: '開脚フォーム', price: 400 },
    { id: 'pform-spin', kind: 'pitchingForm', key: 'spin', name: '回転フォーム', price: 400 },
    { id: 'pform-dogeza', kind: 'pitchingForm', key: 'dogeza', name: '土下座フォーム', price: 600 },
    { id: 'bform-standard', kind: 'battingForm', key: 'standard', name: 'スタンダード', price: 0, initial: true },
    { id: 'bform-open', kind: 'battingForm', key: 'open', name: 'オープンスタンス', price: 200 },
    { id: 'bform-closed', kind: 'battingForm', key: 'closed', name: 'クローズドスタンス', price: 200 },
    { id: 'bform-oneleg', kind: 'battingForm', key: 'oneLeg', name: '一本足打法', price: 300 },
    { id: 'bform-sway', kind: 'battingForm', key: 'sway', name: '振り子打法', price: 500 },
  ]);
  const LIST = { pitch: 'pitches', pitchingForm: 'pitchingForms', battingForm: 'battingForms' };
  const PACKS = Object.freeze([
    { id: 'coins-s', name: 'コインパック 小', coins: 500 },
    { id: 'coins-l', name: 'コインパック 大', coins: 1500 },
    { id: 'premium', name: 'プレミアムパス', premium: true },
  ]);
  const REWARD = Object.freeze({ shop: { gain: { coins: 50 }, perDay: 3, label: '50コイン' } }); // 仮：現行のリワード広告に合わせる
  const DAILY = Object.freeze([
    { id: 'playLeague', name: 'リーグ戦を1試合プレイする', goal: 1, reward: { coins: 100 }, scope: 'リーグ戦' },
    { id: 'hits5', name: 'ヒットを5本打つ', goal: 5, reward: { coins: 100 }, scope: '全モード' },
    { id: 'k3', name: '三振を3つ奪う', goal: 3, reward: { coins: 100 }, scope: '全モード' },
  ]);
  const ALL_CLEAR = Object.freeze({ id: 'allClear', name: '3つすべて受け取る', reward: { scoutTickets: 1 } });
  const ACHIEVEMENTS = Object.freeze([
    { id: 'firstWin', name: 'リーグ戦で初勝利', goal: 1, stat: 'leagueWins', reward: { coins: 300 } },
    { id: 'wins10', name: 'リーグ戦で通算10勝', goal: 10, stat: 'leagueWins', reward: { scoutTickets: 3 } },
    { id: 'hr10', name: '通算本塁打10本', goal: 10, stat: 'homeruns', reward: { coins: 300 } },
    { id: 'hr50', name: '通算本塁打50本', goal: 50, stat: 'homeruns', reward: { coins: 1000 } },
    { id: 'hr100', name: '通算本塁打100本', goal: 100, stat: 'homeruns', reward: { guaranteeTickets: 1 } },
    { id: 'champion', name: 'シーズン優勝', goal: 1, reward: { coins: 1000 } },
    { id: 'lv20', name: '選手を1人Lv20にする', goal: 1, reward: { coins: 500 } },
    { id: 'legend', name: '★4の選手を獲得する', goal: 1, reward: { coins: 500 } },
  ]);
  const LOGIN_TABLE = Object.freeze([
    { day: 1, reward: { coins: 100 } }, { day: 2, reward: { coins: 150 } }, { day: 3, reward: { scoutTickets: 1 } },
    { day: 4, reward: { coins: 200 } }, { day: 5, reward: { coins: 200 } }, { day: 6, reward: { coins: 250 } },
    { day: 7, reward: { guaranteeTickets: 1 } },
  ]);

  const s = {
    coins: E.startCoins, scoutTickets: E.startScoutTickets, guaranteeTickets: 0,
    ledger: [],
    dailyCap: { dayKey: null, nonLeagueEarned: 0 },
    unlocks: { pitches: ['fastball'], pitchingForms: ['overhand'], battingForms: ['standard'] },
    premium: { pass: false, purchases: [] },
    ads: { dayKey: null, rewardCount: 0 }, // 仕様書 A-10 に未記載。段階4で項目を追記するか決める
    missions: {
      dayKey: null, progress: { playLeague: 0, hits5: 0, k3: 0 }, claimed: {}, allClearClaimed: false,
      achievements: {}, facts: { champion: 0, lv20: 0, legend: 0 },
    },
    login: { lastDayKey: null, count: 0 },
  };
  let career = { hits: 0, homeruns: 0, strikeouts: 0, leagueWins: 0 };
  let pendingMatch = null;
  let pendingMissions = null;
  let lastMatchRewards = null;
  let loginShownThisSession = false;

  const rewardText = (r) => (r.coins ? `${Util.fmt(r.coins)}コイン` : r.scoutTickets ? `スカウトチケット${r.scoutTickets}枚` : r.guaranteeTickets ? `★3以上確定チケット${r.guaranteeTickets}枚` : '');
  const wallet = () => ({ coins: s.coins, scoutTickets: s.scoutTickets, guaranteeTickets: s.guaranteeTickets });
  function log(cur, delta, reason) {
    s.ledger.unshift({ at: new Date().toISOString(), cur, delta, reason });
    if (s.ledger.length > E.ledgerSize) s.ledger.length = E.ledgerSize;
  }
  function changed(reason, persist = true) { Events.emit('wallet:changed', wallet()); if (persist) Save.commit(reason); }
  function canSpend(cost = {}) { return CURRENCIES.every((c) => (cost[c] || 0) <= s[c]); }
  function spend(cost, reason, options = {}) {
    if (!canSpend(cost)) return false;
    CURRENCIES.forEach((c) => { const v = Math.floor(cost[c] || 0); if (v > 0) { s[c] -= v; log(c, -v, reason); } });
    changed(reason, options.commit !== false);
    return true;
  }
  function capNonLeague(v, date) {
    const k = Util.dayKey(date);
    if (s.dailyCap.dayKey !== k) s.dailyCap = { dayKey: k, nonLeagueEarned: 0 };
    const g = Math.min(v, Math.max(0, CONFIG.PROVISIONAL.Q1_nonLeagueDailyCap - s.dailyCap.nonLeagueEarned));
    s.dailyCap.nonLeagueEarned += g;
    return g;
  }
  // source：nonLeague（非リーグ試合）と ad だけがQ1の1日上限対象。
  // mission / login / duplicate は各機能に回数制限があるため上限対象外。
  function earn(gain, reason, source = 'other', options = {}) {
    const out = {};
    CURRENCIES.forEach((c) => {
      let v = Math.max(0, Math.floor(gain[c] || 0));
      if (!v) return;
      v = Math.min(v, (c === 'coins' ? E.maxCoins : E.maxTickets) - s[c]);
      if (c === 'coins' && ['nonLeague', 'ad'].includes(source) && CONFIG.FEATURES.daily) v = capNonLeague(v, options.date);
      if (v > 0) { s[c] += v; log(c, v, reason); out[c] = v; }
    });
    if (Object.keys(out).length) changed(reason, options.commit !== false);
    return out;
  }
  const isUnlocked = (item) => s.unlocks[LIST[item.kind]].includes(item.key);
  const getUnlocks = () => Util.copy(s.unlocks);
  const getCatalog = () => CATALOG.map((i) => ({ ...i, unlocked: isUnlocked(i), affordable: s.coins >= i.price }));
  function buyUnlock(itemId) {
    const item = CATALOG.find((i) => i.id === itemId);
    if (!item) return { ok: false, reason: '見つからない品目です' };
    if (isUnlocked(item)) return { ok: false, reason: 'もう解禁しています' };
    if (!spend({ coins: item.price }, `unlock:${item.id}`, { commit: false })) return { ok: false, reason: 'コインが足りません' };
    s.unlocks[LIST[item.kind]].push(item.key);
    Events.emit('unlocks:changed', getUnlocks());
    Save.commit('unlock');
    return { ok: true, item };
  }
  const getPacks = () => PACKS.map((p) => ({ ...p, owned: !!(p.premium && s.premium.pass) }));
  function demoPurchase(packId) {
    const p = PACKS.find((x) => x.id === packId);
    if (!p) return { ok: false, reason: '見つからないパックです' };
    if (p.premium && s.premium.pass) return { ok: false, reason: 'もう持っています' };
    s.premium.purchases.push({ id: p.id, at: new Date().toISOString() });
    if (p.premium) { s.premium.pass = true; Events.emit('premium:changed', true); Save.commit('demoPurchase'); }
    else earn({ coins: p.coins }, `demoPurchase:${p.id}`, 'purchase');
    return { ok: true, pack: p };
  }

  // 公式戦（大会・旧リーグ）報酬はpendingに置いて終了時だけ確定。非公式戦の試合コインは従来どおり即時付与する。
  const isOfficialMode = (m) => m === 'league' || m === 'tournament';
  Events.on('match:start', (e) => { pendingMatch = isOfficialMode(e.mode) ? { mode: e.mode, hits: 0, homeruns: 0 } : null; });
  Events.on('match:hit', (e) => {
    if (e.side !== 'user') return;
    const hr = e.kind === 'HR';
    if (!isOfficialMode(e.mode)) { earn({ coins: hr ? E.homerunCoins : E.hitCoins }, hr ? 'homerun' : 'hit', 'nonLeague'); return; }
    if (!pendingMatch) return;
    pendingMatch[hr ? 'homeruns' : 'hits'] += 1;
  });
  function settleMatch(e) {
    if (!isOfficialMode(e.mode) || !pendingMatch) { lastMatchRewards = null; pendingMatch = null; return null; }
    const p = pendingMatch;
    const r = { result: e.result, hits: p.hits, hitCoins: p.hits * E.hitCoins, homeruns: p.homeruns, homerunCoins: p.homeruns * E.homerunCoins, resultCoins: E.leagueResultCoins[e.result] || 0, granted: CONFIG.FEATURES.leagueRewards };
    r.total = r.hitCoins + r.homerunCoins + r.resultCoins;
    if (r.granted && r.total) earn({ coins: r.total }, `leagueMatch:${e.result}`, 'league', { commit: false });
    lastMatchRewards = r;
    pendingMatch = null;
    return { ...r };
  }
  Events.on('match:aborted', () => { pendingMatch = null; });
  Events.on('record:updated', (c) => { career = { ...career, ...c }; });

  const Economy = {
    getWallet: wallet, canSpend, spend, earn,
    getLedger: () => s.ledger.slice(),
    getDailyCap(date) {
      const key = Util.dayKey(date);
      if (s.dailyCap.dayKey !== key) s.dailyCap = { dayKey: key, nonLeagueEarned: 0 };
      const limit = CONFIG.PROVISIONAL.Q1_nonLeagueDailyCap;
      return { dayKey: key, earned: s.dailyCap.nonLeagueEarned, limit, remaining: Math.max(0, limit - s.dailyCap.nonLeagueEarned), reached: s.dailyCap.nonLeagueEarned >= limit };
    },
    getUnlocks, getCatalog, buyUnlock, getPacks, demoPurchase,
    isPremium: () => s.premium.pass,
    getLastMatchRewards: () => (lastMatchRewards ? { ...lastMatchRewards } : null),
    syncCareer: (c) => { career = { ...career, ...c }; }, settleMatch,
    testScope(fn) {
      const before = Util.copy(s);
      const beforeCareer = { ...career };
      const beforePending = pendingMatch && { ...pendingMatch };
      const beforeMissionPending = pendingMissions && { ...pendingMissions };
      const beforeRewards = lastMatchRewards && { ...lastMatchRewards };
      const beforeShown = loginShownThisSession;
      return Save.testScope(() => {
        try { return fn(); }
        finally {
          Object.keys(s).forEach((key) => { delete s[key]; }); Object.assign(s, before);
          career = beforeCareer; pendingMatch = beforePending; pendingMissions = beforeMissionPending; lastMatchRewards = beforeRewards; loginShownThisSession = beforeShown;
        }
      });
    },
    testDailyCap() {
      return Economy.testScope(() => {
        if (s.coins) spend({ coins: s.coins }, 'test:clear');
        s.dailyCap = { dayKey: null, nonLeagueEarned: 0 };
        const date = new Date(2026, 10, 2, 12);
        const a = earn({ coins: 250 }, 'test:cap:a', 'nonLeague', { date });
        const b = earn({ coins: 100 }, 'test:cap:b', 'nonLeague', { date });
        const c = earn({ coins: 20 }, 'test:cap:c', 'nonLeague', { date });
        return { a, b, c, status: Economy.getDailyCap(date), coins: s.coins };
      });
    },
  };

  function rollAds() { const k = Util.dayKey(); if (s.ads.dayKey !== k) { s.ads.dayKey = k; s.ads.rewardCount = 0; } }
  const Ads = {
    // 設定を確定したとき：広告を出すか・何秒かだけを返す（表示は画面遷移）
    onSettingsChanged: () => (s.premium.pass ? { show: false, seconds: 0 } : { show: true, seconds: CONFIG.ADS.settingsAdSeconds }),
    rewardStatus(placement) {
      rollAds();
      const d = REWARD[placement];
      return { left: Math.max(0, d.perDay - s.ads.rewardCount), perDay: d.perDay, label: d.label, seconds: CONFIG.ADS.rewardAdSeconds, skipAd: s.premium.pass };
    },
    grantReward(placement) {
      rollAds();
      const d = REWARD[placement];
      if (!d) return { ok: false, reason: '対象外の広告枠です' };
      if (s.ads.rewardCount >= d.perDay) return { ok: false, reason: '今日の回数は終わりました' };
      if (d.gain.coins && Economy.getDailyCap().remaining <= 0) return { ok: false, reason: '本日のコイン獲得上限に達しています' };
      const granted = earn(d.gain, `rewardAd:${placement}`, 'ad');
      if (!Object.keys(granted).length) return { ok: false, reason: '報酬を受け取れませんでした' };
      s.ads.rewardCount += 1;
      return { ok: true, label: d.label, granted, capped: !!(d.gain.coins && (granted.coins || 0) < d.gain.coins) };
    },
  };
  Economy.testAdCapGuard = () => Economy.testScope(() => {
    if (s.coins) spend({ coins: s.coins }, 'test:clear');
    s.dailyCap = { dayKey: null, nonLeagueEarned: 0 };
    s.ads = { dayKey: Util.dayKey(), rewardCount: 0 };
    earn({ coins: CONFIG.PROVISIONAL.Q1_nonLeagueDailyCap }, 'test:fill-cap', 'nonLeague');
    const before = Ads.rewardStatus('shop');
    const grant = Ads.grantReward('shop');
    const after = Ads.rewardStatus('shop');
    return { before, grant, after };
  });

  function ensureDaily(date) {
    const key = Util.dayKey(date);
    if (s.missions.dayKey !== key) {
      s.missions.dayKey = key;
      s.missions.progress = { playLeague: 0, hits5: 0, k3: 0 };
      s.missions.claimed = {};
      s.missions.allClearClaimed = false;
    }
    return key;
  }
  function achievementProgress(m) {
    return Math.min(m.goal, m.stat ? career[m.stat] || 0 : s.missions.facts[m.id] || 0);
  }
  function grantMissionReward(m, bucket, date) {
    const granted = earn(m.reward, `mission:${m.id}`, 'mission', { commit: false, date });
    bucket[m.id] = { claimed: true, at: new Date().toISOString(), granted: { ...granted } };
    Save.commit(`mission:${m.id}`);
    return { ok: true, mission: m, granted, capped: !!(m.reward.coins && (granted.coins || 0) < m.reward.coins) };
  }
  const Missions = {
    list(kind = 'daily', date) {
      ensureDaily(date);
      if (kind === 'daily') {
        return DAILY.map((m) => { const p = Math.min(m.goal, s.missions.progress[m.id] || 0); return { ...m, progress: p, done: p >= m.goal, claimed: !!s.missions.claimed[m.id], rewardText: rewardText(m.reward) }; });
      }
      return ACHIEVEMENTS.map((m) => {
        const p = achievementProgress(m);
        const c = s.missions.achievements[m.id];
        return { ...m, progress: p, done: p >= m.goal, claimed: !!(c && c.claimed), rewardText: rewardText(m.reward) };
      });
    },
    allClear(date) {
      const daily = Missions.list('daily', date);
      return { ...ALL_CLEAR, goal: daily.length, progress: daily.filter((m) => m.claimed).length, done: daily.every((m) => m.claimed), claimed: s.missions.allClearClaimed, rewardText: rewardText(ALL_CLEAR.reward) };
    },
    unclaimedCount() {
      const n = [...Missions.list('daily'), ...Missions.list('achievements')].filter((m) => m.done && !m.claimed).length;
      const ac = Missions.allClear();
      return n + (ac.done && !ac.claimed ? 1 : 0);
    },
    claim(id, date) {
      if (!CONFIG.FEATURES.daily) return { ok: false, reason: 'ミッションは無効です' };
      ensureDaily(date);
      if (id === ALL_CLEAR.id) {
        const m = Missions.allClear(date);
        if (m.claimed) return { ok: false, reason: 'すでに受け取っています' };
        if (!m.done) return { ok: false, reason: 'まだ条件を達成していません' };
        const granted = earn(m.reward, `mission:${m.id}`, 'mission', { commit: false, date });
        s.missions.allClearClaimed = true;
        Save.commit(`mission:${m.id}`);
        return { ok: true, mission: m, granted };
      }
      const daily = Missions.list('daily', date).find((m) => m.id === id);
      if (daily) {
        if (daily.claimed) return { ok: false, reason: 'すでに受け取っています' };
        if (!daily.done) return { ok: false, reason: 'まだ条件を達成していません' };
        return grantMissionReward(daily, s.missions.claimed, date);
      }
      const achievement = Missions.list('achievements').find((m) => m.id === id);
      if (!achievement) return { ok: false, reason: 'ミッションが見つかりません' };
      if (achievement.claimed) return { ok: false, reason: 'すでに受け取っています' };
      if (!achievement.done) return { ok: false, reason: 'まだ条件を達成していません' };
      return grantMissionReward(achievement, s.missions.achievements, date);
    },
    testClaimScenario() {
      return Economy.testScope(() => {
        ensureDaily(new Date(2026, 10, 2, 12));
        s.missions.progress = { playLeague: 1, hits5: 5, k3: 3 };
        const first = Missions.claim('playLeague', new Date(2026, 10, 2, 12));
        const second = Missions.claim('playLeague', new Date(2026, 10, 2, 12));
        return { first, second, claimed: Missions.list('daily', new Date(2026, 10, 2, 12)).find((m) => m.id === 'playLeague').claimed };
      });
    },
  };

  // ミッション進捗は全モードでpendingに置き、MatchFlowから終了時だけ確定する。
  function beginMissionMatch() { pendingMissions = { hits: 0, strikeouts: 0 }; }
  function trackMissionHit(e) { if (e.side === 'user' && pendingMissions) pendingMissions.hits += 1; }
  function trackMissionStrikeout(e) { if (e.pitcherSide === 'user' && pendingMissions) pendingMissions.strikeouts += 1; }
  function settleMissionMatch(e) {
    if (!CONFIG.FEATURES.daily || !pendingMissions) { pendingMissions = null; return null; }
    ensureDaily();
    s.missions.progress.hits5 = Math.min(DAILY[1].goal, (s.missions.progress.hits5 || 0) + pendingMissions.hits);
    s.missions.progress.k3 = Math.min(DAILY[2].goal, (s.missions.progress.k3 || 0) + pendingMissions.strikeouts);
    if (isOfficialMode(e.mode)) s.missions.progress.playLeague = 1;
    const applied = { ...pendingMissions };
    pendingMissions = null;
    return applied;
  }
  function abortMissionMatch() { pendingMissions = null; }
  Events.on('match:start', beginMissionMatch);
  Events.on('match:hit', trackMissionHit);
  Events.on('match:strikeout', trackMissionStrikeout);
  Events.on('match:aborted', abortMissionMatch);
  Events.on('season:advanced', (e) => { if (e && e.rank === 1) s.missions.facts.champion = 1; });
  Events.on('growth:level', (e) => { if (e && e.lv >= 20) s.missions.facts.lv20 = 1; });
  Events.on('growth:acquired', (e) => { if (e && e.rarity === 4) s.missions.facts.legend = 1; });

  const LoginBonus = {
    table: () => LOGIN_TABLE.map((d) => ({ ...d, rewardText: rewardText(d.reward) })),
    check(date) {
      const key = Util.dayKey(date);
      const eligible = s.login.lastDayKey === null || key > s.login.lastDayKey; // 端末の日付を戻しても受け取れない
      return { show: eligible && !loginShownThisSession, eligible, day: (s.login.count % 7) + 1, dayKey: key };
    },
    markShown() { loginShownThisSession = true; },
    claim(date) {
      if (!CONFIG.FEATURES.daily) return { ok: false, reason: 'ログインボーナスは無効です' };
      const status = LoginBonus.check(date);
      if (!status.eligible) return { ok: false, reason: '今日はすでに受け取っています' };
      const entry = LOGIN_TABLE[status.day - 1];
      const granted = earn(entry.reward, `loginBonus:${status.day}`, 'login', { commit: false, date });
      s.login.lastDayKey = status.dayKey;
      s.login.count += 1;
      loginShownThisSession = true;
      Save.commit(`loginBonus:${status.day}`);
      return { ok: true, day: status.day, reward: { ...entry.reward }, granted, capped: !!(entry.reward.coins && (granted.coins || 0) < entry.reward.coins) };
    },
    testCycle() {
      return Economy.testScope(() => {
        s.login = { lastDayKey: null, count: 0 }; loginShownThisSession = false;
        const before = LoginBonus.claim(new Date(2026, 10, 2, 3, 59));
        const sameBusinessDay = LoginBonus.claim(new Date(2026, 10, 2, 3, 59));
        const afterFour = LoginBonus.claim(new Date(2026, 10, 2, 4, 0));
        for (let i = 1; i <= 4; i += 1) LoginBonus.claim(new Date(2026, 10, 2 + i, 12));
        const day7 = LoginBonus.claim(new Date(2026, 10, 7, 12));
        const next = LoginBonus.check(new Date(2026, 10, 8, 12));
        return { before, sameBusinessDay, afterFour, day7, next };
      });
    },
  };

  Missions.settleMatch = settleMissionMatch;
  Missions.testCapExemptRewards = () => Economy.testScope(() => {
    const date = new Date(2026, 10, 2, 12);
    if (s.coins) spend({ coins: s.coins }, 'test:clear');
    s.dailyCap = { dayKey: null, nonLeagueEarned: 0 };
    earn({ coins: 300 }, 'test:fill-cap', 'nonLeague', { date });
    career = { ...career, homeruns: 50 };
    ensureDaily(date);
    s.missions.progress = { playLeague: 1, hits5: 5, k3: 3 };
    s.missions.claimed = {};
    s.missions.achievements = {};
    s.login = { lastDayKey: null, count: 0 };
    loginShownThisSession = false;
    const achievement = Missions.claim('hr50', date);
    const daily = Missions.claim('hits5', date);
    const login = LoginBonus.claim(date);
    return { achievement, daily, login, wallet: wallet(), cap: Economy.getDailyCap(date) };
  });
  Missions.testAbortPending = () => Economy.testScope(() => {
    const date = new Date(2026, 10, 2, 12);
    ensureDaily(date);
    s.missions.progress = { playLeague: 0, hits5: 0, k3: 0 };
    Events.emit('match:start', { mode: 'practice', userSide: 'away', participants: [] });
    Events.emit('match:hit', { mode: 'practice', side: 'user', kind: '1B' });
    Events.emit('match:strikeout', { mode: 'practice', pitcherSide: 'user' });
    Events.emit('match:aborted', { mode: 'practice' });
    return { ...s.missions.progress };
  });

  Save.register('economy', {

          s.owned[id] = { lv: Math.floor(Util.clamp(own.lv || 1, 1, maxLvOf(c, own.lb || 0))), exp: Math.max(0, Math.floor(own.exp || 0)), lb: Math.floor(Util.clamp(own.lb || 0, 0, G.limitBreakMax)), fatigue: Math.max(0, Math.floor(own.fatigue || 0)) };
        });
        if (!Object.keys(s.owned).length) {
          s.owned = Object.fromEntries(MASTER.filter((c) => c.id.startsWith('S')).map((c) => [c.id, { lv: 1, exp: 0, lb: 0, fatigue: 0 }]));
        }
      }
      if (s.protagonist.created && !s.owned.PROTAG) s.owned.PROTAG = { lv: 1, exp: 0, lb: 0, fatigue: 0 };
      // 学年復元：grades が無い既存セーブ読込時は所持カードへ2年生を付与する移行を1回だけ行う
      s.grades = {};
      if (data.grades && typeof data.grades === 'object' && data.grades.migrated === true) {
        const byCard = data.grades.byCard && typeof data.grades.byCard === 'object' ? data.grades.byCard : data.grades;
        Object.keys(s.owned).forEach((id) => {
          s.grades[id] = Util.clamp(Math.floor(Number(byCard[id]) || (id === 'PROTAG' ? s.protagonist.grade : 1)), 1, 3);
        });
        s.gradesMigrated = true;
      } else if (data.cards && typeof data.cards === 'object') {
        Object.keys(s.owned).forEach((id) => {
          s.grades[id] = id === 'PROTAG' ? (s.protagonist.grade || 1) : 2;
        });
        s.gradesMigrated = true;
      } else {

        s.gradesMigrated = true;

        const lineupPos = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];
        if (Array.isArray(team.lineup) && team.lineup.length === 9

          && new Set(team.lineup.map((x) => x.cardId)).size === 9 && new Set(team.lineup.map((x) => x.pos)).size === 9) s.lineup = team.lineup.map((x) => ({ cardId: x.cardId, pos: x.pos }));
        if (Array.isArray(team.rotation) && team.rotation.length === 3 && new Set(team.rotation).size === 3 && team.rotation.every((id) => { const c = master(id); return c && c.type === 'P' && s.owned[id]; })) s.rotation = team.rotation.slice();

        ...s.scout, pity: Math.floor(Util.clamp(data.scout.pity || 0, 0, CONFIG.SCOUT.pity - 1)), totalPulls: Math.max(0, Math.floor(data.scout.totalPulls || 0)),

  return {
    getCard, getOwnedCards, getAbilities, rankOf, kmhScore, cardOverall, expToNext,

  };
})();

  function generateCpuTeam(teamId, season) {

  const winPct = (w, l) => (w + l === 0 ? 0 : w / (w + l));

  // CPU戦勝率：戦力の二乗比。先に8%の引き分け判定を行い、残りを勝率で分ける。
  function simulateCpuGame(season, round, game) {
    const seed = ((season * 1000003) ^ ((round + 1) * 9176) ^ (game.home * 389) ^ (game.away * 1543)) >>> 0;
    const rng = Util.seeded(seed);
    if (rng() < 0.08) { const n = Math.floor(rng() * 4); return [n, n]; }
    const h = cpuOverall(game.home, season);
    const a = cpuOverall(game.away, season);
    const homeWin = (h * h) / (h * h + a * a);
    const homeWon = rng() < homeWin;
    const loser = Math.floor(rng() * 4);
    const winner = loser + 1 + Math.floor(rng() * 3);
    return homeWon ? [winner, loser] : [loser, winner];
  }
  function resolveCpuRound(schedule, season, round) {
    schedule[round].forEach((game) => {

    });

  // 順位：勝率→同率球団どうしの対戦勝率→得失点差→総得点→球団番号（仕様書 A-4）
  function getStandings() {
    const rows = TEAMS.map((t) => ({ id: t.id, w: 0, l: 0, d: 0, rs: 0, ra: 0 }));
    const h2h = {};
    const rec = (a, b, key) => { const k2 = `${a}-${b}`; h2h[k2] = h2h[k2] || { w: 0, l: 0 }; h2h[k2][key] += 1; };
    s.schedule.forEach((games) => games.forEach((g) => {
      if (!g.score) return;
      const [hs, as] = g.score;
      const H = rows[g.home];
      const A = rows[g.away];
      H.rs += hs; H.ra += as; A.rs += as; A.ra += hs;
      if (hs === as) { H.d += 1; A.d += 1; }
      else if (hs > as) { H.w += 1; A.l += 1; rec(g.home, g.away, 'w'); rec(g.away, g.home, 'l'); }
      else { A.w += 1; H.l += 1; rec(g.away, g.home, 'w'); rec(g.home, g.away, 'l'); }
    }));
    rows.forEach((r) => { r.pct = winPct(r.w, r.l); });
    const sorted = [...rows].sort((a, b) => b.pct - a.pct);
    const out = [];
    for (let i = 0; i < sorted.length;) {
      let j = i;
      while (j + 1 < sorted.length && sorted[j + 1].pct === sorted[i].pct) j += 1;
      const group = sorted.slice(i, j + 1);
      if (group.length > 1) {
        const ids = group.map((r) => r.id);
        group.forEach((r) => {
          let w = 0;
          let l = 0;
          ids.forEach((o) => { const x = h2h[`${r.id}-${o}`]; if (x) { w += x.w; l += x.l; } });

        });
        group.sort((a, b) => (b.h2h - a.h2h) || ((b.rs - b.ra) - (a.rs - a.ra)) || (b.rs - a.rs) || (a.id - b.id));
      }
      out.push(...group);

    const lead = out[0];

      const gb = idx === 0 ? null : ((lead.w - r.w) + (r.l - lead.l)) / 2;
