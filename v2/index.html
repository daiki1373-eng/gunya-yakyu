    });
  }
  function getSchedule() {
    return s.schedule.map((games, r) => {
      const g = games.find((x) => x.home === 0 || x.away === 0);
      const home = g.home === 0;
      let result = null;
      let us = null;
      let them = null;
      if (g.score) {
        us = home ? g.score[0] : g.score[1];
        them = home ? g.score[1] : g.score[0];
        result = us > them ? 'W' : us < them ? 'L' : 'D';
      }
      return { round: r + 1, games: games.map((x) => ({ ...x })), user: { opponentId: home ? g.away : g.home, home, result, us, them } };
    });
  }
  function getNextMatch() {
    if (s.round >= CONFIG.LEAGUE.rounds) return null;
    const r = Math.min(s.round, CONFIG.LEAGUE.rounds - 1);
    const g = s.schedule[r].find((x) => x.home === 0 || x.away === 0);
    const home = g.home === 0;
    return { round: r + 1, opponentId: home ? g.away : g.home, home };
  }
  const getSeason = () => ({ season: s.season, played: s.round, nextRound: s.round < CONFIG.LEAGUE.rounds ? s.round + 1 : null, rounds: CONFIG.LEAGUE.rounds, complete: s.round >= CONFIG.LEAGUE.rounds });

  // 年度カレンダーと大会トーナメント（地方予選3試合→甲子園本大会3試合→年度終了）
  function isYearComplete() {
    return s.calendar.phase === 'yearEnd' || s.calendar.phase === 'graduation' || s.calendar.eliminated || s.calendar.champion || s.calendar.step > TOURNAMENT_ROUNDS.length;
  }
  function getTournamentBracket(year = s.calendar.year) {
    return TOURNAMENT_ROUNDS.map((rd) => {
      const opp = generateOpponentSchool(year, rd.step);
      const played = s.calendar.results.find((r) => r.step === rd.step) || null;
      const home = rd.step % 2 === 1;
      const isNext = !isYearComplete() && s.calendar.step === rd.step;
      const locked = rd.stage === 'koshien' && s.calendar.step <= 3 && !s.calendar.champion;
      return {
        ...rd, home, isNext, locked,
        opponent: { id: opp.id, name: opp.name, pref: opp.pref, trait: opp.trait, traitLabel: opp.traitLabel, overall: opp.overall },
        result: played ? played.result : null,
        us: played ? played.us : null,
        them: played ? played.them : null,
      };
    });
  }
  function getNextTournamentMatch() {
    if (isYearComplete()) return null;
    const step = Util.clamp(s.calendar.step, 1, TOURNAMENT_ROUNDS.length);
    const rd = TOURNAMENT_ROUNDS[step - 1];
    const opp = generateOpponentSchool(s.calendar.year, step);
    const home = step % 2 === 1;
    return {
      year: s.calendar.year, step: rd.step, round: rd.step,
      stage: rd.stage, stageLabel: rd.stageLabel, roundInStage: rd.round, label: rd.label,
      home, opponentId: opp.id,
      opponent: { id: opp.id, name: opp.name, short: opp.name, pref: opp.pref, trait: opp.trait, traitLabel: opp.traitLabel, overall: opp.overall },
    };
  }
  function getCalendar() {
    const bracket = getTournamentBracket(s.calendar.year);
    const wins = s.calendar.results.filter((r) => r.result === 'W').length;
    const losses = s.calendar.results.filter((r) => r.result === 'L').length;
    return {
      ...Util.copy(s.calendar),
      complete: isYearComplete(),
      wins, losses,
      nextMatch: getNextTournamentMatch(),
      bracket,
    };
  }
  function recordTournamentMatch(result, usScore, themScore, meta = null) {
    if (isYearComplete()) return { yearEnded: true, champion: s.calendar.champion, eliminated: s.calendar.eliminated };
    const step = Util.clamp(meta && meta.step ? meta.step : s.calendar.step, 1, TOURNAMENT_ROUNDS.length);
    const rd = TOURNAMENT_ROUNDS[step - 1];
    const opp = generateOpponentSchool(s.calendar.year, step);
    const home = meta && typeof meta.home === 'boolean' ? meta.home : (step % 2 === 1);
    const won = result === 'W';
    const us = Number.isInteger(usScore) ? usScore : (won ? 3 : 1);
    const them = Number.isInteger(themScore) ? themScore : (won ? 1 : 3);
    s.calendar.results = s.calendar.results.filter((r) => r.step !== step);
    s.calendar.results.push({
      step: rd.step, stage: rd.stage, label: rd.label,
      opponentName: opp.name, opponentPref: opp.pref, opponentOverall: opp.overall,
      home, result: won ? 'W' : 'L', us, them,
    });
    if (won) {
      s.career.leagueWins += 1;
      if (step === 3) {
        s.calendar.step = 4;
        s.calendar.phase = 'koshien';
      } else if (step >= TOURNAMENT_ROUNDS.length) {
        s.calendar.step = TOURNAMENT_ROUNDS.length + 1;
        s.calendar.phase = 'yearEnd';
        s.calendar.champion = true;
        s.calendar.koshienWins += 1;
        s.calendar.streak += 1;
        if (s.calendar.streak > s.calendar.maxStreak) s.calendar.maxStreak = s.calendar.streak;
      } else {
        s.calendar.step = step + 1;
        s.calendar.phase = step + 1 <= 3 ? 'qualifier' : 'koshien';
      }
    } else {
      s.calendar.eliminated = true;
      s.calendar.eliminatedAt = rd.label;
      s.calendar.phase = 'yearEnd';
      s.calendar.streak = 0;
    }
    Events.emit('record:updated', { ...s.career });
    return { yearEnded: isYearComplete(), champion: s.calendar.champion, eliminated: s.calendar.eliminated, step: rd.step, label: rd.label };
  }
  function playTournamentRound(result = 'W', score = null) {
    if (isYearComplete()) return { ok: false, reason: '今年度の大会は終了しています' };
    const next = getNextTournamentMatch();
    const won = result === 'W';
    const us = score && Number.isInteger(score.us) ? score.us : (won ? 3 : 1);
    const them = score && Number.isInteger(score.them) ? score.them : (won ? 1 : 3);
    const r = recordTournamentMatch(won ? 'W' : 'L', us, them, next);
    Save.commit('tournamentRound');
    return { ok: true, ...r, calendar: getCalendar() };
  }
  function yearEndReward() {
    if (!isYearComplete()) return null;
    const rank = s.calendar.champion ? 1 : s.calendar.step >= 4 ? 2 : s.calendar.step === 3 ? 3 : 4;
    const base = CONFIG.ECONOMY.seasonRankRewards[rank - 1];
    const title = s.calendar.champion ? '甲子園優勝' : (s.calendar.eliminatedAt ? `${s.calendar.eliminatedAt}敗退` : '大会終了');
    return { rank, title, ...base };
  }
  function advanceYear() {
    const reward = yearEndReward();
    if (!reward || !CONFIG.FEATURES.leagueRewards) return { ok: false, reason: '今年度の大会がまだ終わっていません' };
    const gain = { coins: reward.coins || 0, guaranteeTickets: reward.guaranteeTickets || 0 };
    const granted = Economy.earn(gain, `yearEnd:${s.calendar.year}:${reward.rank}`, 'league', { commit: false });
    const finishedYear = s.calendar.year;
    const resultLabel = reward.title;
    s.calendar.history.unshift({
      year: finishedYear, generation: s.calendar.generation,
      schoolName: Growth.getTeamName(), resultLabel,
      champion: s.calendar.champion, koshienWins: s.calendar.koshienWins, streak: s.calendar.streak,
    });
    s.calendar.history = s.calendar.history.slice(0, 30);
    const grad = Growth.processYearEnd(finishedYear);
    s.calendar.year += 1;
    s.season += 1;
    s.calendar.step = 1;
    s.calendar.eliminated = false;
    s.calendar.eliminatedAt = null;
    s.calendar.champion = false;
    s.calendar.results = [];
    s.calendar.phase = grad.protagonistGraduated ? 'graduation' : 'qualifier';
    s.lastResult = null;
    current = null;
    pending = null;
    Events.emit('season:advanced', { season: s.season, year: s.calendar.year, rank: reward.rank, reward: granted, graduation: grad });
    Save.commit('yearAdvance');
    return { ok: true, rank: reward.rank, reward: granted, season: s.season, year: s.calendar.year, graduation: grad, nextScreen: grad.protagonistGraduated ? 'graduation' : 'home' };
  }

  // 試合設定（仕様書 A-12 の約束）。倍率はここで計算し、エンジン本体は掛けるだけ
  function buildMatchConfig(mode = 'league') {
    const isOfficial = mode === 'league' || mode === 'tournament';
    const base = {
      mode, innings: CONFIG.LEAGUE.innings, seed: 0, play: Util.copy(s.play),
      unlockedPitches: Economy.getUnlocks().pitches,
      correction: { enabled: CONFIG.FEATURES.correction && isOfficial, k },
    };
    if (!isOfficial) return { ...base, userSide: 'away', teams: null }; // 現行モードは現行のまま
    const school = Growth.getSchool();
    const uTrait = school && school.selected ? school.trait : null;
    const uBonus = (stat) => Correction.traitBonus(uTrait, stat);
    const snap = Growth.getTeamSnapshot();
    const lineup = snap.lineup.map((b) => ({
      order: b.order, cardId: b.cardId, name: b.name, number: b.number, pos: b.pos,
      abilities: { meet: b.abilities.meet, power: b.abilities.power, speed: b.abilities.speed, defense: b.abilities.defense },
      // 適性外の-30%と学校特性補正は能力値を書き換えず、この倍率から MatchEngine.HOOKS へ通す。
      mult: {
        contact: m3(b.abilities.meet, uBonus('meet')),
        power: m3(b.abilities.power, uBonus('power')),
        speed: m3(b.abilities.speed, uBonus('speed')),
        defense: m3(b.abilities.defense, uBonus('defense')) * b.defenseFactor,
      },
    }));
    const st = snap.starter;
    const a = st.abilities;
    const pitcher = {
      cardId: st.cardId, name: st.name, number: st.number, kmh: a.kmh,
      abilities: { control: a.control, stamina: a.stamina, movement: a.movement },
      mult: {
        velocity: m3(Correction.kmhScore(a.kmh), uBonus('velocity')),
        control: m3(a.control, uBonus('control')),
        movement: m3(a.movement, uBonus('movement')),
      },
      staminaThreshold: Math.floor(a.stamina / 2), special: st.special.slice(), fatigued: st.fatigued, overall: st.overall,
    };
    const inLineup = new Set(lineup.map((b) => b.cardId));
    const ownedAll = Growth.getOwnedCards('overall');
    const bench = ownedAll.filter((c) => c.type === 'F' && !inLineup.has(c.id)).slice(0, 5).map((c) => ({
      cardId: c.id, name: c.name, number: c.number,
      abilities: { meet: c.abilities.meet, power: c.abilities.power, speed: c.abilities.speed, defense: c.abilities.defense },
      mult: { contact: m3(c.abilities.meet, uBonus('meet')), power: m3(c.abilities.power, uBonus('power')), speed: m3(c.abilities.speed, uBonus('speed')), defense: m3(c.abilities.defense, uBonus('defense')) * (c.defenseFactor || 1) },
    }));
    const benchPitchers = ownedAll.filter((c) => c.type === 'P' && c.id !== st.cardId).slice(0, 3).map((c) => ({
      cardId: c.id, name: c.name, number: c.number, kmh: c.abilities.kmh,
      abilities: { control: c.abilities.control, stamina: c.abilities.stamina, movement: c.abilities.movement },
      mult: { velocity: m3(Correction.kmhScore(c.abilities.kmh), uBonus('velocity')), control: m3(c.abilities.control, uBonus('control')), movement: m3(c.abilities.movement, uBonus('movement')) },
      staminaThreshold: Math.floor(c.abilities.stamina / 2), special: (c.special || []).slice(), fatigued: !!c.fatigued, overall: c.overall,
    }));
    if (mode === 'tournament') {
      const next = getNextTournamentMatch() || { year: s.calendar.year, step: 1, stage: 'qualifier', stageLabel: '地方予選', label: '地方予選 1回戦', home: true };
      const opp = generateOpponentSchool(s.calendar.year, next.step);
      return {
        ...base, userSide: next.home ? 'home' : 'away', seed: s.calendar.year * 1000 + next.step * 17,
        tournament: { year: s.calendar.year, step: next.step, stage: next.stage, stageLabel: next.stageLabel, label: next.label, opponent: { name: opp.name, pref: opp.pref, trait: opp.trait, traitLabel: opp.traitLabel, overall: opp.overall } },
        teams: { user: { id: 0, name: snap.name, lineup, pitcher, bench, benchPitchers }, opponent: { id: opp.id, name: opp.name, pref: opp.pref, trait: opp.trait, traitLabel: opp.traitLabel, overall: opp.overall, lineup: opp.lineup, pitcher: opp.pitcher } },
      };
    }
    const next = getNextMatch();
    const cpu = generateCpuTeam(next.opponentId, s.season);
    return {
      ...base, userSide: next.home ? 'home' : 'away', seed: s.season * 1000 + next.round * 10 + next.opponentId,
      teams: { user: { id: 0, name: snap.name, lineup, pitcher, bench, benchPitchers }, opponent: { id: next.opponentId, name: nameOf(next.opponentId), lineup: cpu.lineup, pitcher: cpu.pitcher } },
    };
  }
  function updatePlaySettings(patch) {
    const next = { ...s.play, ...patch, myPitch: { ...s.play.myPitch, ...(patch.myPitch || {}) }, motion: { ...s.play.motion, ...(patch.motion || {}) } };
    if (JSON.stringify(next) === JSON.stringify(s.play)) return false;
    s.play = next;
    Save.commit('settings');
    return true;
  }

  // 試合の通知を受ける：記録（公式戦は試合終了時にまとめる）と結果
  function flush() {
    if (!pending) return;
    s.career.hits += pending.hits;
    s.career.homeruns += pending.homeruns;
    s.career.strikeouts += pending.strikeouts;
    pending = { hits: 0, homeruns: 0, strikeouts: 0 };
    Events.emit('record:updated', { ...s.career });
  }
  Events.on('match:start', (e) => {
    if (e.mode === 'tournament') {
      const next = getNextTournamentMatch() || { step: 1, stage: 'qualifier', label: '地方予選 1回戦', home: e.userSide === 'home', opponent: generateOpponentSchool(s.calendar.year, 1) };
      current = { mode: 'tournament', userSide: e.userSide, round: next.step, step: next.step, stage: next.stage, label: next.label, home: next.home, opponentId: next.step, opponentName: next.opponent.name };
    } else {
      const next = getNextMatch();
      current = { mode: e.mode, userSide: e.userSide, round: e.mode === 'league' && next ? next.round : null, opponentId: e.mode === 'league' && next ? next.opponentId : null };
    }
    pending = { hits: 0, homeruns: 0, strikeouts: 0 };
  });
  Events.on('match:hit', (e) => {
    if (e.side !== 'user' || !pending) return;
    pending.hits += 1;
    if (e.kind === 'HR') pending.homeruns += 1;
  });
  Events.on('match:strikeout', (e) => {
    if (e.pitcherSide !== 'user' || !pending) return;
    pending.strikeouts += 1;
  });
  function settleMatch(e) {
    if (!current) return;
    flush();
    const userIsHome = current.userSide === 'home';
    const isOfficial = current.mode === 'league' || current.mode === 'tournament';
    const userName = isOfficial ? Growth.getTeamName() : 'あなた';
    const oppName = current.mode === 'tournament'
      ? (current.opponentName || '相手校')
      : current.mode === 'league' ? nameOf(current.opponentId) : '相手';
    s.lastResult = {
      mode: e.mode, modeLabel: current.label || CONFIG.LABELS.mode[e.mode], result: e.result, score: { ...e.score }, userSide: current.userSide,
      round: current.round, step: current.step || null, stage: current.stage || null, stageLabel: current.label || null,
      opponentId: current.opponentId, opponentName: oppName,
      homeName: userIsHome ? userName : oppName, awayName: userIsHome ? oppName : userName,
      mvp: e.mvp, recorded: false, yearEnded: false, champion: false, eliminated: false,
    };
    if (e.mode === 'tournament' && CONFIG.FEATURES.tournament) {
      const us = userIsHome ? e.score.home : e.score.away;
      const them = userIsHome ? e.score.away : e.score.home;
      const tRes = recordTournamentMatch(e.result, us, them, current);
      s.lastResult.recorded = true;
      s.lastResult.yearEnded = tRes.yearEnded;
      s.lastResult.champion = tRes.champion;
      s.lastResult.eliminated = tRes.eliminated;
    } else if (e.mode === 'league' && CONFIG.FEATURES.leagueProgress) {
      const roundIndex = current.round - 1;
      const game = s.schedule[roundIndex] && s.schedule[roundIndex].find((g) => g.home === 0 || g.away === 0);
      if (game && !game.score && scoreOk([e.score.home, e.score.away])) {
        game.score = [e.score.home, e.score.away];
        resolveCpuRound(s.schedule, s.season, roundIndex);
        s.round = playedRounds();
        if (e.result === 'W') s.career.leagueWins += 1;
        s.lastResult.recorded = true;
        Events.emit('record:updated', { ...s.career });
      }
    }
    current = null;
    pending = null;
    return s.lastResult;
  }
  Events.on('match:aborted', () => { current = null; pending = null; });

  function seasonReward() {
    if (CONFIG.FEATURES.tournament && isYearComplete()) return yearEndReward();
    if (s.round < CONFIG.LEAGUE.rounds) return null;
    const rank = getStandings().find((r) => r.isUser).rank;
    return { rank, ...CONFIG.ECONOMY.seasonRankRewards[Math.min(rank, 4) - 1] };
  }
  function advanceSeason() {
    if (CONFIG.FEATURES.tournament && isYearComplete()) return advanceYear();
    const reward = seasonReward();
    if (!reward || !CONFIG.FEATURES.leagueRewards) return { ok: false, reason: 'シーズンがまだ終わっていません' };
    const gain = { coins: reward.coins || 0, guaranteeTickets: reward.guaranteeTickets || 0 };
    const granted = Economy.earn(gain, `seasonRank:${s.season}:${reward.rank}`, 'league', { commit: false });
    s.seasonHistory.push({ season: s.season, results: resultsOf() });
    s.season += 1;
    s.schedule = makeSchedule();
    s.round = 0;
    s.lastResult = null;
    current = null;
    pending = null;
    Events.emit('season:advanced', { season: s.season, rank: reward.rank, reward: granted });
    Save.commit('seasonAdvance');
    return { ok: true, rank: reward.rank, reward: granted, season: s.season };
  }

  function testSeasonSimulation(season = 1) {
    const schedule = makeSchedule();
    for (let r = 0; r < CONFIG.LEAGUE.rounds; r += 1) {
      const user = schedule[r].find((g) => g.home === 0 || g.away === 0);
      user.score = r % 3 === 0 ? [2, 2] : user.home ? [3, 1] : [1, 3];
      resolveCpuRound(schedule, season, r);
    }
    return { rounds: playedRounds(schedule), games: schedule.flat().filter((g) => scoreOk(g.score)).length, results: resultsOf(schedule) };
  }
  function testScope(fn) {
    const before = Util.copy(s);
    const beforeCurrent = current && Util.copy(current);
    const beforePending = pending && Util.copy(pending);
    return Growth.testScope(() => {
      try { return fn(); }
      finally {
        Object.keys(s).forEach((key) => { delete s[key]; });
        Object.assign(s, before);
        current = beforeCurrent;
        pending = beforePending;
      }
    });
  }

  Save.register('league', {
    exportSlice: () => ({
      calendar: Util.copy(s.calendar),
      league: { season: s.season, results: resultsOf() },
      seasonHistory: Util.copy(s.seasonHistory),
      stats: { career: { ...s.career } },
      settings: Util.copy(s.play),
    }),
    importSlice: (data) => {
      if (data.calendar && typeof data.calendar === 'object') {
        const c = data.calendar;
        const phases = ['qualifier', 'koshien', 'yearEnd', 'graduation'];
        s.calendar = {
          year: Number.isInteger(c.year) && c.year >= 1 ? c.year : 1,
          generation: Number.isInteger(c.generation) && c.generation >= 1 ? c.generation : 1,
          phase: phases.includes(c.phase) ? c.phase : 'qualifier',
          step: Number.isInteger(c.step) ? Util.clamp(c.step, 1, TOURNAMENT_ROUNDS.length + 1) : 1,
          eliminated: !!c.eliminated,
          eliminatedAt: typeof c.eliminatedAt === 'string' ? c.eliminatedAt : null,
          champion: !!c.champion,
          koshienWins: Number.isInteger(c.koshienWins) && c.koshienWins >= 0 ? c.koshienWins : 0,
          streak: Number.isInteger(c.streak) && c.streak >= 0 ? c.streak : 0,
          maxStreak: Number.isInteger(c.maxStreak) && c.maxStreak >= 0 ? c.maxStreak : 0,
          results: Array.isArray(c.results) ? Util.copy(c.results) : [],
          history: Array.isArray(c.history) ? Util.copy(c.history).slice(0, 30) : [],
        };
      } else {
        s.calendar = Util.copy(CALENDAR_DEFAULT);
      }
      if (data.league && typeof data.league === 'object') {
        if (Number.isInteger(data.league.season) && data.league.season >= 1) s.season = data.league.season;
        const results = Array.isArray(data.league.results)
          ? data.league.results
          : Array.isArray(data.league.schedule) ? data.league.schedule.map((games) => games.map((g) => g && g.score || null)) : null;
        s.schedule = scheduleFromResults(results, s.season);
        s.round = playedRounds();
      }
      if (Array.isArray(data.seasonHistory)) s.seasonHistory = data.seasonHistory.filter((x) => x && Number.isInteger(x.season) && Array.isArray(x.results)).map((x) => ({ season: x.season, results: Util.copy(x.results) }));
      const career = data.stats && data.stats.career;
      if (career && typeof career === 'object') Object.keys(s.career).forEach((key) => { if (Number.isFinite(career[key])) s.career[key] = Math.max(0, Math.floor(career[key])); });
      if (data.settings && typeof data.settings === 'object') {
        const p = data.settings;
        const pforms = ['overhand', 'threeQuarter', 'side', 'under', 'tornado', 'spread', 'spin', 'dogeza'];
        const bforms = ['standard', 'open', 'closed', 'oneLeg', 'sway'];
        const pitches = ['fastball', 'curve', 'slider', 'fork', 'shoot', 'sinker', 'mypitch'];
        const directions = ['up', 'down', 'left', 'right'];
        const n = (value, fallback) => Number.isFinite(Number(value)) ? Math.round(Util.clamp(Number(value), 0, 100)) : fallback;
        s.play = {
          selectedPitch: pitches.includes(p.selectedPitch) ? p.selectedPitch : PLAY_DEFAULT.selectedPitch,
          pitchingForm: pforms.includes(p.pitchingForm) ? p.pitchingForm : PLAY_DEFAULT.pitchingForm,
          battingForm: bforms.includes(p.battingForm) ? p.battingForm : PLAY_DEFAULT.battingForm,
          myPitch: { direction: directions.includes(p.myPitch && p.myPitch.direction) ? p.myPitch.direction : PLAY_DEFAULT.myPitch.direction, amount: n(p.myPitch && p.myPitch.amount, PLAY_DEFAULT.myPitch.amount) },
          motion: { armSwing: n(p.motion && p.motion.armSwing, 50), release: n(p.motion && p.motion.release, 50), swingSpeed: n(p.motion && p.motion.swingSpeed, 50) },
          anthem: ['kouka1', 'kouka2', 'kouka3'].includes(p.anthem) ? p.anthem : PLAY_DEFAULT.anthem,
        };
      }
    },
  });

  const League = {
    getTeams, getStandings, getSchedule, getNextMatch, getSeason, buildMatchConfig,
    getCalendar, getTournamentBracket, getNextTournamentMatch, isYearComplete,
    recordTournamentMatch, playTournamentRound, yearEndReward, advanceYear, generateOpponentSchool,
    getLastResult: () => (s.lastResult ? { ...s.lastResult } : null),
    getCareer: () => ({ ...s.career }),
    getPlaySettings: () => Util.copy(s.play),
    updatePlaySettings, formatPct, settleMatch, advanceSeason, seasonReward,
    isSeasonComplete: () => (CONFIG.FEATURES.tournament ? isYearComplete() : s.round >= CONFIG.LEAGUE.rounds),
    testSeasonSimulation, simulateCpuGame: (season, round, game) => simulateCpuGame(season, round, game),
    cpuSeasonBonus: cpuBonus, generateCpuTeam, testScope,

/* ---- 校歌（WebAudioの短いメロディ） ---- */
const Anthem = (() => {
  const TUNES = Object.freeze({
    kouka1: { name: '校歌メロディ1', notes: [262, 294, 330, 392, 330, 294, 262, 262] },
    kouka2: { name: '校歌メロディ2', notes: [330, 392, 440, 392, 330, 294, 262, 294, 330] },
    kouka3: { name: '校歌メロディ3', notes: [392, 392, 440, 494, 392, 330, 294, 262] },

    const tune = TUNES[id] || TUNES.kouka1;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime + 0.05;
      tune.notes.forEach((f, i) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + i * 0.34);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + i * 0.34 + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.34 + 0.32);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + i * 0.34); o.stop(t0 + i * 0.34 + 0.34);
      });
    } catch (e) { /* 音が出ない環境では無音で続行 */ }
  }
  return { TUNES, play };
})();

    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + dur + 0.05);
  }
  return {
    crack: () => burst(0.09, 'highpass', 900, 500, 0.5),
    whoosh: () => burst(0.16, 'bandpass', 1400, 300, 0.22),
    crowd: (big) => burst(big ? 1.5 : 0.7, 'lowpass', 500, 240, big ? 0.34 : 0.18),
  };
})();

/* ---- 実況テロップ ---- */
const Commentary = (() => {
  function line(type, d = {}) {
    switch (type) {
      case 'pitch': return `投げた！ ${d.name || 'ストレート'} ${d.kmh ? `${d.kmh}km/h` : ''}`;
      case 'atBat': return `${d.order || ''}番 ${d.name || '打者'}、打席に入ります`;
      case 'hit': return d.kind === 'HR' ? '打ったー！ 大きい、大きい！ 入った、ホームラン！' : d.kind === '2B' ? '鋭い当たり！ ツーベースヒット！' : '打った！ ヒット！ チャンスが広がります';
      case 'strikeout': return '三振！ 球場がどよめきます';
      case 'out': return `${d.label || 'アウト'}！ 守備がさばいた`;
      case 'run': return `${d.runs || 1}点が入った！ スタンドが沸いています`;
      case 'steal': return d.success ? '盗塁成功！ 足でかき回します' : '盗塁失敗！ タッチアウト';
      default: return '';
    }
  }
  return { line };
})();

/* ---- 触覚フィードバック（アプリ版はCapacitor Haptics、Webはvibrate） ---- */
const NativeFeel = (() => {
  function fire(style) {
    try {
      const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (H && H.impact) { H.impact({ style }); return; }
      if (navigator.vibrate) navigator.vibrate(style === 'HEAVY' ? 28 : style === 'MEDIUM' ? 16 : 8);
    } catch (e) { /* 触覚なしで続行 */ }
  }
  return { tap: () => fire('LIGHT'), hit: () => fire('MEDIUM'), big: () => fire('HEAVY') };
})();

  function update(v) {

    if (pitch) { pitch.disabled = !v.canPitch; pitch.textContent = v.batting ? '投球開始' : '投げる'; }
    if (swing) swing.disabled = !v.canSwing;
    if (finish) { finish.hidden = !v.canFinish; finish.disabled = !v.canFinish; }

    const shiftRow = one('[data-eng-shift]');

    const aimBox = one('[data-eng-aim]');

      const bunt = one('[data-engine-act="bunt"]'); if (bunt) bunt.setAttribute('aria-pressed', v.tactic === 'bunt' ? 'true' : 'false');
      const mash = one('[data-engine-act="mash"]'); if (mash) mash.hidden = !v.stealOpen;
    }
    const subRow = one('[data-eng-subs]');
    if (subRow) {
      const batSel = one('[data-engine-sub="bat"]');
      const pitSel = one('[data-engine-sub="pitch"]');
      const fill = (sel, list, label) => { if (!sel) return; const k2 = JSON.stringify(list); if (sel.dataset.key !== k2) { sel.innerHTML = `<option value="">${label}</option>` + list.map((b) => `<option value="${Util.esc(b.cardId)}">${Util.esc(b.name)}</option>`).join(''); sel.dataset.key = k2; } };
      fill(batSel, v.benchBatters || [], '代打を選ぶ');

      if (pitSel) pitSel.hidden = !!v.batting || !(v.benchPitchers || []).length;
      subRow.hidden = (batSel && batSel.hidden) && (pitSel && pitSel.hidden);
    }
  }
  function banner(big, sub) {
    if (/ホームラン/.test(big)) NativeFeel.big(); else if (/ヒット|ツーベース/.test(big)) NativeFeel.hit(); else NativeFeel.tap();

    el.classList.remove('pop');

  Events.on('match:pitch', (e) => say(Commentary.line('pitch', e)));

  Events.on('match:hit', (e) => { say(Commentary.line('hit', e)); Sfx.crack(); Sfx.crowd(e.kind === 'HR'); });
  Events.on('match:strikeout', () => say(Commentary.line('strikeout')));
  Events.on('match:out', (e) => say(Commentary.line('out', e)));
  Events.on('match:run', (e) => say(Commentary.line('run', e)));
  Events.on('match:steal', (e) => { say(Commentary.line('steal', e)); if (e.success) Sfx.crowd(false); });
  function context() {
    const c = one('canvas');
    if (!c || /jsdom/i.test(navigator.userAgent)) return null;

  }
  function onClick(ev) {
    const b = ev.target.closest('[data-engine-act],[data-eng]');

    if (b.dataset.engineAct === 'pitch') MatchEngine.startPitch();
    else if (b.dataset.engineAct === 'swing') { NativeFeel.tap(); Sfx.whoosh(); MatchEngine.swing(); }
    else if (b.dataset.engineAct === 'shiftL') MatchEngine.setShift(-1);
    else if (b.dataset.engineAct === 'shiftR') MatchEngine.setShift(1);
    else if (b.dataset.engineAct === 'bunt') MatchEngine.setTactic('bunt');
    else if (b.dataset.engineAct === 'steal') { mashCount = 0; MatchEngine.beginSteal(); setTimeout(() => { MatchEngine.resolveSteal(mashCount); }, 1200); }
    else if (b.dataset.engineAct === 'mash') { mashCount += 1; }
    else if (b.dataset.engineAct === 'finish') MatchEngine.finish();
    else if (b.dataset.eng === 'end') MatchEngine.debugAct('end', b.dataset.r);
    else if (b.dataset.eng) MatchEngine.debugAct(b.dataset.eng);
  }
  function mount(target) {
    root = target;
    lastPitchList = '';
    root.innerHTML = markup();
    root.addEventListener('click', onClick);
    root.addEventListener('change', (ev) => { if (ev.target.matches('[data-engine-pitch]')) MatchEngine.choosePitch(ev.target.value); if (ev.target.matches('[data-engine-sub]')) { MatchEngine.substitute(ev.target.dataset.engineSub, ev.target.value); ev.target.value = ''; } });
    root.addEventListener('input', (ev) => { if (ev.target.matches('[data-eng-range]')) MatchEngine.setShiftTo(Number(ev.target.value)); });
    const canvas = one('canvas');
    if (canvas) canvas.addEventListener('pointerdown', () => { if (!one('[data-engine-act="swing"]').disabled) MatchEngine.swing(); else MatchEngine.startPitch(); });
    const port = { context, update, banner, swing: swingFx, clear: () => { if (root) root.innerHTML = ''; } };
    MatchEngine.mount(port);
    return port;
  }
  return { mount };
})();

/* ---- 1 画面遷移：画面シェル（ヘッダー・タブ・モーダル・デモ広告・トースト） ---- */
const Shell = (() => {
  const TABS = [['home', 'ホーム', 'home'], ['match', '試合', 'ball'], ['team', '編成', 'jersey'], ['scout', 'スカウト', 'notebook'], ['shop', 'ショップ', 'coins']];
  let modal = null;
  let modalOpts = null;
  let pendingOk = null;
  let overlay = false;
  let toastTimer = 0;
  let shownCoins = null;
  const $ = (id) => document.getElementById(id);
  function mount() {
    $('hdr').innerHTML = `<div class="hdr-in"><div class="hdr-team"><b id="hdr-name"></b><span id="hdr-sub"></span></div><span class="wallet" aria-label="コイン">${View.icon('coin', 'ic-coin')}<span class="num" id="hdr-coins">0</span></span><span class="wallet" aria-label="スカウトチケット">${View.icon('ticket', 'ic-ticket')}<span class="num" id="hdr-tickets">0</span></span><button class="icon-btn" type="button" data-go="config" aria-label="設定">${View.icon('gear')}</button></div>`;
    $('tabs').innerHTML = TABS.map(([id, label, ic]) => `<button class="tab" type="button" data-go="${id}" data-tabid="${id}">${View.icon(ic)}<span>${label}</span></button>`).join('');
    refreshHeader();
  }
  function renderTabs(active) {
    document.querySelectorAll('.tab').forEach((t) => { if (t.dataset.tabid === active) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  }
  // コインは0.4秒で数え上げる（NAV-05：0.5秒以内に正しい値）
  function countUp(el, from, to) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (from === to || reduce || !window.requestAnimationFrame) { el.textContent = Util.fmt(to); return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 400);
      el.textContent = Util.fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
      if (k < 1) window.requestAnimationFrame(step);
    };
    window.requestAnimationFrame(step);
  }
  function refreshHeader() {
    if (!$('hdr-name')) return;
    const w = Economy.getWallet();
    const cal = League.getCalendar();
    const p = Growth.getProtagonist();
    const stage = cal.phase === 'graduation'
      ? '3年卒業・世代交代'
      : cal.complete
        ? (cal.champion ? '甲子園優勝・年度終了' : '大会終了・年度終了')
        : (cal.nextMatch ? cal.nextMatch.label : '地方予選');
    $('hdr-name').textContent = Growth.getTeamName();
    $('hdr-sub').textContent = `${cal.year}年目（第${cal.generation}世代・${p.grade || 1}年） ${stage}`;
    countUp($('hdr-coins'), shownCoins === null ? w.coins : shownCoins, w.coins);
    shownCoins = w.coins;
    $('hdr-tickets').textContent = Util.fmt(w.scoutTickets);
  }
  function toast(text) {
    $('layer-toast').innerHTML = `<div class="toast" role="status">${Util.esc(text)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('layer-toast').innerHTML = ''; }, 2400);
  }
  // モーダルは履歴を積まない。戻る操作で閉じたときも onClose が呼ばれる
  function openModal(id, params = {}, opts = {}) {
    modal = id;
    modalOpts = opts;
    $('layer-modal').innerHTML = Modals[id](params);
    const first = document.querySelector('#layer-modal .sheet button');
    if (first) first.focus({ preventScroll: true });
  }
  function closeModal(reason = 'ui') {
    if (!modal) return;
    const opts = modalOpts || {};
    modal = null;
    modalOpts = null;
    $('layer-modal').innerHTML = '';
    if (opts.onClose) opts.onClose(reason);
  }
  function confirm(p, onOk, onCancel) {
    pendingOk = onOk;
    openModal('confirm', p, { onClose: (reason) => { if (reason !== 'ok' && onCancel) onCancel(); } });
  }
  function confirmOk() { const fn = pendingOk; pendingOk = null; closeModal('ok'); if (fn) fn(); }
  // デモ広告：数秒の全画面表示。閉じるまで戻る操作は効かない
  function showDemoAd(seconds, label = 'デモ広告') {
    return new Promise((resolve) => {
      overlay = true;
      let left = seconds;
      const draw = () => { $('layer-overlay').innerHTML = `<div class="ad" role="dialog" aria-modal="true" aria-label="${Util.esc(label)}"><span class="ad-tag">${Util.esc(label)}</span><div class="ad-box"><div><p>ここに広告が入ります（デモ）</p><p class="note">実際の広告SDKは使いません</p></div></div><b class="ad-count num" aria-live="polite">${left}</b><p class="note">あと${left}秒で閉じます</p></div>`; };
      draw();
      const timer = setInterval(() => {
        left -= 1;
        if (left > 0) { draw(); return; }
        clearInterval(timer);
        $('layer-overlay').innerHTML = '';
        overlay = false;
        resolve();
      }, 1000);
    });
  }
  return { mount, renderTabs, refreshHeader, toast, openModal, closeModal, confirm, confirmOk, showDemoAd, hasModal: () => !!modal, hasOverlay: () => overlay, currentModal: () => modal };
})();

    const p = cfg.teams[pitcherSide === 'user' ? 'user' : 'opponent'].pitcher;
    const bat = b
      ? `<span class="sc-pos">${CONFIG.LABELS.pos[b.pos]}</span><span class="sc-main"><b>${e.order}番 ${Util.esc(b.name)}</b><small>ミ${b.abilities.meet} パ${b.abilities.power} 走${b.abilities.speed}</small></span>`
      : `<span class="sc-pos">打</span><span class="sc-main"><b>${e.order}番 打者</b><small>能力データなし</small></span>`;
    el.innerHTML = `<div class="strip-card">${bat}</div><div class="strip-card"><span class="sc-pos">投</span><span class="sc-main"><b>${Util.esc(p.name)}</b><small><span id="g-kmh">${p.kmh}</span>km/h　球数 <span id="g-count">0</span></small></span></div>`;
  }
  function bind(config) {
    unbind();
    cfg = config;
    lines = { away: [], home: [] };
    info = null;
    offs = [
      Events.on('match:start', (e) => { mark(e); drawBoard(); }),
      Events.on('match:atBat', (e) => { mark(e); drawBoard(); drawStrip(e); }),
      Events.on('match:run', (e) => { mark(e); const key = teamKey(e.side); lines[key][e.inning - 1] = (lines[key][e.inning - 1] || 0) + e.runs; drawBoard(); }),
      Events.on('match:out', (e) => { mark(e); drawBoard(); }),
      Events.on('match:pitch', (e) => { if (e.side !== pitcherSide) return; const c = $('g-count'); const k = $('g-kmh'); if (c) c.textContent = e.count; if (k && e.kmh) k.textContent = Math.round(e.kmh); }),
    ];
  }
  function unbind() { offs.forEach((off) => off()); offs = []; }
  function describeBatter(e, config) {
    const b = config && config.teams && config.teams[e.side] && config.teams[e.side].lineup.find((x) => x.cardId === e.cardId);
    return b ? `${e.order}番 ${b.name} ${CONFIG.LABELS.pos[b.pos]} ミ${b.abilities.meet} パ${b.abilities.power} 走${b.abilities.speed}` : '';
  }
  return { bind, unbind, describeBatter };
})();

/* ---- 1 画面遷移：ルーター（自前の履歴を正とし、ブラウザの履歴にも写す） ---- */
const Router = (() => {
  let stack = [{ name: 'home', params: {} }];
  let historyOk = true;
  const top = () => stack[stack.length - 1];
  function write(method) {
    try { window.history[method]({ name: top().name }, '', `#${top().name}`); } catch (e) { historyOk = false; }
  }
  function render() {
    const t = top();
    const meta = Screens.meta(t.name);
    GameHud.unbind();
    if (t.name !== 'game' && MatchEngine.isRunning()) MatchEngine.abort();
    document.getElementById('app').classList.toggle('is-immersive', !!meta.immersive);
    Shell.renderTabs(meta.tab || null);
    const view = document.getElementById('view');
    view.innerHTML = Screens.render(t.name, t.params);
    view.scrollTop = 0;
    Screens.after(t.name, t.params);
    Shell.refreshHeader();
  }
  function go(name, params = {}) {
    stack.push({ name: Screens.has(name) ? name : 'home', params });
    write('pushState');
    render();
  }
  function replace(name, params = {}) {
    stack[stack.length - 1] = { name: Screens.has(name) ? name : 'home', params };
    write('replaceState');
    render();
  }
  // 同じ画面のまま表示だけ切り替える（画面内のタブ・並べ替え）。履歴は積まない
  function refresh(patch = {}) { top().params = { ...top().params, ...patch }; render(); }
  // 初回起動・v1移行直後は主人公作成から、世代終了時は卒業画面から、それ以外はホームから開始
  function start() {
    const cal = League.getCalendar();
    const initial = cal.phase === 'graduation' ? 'graduation' : (!Growth.hasProtagonist() ? 'create' : 'home');
    stack = [{ name: initial, params: {} }];
    write('replaceState');
    render();
  }
  function handleBack(fromBrowser) {
    const keep = () => { if (fromBrowser && historyOk) write('pushState'); };
    if (Shell.hasOverlay()) { keep(); return; }                                       // デモ広告中は戻らない
    if (Shell.hasModal()) { Shell.closeModal('back'); keep(); return; }              // モーダルを閉じる
    if (top().name === 'game' && MatchEngine.isRunning()) { Actions.pause(); keep(); return; } // 試合中は一時停止
    if (stack.length <= 1) return;                                                     // ホームではブラウザに任せる
    stack.pop();
    if (top().name === 'game') top().name = 'match';                                   // 終わった試合へは戻らない
    render();
  }
  function back() { if (historyOk && stack.length > 1) window.history.back(); else handleBack(false); }
  return { go, replace, refresh, start, back, current: () => ({ ...top() }), depth: () => stack.length, onPopState: () => handleBack(true) };
})();

/* ---- デバッグ（?debug=1 のときだけ出す。全モジュールの公開関数を呼べるが、内部の状態は触らない） ---- */
const Debug = (() => {
  let enabled = false;
  try { enabled = new URLSearchParams(window.location.search).get('debug') === '1'; } catch (e) { enabled = false; }
  let fpsOn = false;
  let frames = 0;
  let t0 = 0;
  function mount() {
    if (!enabled) return;
    document.getElementById('layer-debug').innerHTML = '<button class="dbg-fab" type="button" data-act="debugOpen">デバッグ</button><div class="fps" id="fps" hidden></div>';
  }
  function loop(t) {
    if (!fpsOn) return;
    frames += 1;
    if (t - t0 >= 1000) { const el = document.getElementById('fps'); if (el) el.textContent = `${Math.round((frames * 1000) / (t - t0))} FPS`; frames = 0; t0 = t; }
    window.requestAnimationFrame(loop);
  }
  function toggleFps() {
    const el = document.getElementById('fps');
    if (!el) return;
    fpsOn = !fpsOn;
    el.hidden = !fpsOn;
    if (fpsOn && window.requestAnimationFrame) { frames = 0; t0 = performance.now(); window.requestAnimationFrame(loop); }
  }
  return { enabled: () => enabled, mount, toggleFps };
})();

/* ---- 試合終了トランザクション（通算記録→ミッション→報酬→育成→保存を固定順で1回） ---- */
const MatchFlow = (() => {
  let last = null;
  Events.on('match:end', (event) => {
    const before = Save.commitCount();
    const result = League.settleMatch(event);
    const missions = Missions.settleMatch(event);
    const rewards = Economy.settleMatch(event);
    const growth = Growth.settleMatch(event);
    const saved = Save.commit('matchEnd');
    last = { result, missions, rewards, growth, saved, commits: Save.commitCount() - before };
    Events.emit('match:settled', { event, ...last });
  });
  return { last: () => (last ? { ...last } : null) };
})();

/* ---- 1 画面遷移：起動と組み立て ---- */
const App = (() => {
  function onClick(ev) {
    const el = ev.target.closest('[data-go],[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.go) { Router.go(el.dataset.go, el.dataset.id ? { id: el.dataset.id } : {}); return; }
    const fn = Actions[el.dataset.act];
    if (fn) fn(el, ev);
  }
  function onInput(ev) {
    const out = ev.target.dataset && ev.target.dataset.out;
    if (out) { const o = document.getElementById(out); if (o) o.textContent = ev.target.value; }
  }
  function boot() {
    Save.load();                              // 開発用v2本体、破損時はバックアップから復旧
    Economy.syncCareer(League.getCareer());   // 経済（ミッション）へ通算記録を渡す
    Shell.mount();
    Events.on('wallet:changed', () => Shell.refreshHeader());
    Events.on('premium:changed', () => Shell.refreshHeader());
    // 試合が終わったら結果へ（試合の画面は履歴から外す）
    Events.on('match:settled', () => { setTimeout(() => { if (Router.current().name === 'game') Router.replace('result'); }, 0); });
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    window.addEventListener('popstate', Router.onPopState);
    Router.start();
    Debug.mount();
  }
  return { boot };
})();

App.boot();
</script>
</body>
</html>
