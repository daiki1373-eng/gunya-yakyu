      : [['ミート', 'ミ', a.meet, a.meet], ['パワー', 'パ', a.power, a.power], ['走力', '走', a.speed, a.speed], ['守備', '守', a.defense, a.defense]];
  }
  const abilityList = (c) => triples(c).map(([l, , v, sc]) => {
    const r = Growth.rankOf(sc);
    return `<span class="ab"><span class="ab-l">${l}</span><span class="ab-r rk-${r}">${r}</span><span class="ab-v">${v}</span><span class="ab-bar"><i class="bg-${r}" style="width:${Math.max(3, Math.round(sc))}%"></i></span></span>`;
  }).join('');
  const miniRanks = (c) => triples(c).map(([, sh, , sc]) => { const r = Growth.rankOf(sc); return `<span>${sh}<b class="rk-${r}">${r}</b></span>`; }).join('');
  const miniAbs = (c) => triples(c).map(([, sh, v, sc]) => { const r = Growth.rankOf(sc); return `<span>${sh}<b class="rk-${r}">${r}</b><em>${v}</em></span>`; }).join('');
  // 選手カード。opts.go＝押すと選手詳細／opts.size＝'is-big'・'is-mini'／opts.caption＝下段の補足
  function card(c, opts = {}) {
    const tag = opts.go ? 'button' : opts.tag || 'div';
    const attrs = opts.go ? ` type="button" data-go="player" data-id="${c.id}" aria-label="${esc(c.name)}の詳細"` : '';
    const body = opts.size === 'is-mini' ? `<span class="pc-ranks">${miniRanks(c)}</span>` : `<span class="pc-abs">${abilityList(c)}</span>`;
    const sub = `${'★'.repeat(c.rarity)} ${c.rarityName}　Lv${c.lv}${opts.caption ? `　${esc(opts.caption)}` : ''}`;
    return `<${tag} class="pcard r${c.rarity}${opts.size ? ` ${opts.size}` : ''}"${attrs}><span class="pc-top"><span class="pc-pos">${c.posLabel}</span><span class="pc-ovr"><small>総合</small><b>${c.overall}</b></span></span><span class="pc-fig">${figure(c)}</span><span class="pc-name">${esc(c.name)}</span><span class="pc-sub">${sub}</span>${body}</${tag}>`;
  }
  // 相手の先発（カードマスタにいない選手）をカードの形で見せる
  function oppPitcherCard(p) {
    const view = { id: 'cpu', name: p.name, number: p.number, type: 'P', posLabel: '投', rarity: 2, rarityName: '相手', lv: '—', overall: p.overall, abilities: { kmh: p.kmh, control: p.abilities.control, stamina: p.abilities.stamina, movement: p.abilities.movement } };
    return card(view, { caption: '相手先発' });
  }
  function boardRows(next, teams, userOverall) {
    const user = { name: Growth.getTeamName(), ovr: userOverall, me: true };
    const opp = { name: teams[next.opponentId].name, ovr: teams[next.opponentId].overall, me: false };
    const [away, home] = next.home ? [opp, user] : [user, opp];
    const row = (t, side) => `<div class="board-row"><span class="board-side">${side}</span><span class="board-team${t.me ? ' me' : ''}">${esc(t.name)}</span><span class="board-num led">${t.ovr}</span></div>`;
    return row(away, '先攻') + row(home, '後攻');
  }
  const lineupRow = (b) => `<button class="lu" type="button" data-go="player" data-id="${b.cardId}"><span class="lu-no">${b.order}</span><span class="lu-pos${b.fit ? '' : ' misfit'}">${b.posLabel}</span><span class="lu-main"><b>${esc(b.name)}</b><span class="mini-abs">${miniAbs(b)}</span>${b.fit ? '' : '<small class="warn">守備 −30%（適性外）</small>'}</span><span class="lu-ovr">${b.overall}</span></button>`;
  const lineupEditRow = (b, index) => `<div class="lu lu-edit"><span class="lu-no">${b.order}</span><button class="lu-pos${b.fit ? '' : ' misfit'}" type="button" data-act="cyclePosition" data-index="${index}" aria-label="${b.order}番 ${esc(b.name)}の守備位置を変更">${b.posLabel}</button><button class="lu-main" type="button" data-go="player" data-id="${b.cardId}"><b>${esc(b.name)}</b><span class="mini-abs">${miniAbs(b)}</span>${b.fit ? '<small>守備位置を押すと交代</small>' : '<small class="warn">守備 −30%（適性外）</small>'}</button><span class="lu-ovr">${b.overall}</span><button class="lu-swap" type="button" data-act="cycleLineupPlayer" data-index="${index}">控え野手と交代</button></div>`;
  const rotationRow = (p, index) => `<div class="lu"><span class="lu-no">${p.slot}</span><span class="lu-pos">投</span><button class="lu-main" type="button" data-go="player" data-id="${p.cardId}"><b>${esc(p.name)}${p.isNext ? '<span class="next-tag">次の先発</span>' : ''}</b><span class="mini-abs">${miniAbs(p)}</span><small>得意球種：${p.specialNames.join('・')}${p.fatigued ? '　疲労 −15%' : ''}</small></button><span class="lu-ovr">${p.overall}</span><button class="lu-swap" type="button" data-act="cycleRotationPlayer" data-index="${index}">所持投手と交代</button></div>`;
  const standingsTable = (rows) => `<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>位</th><th class="t-team">球団</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th><th>差</th></tr></thead><tbody>${rows.map((r) => `<tr class="${r.isUser ? 'me' : ''}"><td>${r.rank}</td><td class="t-team">${esc(r.short)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d}</td><td>${r.pctText}</td><td>${r.gbText}</td></tr>`).join('')}</tbody></table></div>`;
  const seg = (items, key, cur, label) => `<div class="seg" role="group" aria-label="${label}">${items.map(([k, t]) => `<button type="button" data-act="setParam" data-key="${key}" data-val="${k}" aria-pressed="${cur === k}">${t}</button>`).join('')}</div>`;
  return { icon, draft, lockNote, pageHead, card, oppPitcherCard, boardRows, lineupRow, lineupEditRow, rotationRow, standingsTable, seg, miniAbs, LB };
})();

/* ---- 1 画面遷移：試合キャンバスのDOMアダプター ---- */
const GameSurface = (() => {
  let root = null;
  let bannerTimer = 0;
  let lastPitchList = '';
  const one = (sel) => (root ? root.querySelector(sel) : null);
  function markup() {
    return `<div class="eng">
      <div class="eng-stage"><canvas class="eng-canvas" width="960" height="540" aria-label="ぐにゃ野球の試合画面"></canvas><div class="eng-banner" aria-live="polite"><b></b><span></span></div></div>
      <div class="eng-controls">
        <p class="eng-status" aria-live="polite">試合を準備しています</p>
        <div class="eng-pitch-row"><select class="eng-select" data-engine-pitch aria-label="球種"></select><button class="eng-action main" type="button" data-engine-act="pitch">投球開始</button></div>
        <button class="eng-action swing" type="button" data-engine-act="swing">スイング</button>
        <div class="eng-meter" aria-hidden="true"><i></i></div>
        <button class="eng-action" type="button" data-engine-act="finish" hidden>このモードを終了</button>
      </div>
      <div hidden aria-hidden="true">
        <button data-eng="hit"></button><button data-eng="hr"></button><button data-eng="out"></button><button data-eng="k"></button><button data-eng="oppHit"></button><button data-eng="oppRun"></button>
        <button data-eng="end" data-r="W"></button><button data-eng="end" data-r="L"></button><button data-eng="end" data-r="D"></button>
      </div>
    </div>`;
  }
  function update(v) {
    if (!root) return;
    const status = one('.eng-status');
    const pitch = one('[data-engine-act="pitch"]');
    const swing = one('[data-engine-act="swing"]');
    const finish = one('[data-engine-act="finish"]');
    const select = one('[data-engine-pitch]');
    if (status) status.textContent = `${v.status}${v.total ? `　${v.attempts}/${v.total}球` : ''}`;
    if (pitch) { pitch.disabled = !v.canPitch; pitch.textContent = v.batting ? '投球開始' : '投げる'; }
    if (swing) swing.disabled = !v.canSwing;
    if (finish) { finish.hidden = !v.canFinish; finish.disabled = !v.canFinish; }
    const key = JSON.stringify(v.pitches || []);
    if (select && key !== lastPitchList) { select.innerHTML = (v.pitches || []).map((p) => `<option value="${Util.esc(p.id)}">${Util.esc(p.name)}</option>`).join(''); lastPitchList = key; }
    if (select) { select.value = v.selectedPitch; select.disabled = v.batting || !v.canPitch; }
  }
  function banner(big, sub) {
    const box = one('.eng-banner');
    if (!box) return;
    box.querySelector('b').textContent = big;
    box.querySelector('span').textContent = sub || '';
    box.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { if (box) box.classList.remove('show'); }, 700);
  }
  function swingFx() {
    const b = one('[data-engine-act="swing"]');
    if (!b) return;
    b.classList.add('pulse');
    setTimeout(() => b.classList.remove('pulse'), 100);
  }
  function context() {
    const c = one('canvas');
    if (!c || /jsdom/i.test(navigator.userAgent)) return null;
    return c.getContext('2d');
  }
  function onClick(ev) {
    const b = ev.target.closest('[data-engine-act],[data-eng]');
    if (!b || b.disabled) return;
    if (b.dataset.engineAct === 'pitch') MatchEngine.startPitch();
    else if (b.dataset.engineAct === 'swing') MatchEngine.swing();
    else if (b.dataset.engineAct === 'finish') MatchEngine.finish();
    else if (b.dataset.eng === 'end') MatchEngine.debugAct('end', b.dataset.r);
    else if (b.dataset.eng) MatchEngine.debugAct(b.dataset.eng);
  }
  function mount(target) {
    root = target;
    lastPitchList = '';
    root.innerHTML = markup();
    root.addEventListener('click', onClick);
    root.addEventListener('change', (ev) => { if (ev.target.matches('[data-engine-pitch]')) MatchEngine.choosePitch(ev.target.value); });
    const canvas = one('canvas');
    if (canvas) canvas.addEventListener('pointerdown', () => { if (!one('[data-engine-act="swing"]').disabled) MatchEngine.swing(); else MatchEngine.startPitch(); });
    const port = { context, update, banner, swing: swingFx, clear: () => { if (root) root.innerHTML = ''; } };
    MatchEngine.mount(port);
    return port;
  }
  return { mount };
})();

/* ---- 1 画面遷移：画面シェル（ヘッダー・タブ・モーダル・デモ広告・トースト） ---- */
const Shell = (() => {
  const TABS = [['home', 'ホーム', 'home'], ['match', '試合', 'ball'], ['team', '編成', 'jersey'], ['scout', 'スカウト', 'notebook'], ['shop', 'ショップ', 'coins']];
  let modal = null;
  let modalOpts = null;
  let pendingOk = null;
  let overlay = false;
  let toastTimer = 0;
  let shownCoins = null;
  const $ = (id) => document.getElementById(id);
  function mount() {
    $('hdr').innerHTML = `<div class="hdr-in"><div class="hdr-team"><b id="hdr-name"></b><span id="hdr-sub"></span></div><span class="wallet" aria-label="コイン">${View.icon('coin', 'ic-coin')}<span class="num" id="hdr-coins">0</span></span><span class="wallet" aria-label="スカウトチケット">${View.icon('ticket', 'ic-ticket')}<span class="num" id="hdr-tickets">0</span></span><button class="icon-btn" type="button" data-go="config" aria-label="設定">${View.icon('gear')}</button></div>`;
    $('tabs').innerHTML = TABS.map(([id, label, ic]) => `<button class="tab" type="button" data-go="${id}" data-tabid="${id}">${View.icon(ic)}<span>${label}</span></button>`).join('');
    refreshHeader();
  }
  function renderTabs(active) {
    document.querySelectorAll('.tab').forEach((t) => { if (t.dataset.tabid === active) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  }
  // コインは0.4秒で数え上げる（NAV-05：0.5秒以内に正しい値）
  function countUp(el, from, to) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (from === to || reduce || !window.requestAnimationFrame) { el.textContent = Util.fmt(to); return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 400);
      el.textContent = Util.fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
      if (k < 1) window.requestAnimationFrame(step);
    };
    window.requestAnimationFrame(step);
  }
  function refreshHeader() {
    if (!$('hdr-name')) return;
    const w = Economy.getWallet();
    const season = League.getSeason();
    $('hdr-name').textContent = Growth.getTeamName();
    $('hdr-sub').textContent = season.complete ? `シーズン${season.season}　全10節終了` : `シーズン${season.season}　第${season.nextRound}節`;
    countUp($('hdr-coins'), shownCoins === null ? w.coins : shownCoins, w.coins);
    shownCoins = w.coins;
    $('hdr-tickets').textContent = Util.fmt(w.scoutTickets);
  }
  function toast(text) {
    $('layer-toast').innerHTML = `<div class="toast" role="status">${Util.esc(text)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('layer-toast').innerHTML = ''; }, 2400);
  }
  // モーダルは履歴を積まない。戻る操作で閉じたときも onClose が呼ばれる
  function openModal(id, params = {}, opts = {}) {
    modal = id;
    modalOpts = opts;
    $('layer-modal').innerHTML = Modals[id](params);
    const first = document.querySelector('#layer-modal .sheet button');
    if (first) first.focus({ preventScroll: true });
  }
  function closeModal(reason = 'ui') {
    if (!modal) return;
    const opts = modalOpts || {};
    modal = null;
    modalOpts = null;
    $('layer-modal').innerHTML = '';
    if (opts.onClose) opts.onClose(reason);
  }
  function confirm(p, onOk, onCancel) {
    pendingOk = onOk;
    openModal('confirm', p, { onClose: (reason) => { if (reason !== 'ok' && onCancel) onCancel(); } });
  }
  function confirmOk() { const fn = pendingOk; pendingOk = null; closeModal('ok'); if (fn) fn(); }
  // デモ広告：数秒の全画面表示。閉じるまで戻る操作は効かない
  function showDemoAd(seconds, label = 'デモ広告') {
    return new Promise((resolve) => {
      overlay = true;
      let left = seconds;
      const draw = () => { $('layer-overlay').innerHTML = `<div class="ad" role="dialog" aria-modal="true" aria-label="${Util.esc(label)}"><span class="ad-tag">${Util.esc(label)}</span><div class="ad-box"><div><p>ここに広告が入ります（デモ）</p><p class="note">実際の広告SDKは使いません</p></div></div><b class="ad-count num" aria-live="polite">${left}</b><p class="note">あと${left}秒で閉じます</p></div>`; };
      draw();
      const timer = setInterval(() => {
        left -= 1;
        if (left > 0) { draw(); return; }
        clearInterval(timer);
        $('layer-overlay').innerHTML = '';
        overlay = false;
        resolve();
      }, 1000);
    });
  }
  return { mount, renderTabs, refreshHeader, toast, openModal, closeModal, confirm, confirmOk, showDemoAd, hasModal: () => !!modal, hasOverlay: () => overlay, currentModal: () => modal };
})();

/* ---- 1 画面遷移：モーダルの中身（下から出るシート） ---- */
const Modals = (() => {
  const sheet = (inner, backAct) => `<div class="sheet-back" data-act="${backAct}"><div class="sheet" role="dialog" aria-modal="true" data-act="noop">${inner}</div></div>`;
  const big = (r) => (r.coins ? [Util.fmt(r.coins), 'コイン'] : r.scoutTickets ? [r.scoutTickets, 'スカウト券'] : [r.guaranteeTickets, '★3以上確定']);
  return {
    loginBonus() {
      const lb = LoginBonus.check();
      const days = LoginBonus.table().map((d) => { const [n, unit] = big(d.reward); return `<div class="lb-day${d.day === lb.day ? ' today' : ''}${d.day < lb.day ? ' done' : ''}${d.day === 7 ? ' big' : ''}"><small>${d.day}日目</small><b>${n}</b><span>${unit}</span></div>`; }).join('');
      return sheet(`<h2>ログインボーナス</h2><p>${lb.eligible ? `今日は${lb.day}日目の報酬です。` : '今日の報酬は受取済みです。'}受け取った日数で進み、7日目の次は1日目に戻ります。</p><div class="lb-grid">${days}</div><button class="btn btn-amber" type="button" data-act="claimLoginBonus"${lb.eligible ? '' : ' disabled'}>受け取る</button>`, 'closeModal');
    },
    pause: () => sheet(`<h2>一時停止</h2><p>試合は止まっています。</p><button class="btn btn-turf" type="button" data-act="resume">再開</button><button class="btn btn-line" type="button" data-act="askQuit">試合をやめる</button>`, 'resume'),
    confirm: (p) => sheet(`<h2>${Util.esc(p.title)}</h2><p>${Util.esc(p.body)}</p><div class="btn-row"><button class="btn btn-line" type="button" data-act="closeModal">${Util.esc(p.cancelLabel || 'やめておく')}</button><button class="btn ${p.danger ? 'btn-danger' : 'btn-amber'}" type="button" data-act="confirmOk">${Util.esc(p.okLabel)}</button></div>`, 'closeModal'),
    debug: () => sheet(`<h2>デバッグ</h2><p>${CONFIG.VERSION}。URL に ?debug=1 があるときだけ出ます。</p><div class="dbg-list"><button class="btn btn-line" type="button" data-act="debugCoins">コイン＋1,000</button><button class="btn btn-line" type="button" data-act="debugTickets">チケット＋10</button><button class="btn btn-line" type="button" data-act="debugFps">FPS表示の切り替え</button><button class="btn btn-amber" type="button" data-act="debugTest">自己テスト</button><button class="btn btn-line" type="button" data-act="debugSave">保存データの枠</button><button class="btn btn-line" type="button" data-act="debugSeason">シーズン終了画面</button><button class="btn btn-line" type="button" data-act="debugLogin">ログボを表示</button><button class="btn btn-line" type="button" data-act="closeModal">閉じる</button></div><pre class="dbg-out" id="dbg-out">結果はここに出ます</pre>`, 'closeModal'),
  };
})();

/* ---- 1 画面遷移：試合画面のスコアボードと選手の帯（試合の通知を受けて描く） ---- */
const GameHud = (() => {
  let offs = [];
  let cfg = null;
  let lines = null;
  let info = null;
  let pitcherSide = null;
  const $ = (id) => document.getElementById(id);
  const teamKey = (side) => (side === 'user' ? cfg.userSide : cfg.userSide === 'home' ? 'away' : 'home');
  function names() {
    if (!cfg.teams) return cfg.userSide === 'home' ? { home: 'あなた', away: '相手' } : { home: '相手', away: 'あなた' };
    const u = cfg.teams.user.name;
    const o = cfg.teams.opponent.name;
    return cfg.userSide === 'home' ? { home: u, away: o } : { home: o, away: u };
  }
  function mark(e) {
    info = { inning: e.inning, half: e.half, outs: e.outs, score: e.score };
    const key = e.half === 'top' ? 'away' : 'home';
    if (lines[key][e.inning - 1] == null) lines[key][e.inning - 1] = 0;
  }
  function drawBoard() {
    const el = $('g-board');
    if (!el || !info) return;
    const n = names();
    const cols = Array.from({ length: cfg.innings }, (_, i) => i);
    const row = (key) => `<tr><td class="t">${Util.esc(n[key])}</td>${cols.map((i) => { const v = lines[key][i]; const now = info.inning === i + 1 && (info.half === 'top') === (key === 'away'); return `<td class="${now ? 'now' : ''}">${v == null ? '' : v}</td>`; }).join('')}<td class="sum">${info.score[key]}</td></tr>`;
    el.innerHTML = `<table><thead><tr><th></th>${cols.map((i) => `<th>${i + 1}</th>`).join('')}<th>計</th></tr></thead><tbody>${row('away')}${row('home')}</tbody></table><div class="sb-meta"><span>${CONFIG.LABELS.mode[cfg.mode]}　${info.inning}回${info.half === 'top' ? '表' : '裏'}</span><span>アウト <b class="outs">${'●'.repeat(info.outs)}${'○'.repeat(3 - info.outs)}</b></span></div>`;
  }
  function drawStrip(e) {
    const el = $('g-strip');
    if (!el) return;
    if (!cfg.teams) { el.innerHTML = `<div class="strip-card wide"><span class="sc-main"><b>${CONFIG.LABELS.mode[cfg.mode]}</b><small>現行モード（能力補正なし）</small></span></div>`; return; }
    const userBat = e.side === 'user';
    const b = cfg.teams[e.side].lineup.find((x) => x.cardId === e.cardId);
    pitcherSide = userBat ? 'opponent' : 'user';
    const p = cfg.teams[pitcherSide === 'user' ? 'user' : 'opponent'].pitcher;
    const bat = b
      ? `<span class="sc-pos">${CONFIG.LABELS.pos[b.pos]}</span><span class="sc-main"><b>${e.order}番 ${Util.esc(b.name)}</b><small>ミ${b.abilities.meet} パ${b.abilities.power} 走${b.abilities.speed}</small></span>`
      : `<span class="sc-pos">打</span><span class="sc-main"><b>${e.order}番 打者</b><small>能力データなし</small></span>`;
    el.innerHTML = `<div class="strip-card">${bat}</div><div class="strip-card"><span class="sc-pos">投</span><span class="sc-main"><b>${Util.esc(p.name)}</b><small><span id="g-kmh">${p.kmh}</span>km/h　球数 <span id="g-count">0</span></small></span></div>`;
  }
  function bind(config) {
    unbind();
    cfg = config;
    lines = { away: [], home: [] };
    info = null;
    offs = [
      Events.on('match:start', (e) => { mark(e); drawBoard(); }),
      Events.on('match:atBat', (e) => { mark(e); drawBoard(); drawStrip(e); }),
      Events.on('match:run', (e) => { mark(e); const key = teamKey(e.side); lines[key][e.inning - 1] = (lines[key][e.inning - 1] || 0) + e.runs; drawBoard(); }),
      Events.on('match:out', (e) => { mark(e); drawBoard(); }),
      Events.on('match:pitch', (e) => { if (e.side !== pitcherSide) return; const c = $('g-count'); const k = $('g-kmh'); if (c) c.textContent = e.count; if (k && e.kmh) k.textContent = Math.round(e.kmh); }),
    ];
  }
  function unbind() { offs.forEach((off) => off()); offs = []; }
  function describeBatter(e, config) {
    const b = config && config.teams && config.teams[e.side] && config.teams[e.side].lineup.find((x) => x.cardId === e.cardId);
    return b ? `${e.order}番 ${b.name} ${CONFIG.LABELS.pos[b.pos]} ミ${b.abilities.meet} パ${b.abilities.power} 走${b.abilities.speed}` : '';
  }
  return { bind, unbind, describeBatter };
})();

/* ---- 1 画面遷移：13画面（ホーム／試合ハブ／編成／スカウト／ショップ／ミッション／設定／試合前／試合／試合結果／シーズン終了／選手詳細／スカウト演出） ---- */
const Screens = (() => {

  S.home = () => {

      <div class="status"><div class="ovr"><small>チーム総合力</small><b>${ovr}</b></div>
        <dl class="facts"><div class="fact"><dt>順位</dt><dd><b>${me.rank}</b>位</dd></div><div class="fact"><dt>勝率</dt><dd><b>${me.pctText}</b></dd></div>
        <div class="fact wide"><dt>成績（${season.played}試合）</dt><dd><b>${me.w}</b>勝 <b>${me.l}</b>敗 <b>${me.d}</b>分</dd></div></dl></div>

      <button class="row-link" type="button" data-go="missions">${View.icon('checklist')}<span><b>ミッション</b><small>デイリー ${daily.filter((m) => m.done).length}/${daily.length} 達成${cap.reached ? '　非リーグ試合・広告は上限' : ''}</small></span>${badge ? `<span class="badge" aria-label="未受取 ${badge}件">${badge}</span>` : '<span></span>'}${View.icon('chevron')}</button>
    </section>`;

  S.match = () => {
    const season = League.getSeason();
    const next = League.getNextMatch();

      return `<div class="sched-row${isNext ? ' is-next' : ''}"><span class="rd">第${rd.round}節</span><span class="vs">${esc(teams[u.opponentId].name)}</span><span class="ha">${u.home ? 'ホーム' : 'ビジター'}</span>${res}</div>`;

      <div class="sec-h first"><h2>シーズン${season.season}</h2><p>第${season.played}節まで消化</p></div>

      <div class="sec-h"><h2>その他のモード</h2><p>リーグの成績には入りません</p></div>
      <div class="modes">${mode('practice', '練習', '現行の練習モード')}${mode('challenge10', '10球チャレンジ', '現行のまま')}${mode('exhibition', 'エキシビション', '現行の3回制の試合')}</div>

      <div class="engine-mount" id="engine-mount"><!-- 試合エンジン接続点：MatchEngine.mount() の中身はエンジン本体が描く --></div>
      <div class="game-strip" id="g-strip"></div>
    </section>`;

  S.result = () => {
    const r = League.getLastResult();
    if (!r) return `<section class="screen">${View.pageHead('試合結果')}<p class="note">表示できる結果がありません。</p><button class="btn btn-line" type="button" data-go="match">試合ハブへ</button></section>`;
    const league = r.mode === 'league';
    const rw = Economy.getLastMatchRewards();
    const gx = Growth.getLastExpGain();
    const row = (label, value) => `<div class="kv"><span>${label}</span><b class="num">${value}</b></div>`;
    const rewards = league && rw ? `<div class="sec-h"><h2>コイン</h2><p>${rw.granted ? '付与済み' : '表示のみ（リーグ報酬は未実装）'}</p></div><div class="panel">${row(`ヒット ${rw.hits}本 ×${CONFIG.ECONOMY.hitCoins}`, fmt(rw.hitCoins))}${row(`本塁打 ${rw.homeruns}本 ×${CONFIG.ECONOMY.homerunCoins}`, fmt(rw.homerunCoins))}${row(`試合報酬（${RESULT[rw.result]}）`, fmt(rw.resultCoins))}${row('合計', fmt(rw.total))}</div>` : '';
    const mvp = league && r.mvp ? Growth.getCard(r.mvp) : null;

      <div class="sec-h first"><h2>${league ? `第${r.round}節の結果` : `${r.modeLabel}の結果`}</h2></div>

        <div class="board-row"><span class="board-side">先攻</span><span class="board-team${r.userSide === 'away' ? ' me' : ''}">${esc(r.awayName)}</span><span class="board-num led">${r.score.away}</span></div>
        <div class="board-row"><span class="board-side">後攻</span><span class="board-team${r.userSide === 'home' ? ' me' : ''}">${esc(r.homeName)}</span><span class="board-num led">${r.score.home}</span></div></div>
      ${league ? rewards : '<p class="note">現行モードでは、ヒットと本塁打のコインはその場で入ります。</p>'}
      ${gx ? `<div class="sec-h"><h2>育成</h2><p>経験値付与済み</p></div><div class="panel">${row('出場選手', `${gx.rows.length}人`)}${row('出場', `+${CONFIG.GROWTH.appearanceExp}`)}${r.result === 'W' ? row('勝利', `+${CONFIG.GROWTH.winExp}`) : ''}${r.mvp ? row('MVP', `+${CONFIG.GROWTH.mvpExp}`) : ''}</div>` : ''}

      <div class="season-hero"><span>最終順位</span><b class="led">${me.rank}</b><span>位</span></div>
      <div class="sec-h"><h2>順位報酬</h2></div><div class="panel">${rewards}</div>
      <div class="sec-h"><h2>最終順位表</h2></div>${View.standingsTable(rows)}

    </section>`;

    const tab = p.tab || 'order';
    const sort = p.sort || 'overall';

      body = `<div class="sec-h"><h2>先発ローテ</h2><p>リーグ戦ごとに順番に先発</p></div><div class="panel lineup">${Growth.getRotation().map(View.rotationRow).join('')}</div><p class="note">各枠の「所持投手と交代」で、ローテ外の総合力上位投手と入れ替えます。</p>`;
    } else if (tab === 'list') {
      const chips = [['overall', '総合力'], ['rarity', 'レア度'], ['lv', 'Lv'], ['pos', '守備位置']].map(([k, t]) => `<button class="chip-btn" type="button" data-act="setParam" data-key="sort" data-val="${k}" aria-pressed="${sort === k}">${t}</button>`).join('');
      const cards = Growth.getOwnedCards(sort);
      body = `<div class="sec-h"><h2>所持選手</h2><p>${cards.length}人</p></div><div class="chips" role="group" aria-label="並べ替え">${chips}</div><div class="grid3">${cards.map((c) => View.card(c, { go: true, size: 'is-mini' })).join('')}</div>`;
    } else {
      body = `<div class="sec-h"><h2>スタメン</h2><p>8守備位置＋DH　総合力 ${Growth.teamOverall()}</p></div><div class="panel lineup">${Growth.getLineup().map(View.lineupEditRow).join('')}</div><button class="btn btn-line" type="button" data-act="autoLineup">おまかせ編成</button><p class="note">守備位置ボタンで位置を交代し、「控え野手と交代」でスタメン外の総合力上位選手と入れ替えます。適性外は守備範囲が30%低下します。おまかせ編成は投手ローテも更新します。</p>`;

  };

      ${View.card(c, { size: 'is-big' })}

        ${c.type === 'P' ? `<div class="kv"><span>得意球種</span><b>${c.specialNames.join('・')}</b></div>` : `<div class="kv"><span>守備位置</span><b>${c.posLabel}（${c.posName}）</b></div>`}</div>

        <button class="btn btn-amber two-line" type="button" data-act="scout" data-kind="ten"><span>10連スカウト</span><span class="cost">${View.icon('coin', 'ic-coin sm')} 3,000　10人目は★3以上</span></button>
        <button class="btn btn-line two-line" type="button" data-act="scout" data-kind="guarantee"><span>確定チケットを使う</span><span class="cost">★3以上を1人</span></button>

      <div class="panel tbl-wrap"><table class="tbl"><thead><tr><th class="t-team">レア度</th><th>通常</th><th>確定枠</th></tr></thead><tbody>${[4, 3, 2, 1].map(rateRow).join('')}</tbody></table></div>

    after: (n, p) => { if (AFTER[n]) AFTER[n](p || {}); },

})();

/* ---- 1 画面遷移：ルーター（自前の履歴を正とし、ブラウザの履歴にも写す） ---- */
const Router = (() => {
  let stack = [{ name: 'home', params: {} }];
  let historyOk = true;
  const top = () => stack[stack.length - 1];
  function write(method) {
    try { window.history[method]({ name: top().name }, '', `#${top().name}`); } catch (e) { historyOk = false; }
  }
  function render() {
    const t = top();
    const meta = Screens.meta(t.name);
    GameHud.unbind();
    if (t.name !== 'game' && MatchEngine.isRunning()) MatchEngine.abort();
    document.getElementById('app').classList.toggle('is-immersive', !!meta.immersive);
    Shell.renderTabs(meta.tab || null);
    const view = document.getElementById('view');
    view.innerHTML = Screens.render(t.name, t.params);
    view.scrollTop = 0;
    Screens.after(t.name, t.params);
    Shell.refreshHeader();
  }
  function go(name, params = {}) {
    stack.push({ name: Screens.has(name) ? name : 'home', params });
    write('pushState');
    render();
  }
  function replace(name, params = {}) {
    stack[stack.length - 1] = { name: Screens.has(name) ? name : 'home', params };
    write('replaceState');
    render();
  }
  // 同じ画面のまま表示だけ切り替える（画面内のタブ・並べ替え）。履歴は積まない
  function refresh(patch = {}) { top().params = { ...top().params, ...patch }; render(); }
  // 起動は常にホームから（途中の画面のURLで開いても試合や演出は始めない：NAV-04）
  function start() { stack = [{ name: 'home', params: {} }]; write('replaceState'); render(); }
  function handleBack(fromBrowser) {
    const keep = () => { if (fromBrowser && historyOk) write('pushState'); };
    if (Shell.hasOverlay()) { keep(); return; }                                       // デモ広告中は戻らない
    if (Shell.hasModal()) { Shell.closeModal('back'); keep(); return; }              // モーダルを閉じる
    if (top().name === 'game' && MatchEngine.isRunning()) { Actions.pause(); keep(); return; } // 試合中は一時停止
    if (stack.length <= 1) return;                                                     // ホームではブラウザに任せる
    stack.pop();
    if (top().name === 'game') top().name = 'match';                                   // 終わった試合へは戻らない
    render();
  }
  function back() { if (historyOk && stack.length > 1) window.history.back(); else handleBack(false); }
  return { go, replace, refresh, start, back, current: () => ({ ...top() }), depth: () => stack.length, onPopState: () => handleBack(true) };
})();

/* ---- デバッグ（?debug=1 のときだけ出す。全モジュールの公開関数を呼べるが、内部の状態は触らない） ---- */
const Debug = (() => {
  let enabled = false;
  try { enabled = new URLSearchParams(window.location.search).get('debug') === '1'; } catch (e) { enabled = false; }
  let fpsOn = false;
  let frames = 0;
  let t0 = 0;
  function mount() {
    if (!enabled) return;
    document.getElementById('layer-debug').innerHTML = '<button class="dbg-fab" type="button" data-act="debugOpen">デバッグ</button><div class="fps" id="fps" hidden></div>';
  }
  function loop(t) {
    if (!fpsOn) return;
    frames += 1;
    if (t - t0 >= 1000) { const el = document.getElementById('fps'); if (el) el.textContent = `${Math.round((frames * 1000) / (t - t0))} FPS`; frames = 0; t0 = t; }
    window.requestAnimationFrame(loop);
  }
  function toggleFps() {
    const el = document.getElementById('fps');
    if (!el) return;
    fpsOn = !fpsOn;
    el.hidden = !fpsOn;
    if (fpsOn && window.requestAnimationFrame) { frames = 0; t0 = performance.now(); window.requestAnimationFrame(loop); }
  }
  return { enabled: () => enabled, mount, toggleFps };
})();

/* ---- 試合終了トランザクション（通算記録→ミッション→報酬→育成→保存を固定順で1回） ---- */
const MatchFlow = (() => {
  let last = null;
  Events.on('match:end', (event) => {
    const before = Save.commitCount();
    const result = League.settleMatch(event);
    const missions = Missions.settleMatch(event);
    const rewards = Economy.settleMatch(event);
    const growth = Growth.settleMatch(event);
    const saved = Save.commit('matchEnd');
    last = { result, missions, rewards, growth, saved, commits: Save.commitCount() - before };
    Events.emit('match:settled', { event, ...last });
  });
  return { last: () => (last ? { ...last } : null) };
})();

/* ---- 自己テストの登録（段階ごとに足す。デバッグの「自己テスト」で実行） ---- */
(() => {
  const near = (a, b, eps = 1e-9) => Math.abs(a - b) < eps;
  const t = SelfTest.add;
  const engineConfig = () => {
    const batter = (side, i) => ({ order: i + 1, cardId: `${side}-${i}`, name: `${side === 'user' ? '自軍' : '相手'}${i + 1}`, number: i + 1, pos: ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'][i], abilities: { meet: 50, power: 50, speed: 50, defense: 50 }, mult: { contact: 1, power: 1, speed: 1, defense: 1 } });
    const pitcher = (side) => ({ cardId: `${side}-P`, name: `${side === 'user' ? '自軍' : '相手'}投手`, number: 18, kmh: 142, abilities: { control: 50, stamina: 50, movement: 50 }, mult: { velocity: 1, control: 1, movement: 1 }, staminaThreshold: 25, special: side === 'opponent' ? ['curve'] : ['slider'], fatigued: false });
    return { mode: 'exhibition', innings: 3, seed: 1, userSide: 'away', unlockedPitches: ['fastball'], play: { pitchingForm: 'tornado', battingForm: 'open', myPitch: { direction: 'up', amount: 100 }, motion: { armSwing: 0, release: 0, swingSpeed: 0 } }, correction: { enabled: false }, teams: { user: { name: '自軍', lineup: Array.from({ length: 9 }, (_, i) => batter('user', i)), pitcher: pitcher('user') }, opponent: { name: '相手', lineup: Array.from({ length: 9 }, (_, i) => batter('opponent', i)), pitcher: pitcher('opponent') } } };
  };
  t('CARD-01 ランクの境界', () => {
    const bad = [[99, 'S'], [90, 'S'], [89, 'A'], [80, 'A'], [79, 'B'], [70, 'B'], [69, 'C'], [60, 'C'], [59, 'D'], [50, 'D'], [49, 'E'], [40, 'E'], [39, 'F'], [20, 'F'], [19, 'G'], [1, 'G']].filter(([v, r]) => Growth.rankOf(v) !== r);
    return bad.length ? `${bad.map(([v]) => v).join('・')} のランクが違う` : true;
  });
  t('A-5 補正倍率（k=0.30）', () => (near(Correction.multiplier(50), 1) && near(Correction.multiplier(100), 1.3) && near(Correction.multiplier(0), 0.7)) || `50→${Correction.multiplier(50)} 100→${Correction.multiplier(100)}`);
  t('A-5 球速の換算', () => (near(Correction.kmhScore(120), 0) && near(Correction.kmhScore(165), 100) && near(Correction.kmhScore(142.5), 50)) || 'km/h から0〜100への換算が違う');
  t('CARD-02 Lvと能力値', () => {
    const a1 = Growth.abilityAt('S01', 1);
    const a10 = Growth.abilityAt('S01', 10);
    const a20 = Growth.abilityAt('S01', 20);
    return (a1.meet === 43 && a10.meet === 47 && a20.meet === 53 && a20.defense === 60) || `ミート Lv1=${a1.meet} Lv10=${a10.meet} Lv20=${a20.meet}`;
  });
  t('CARD-03 必要経験値', () => {

/* ---- 1 画面遷移：起動と組み立て ---- */
const App = (() => {
  function onClick(ev) {
    const el = ev.target.closest('[data-go],[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.go) { Router.go(el.dataset.go, el.dataset.id ? { id: el.dataset.id } : {}); return; }
    const fn = Actions[el.dataset.act];
    if (fn) fn(el, ev);
  }
  function onInput(ev) {
    const out = ev.target.dataset && ev.target.dataset.out;
    if (out) { const o = document.getElementById(out); if (o) o.textContent = ev.target.value; }
  }
  function boot() {
    Save.load();                              // 開発用v2本体、破損時はバックアップから復旧
    Economy.syncCareer(League.getCareer());   // 経済（ミッション）へ通算記録を渡す
    Shell.mount();
    Events.on('wallet:changed', () => Shell.refreshHeader());
    Events.on('premium:changed', () => Shell.refreshHeader());
    // 試合が終わったら結果へ（試合の画面は履歴から外す）
    Events.on('match:settled', () => { setTimeout(() => { if (Router.current().name === 'game') Router.replace('result'); }, 0); });
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    window.addEventListener('popstate', Router.onPopState);
    Router.start();
    Debug.mount();
  }
  return { boot };
})();

App.boot();
