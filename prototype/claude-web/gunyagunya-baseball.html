<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1060">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ぐにゃぐにゃベースボール</title>
<style>
:root{
  --ink:#2a1457; --ink2:#1b0c3d;
  --v1:#7b3dff; --v2:#3a1fa8; --v3:#1f1068;
  --pink:#ff4fa3; --gold:#ffd23f; --cyan:#42e6ff; --green:#46e38c; --red:#ff4658;
  --ui:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0522;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}
body{font-family:var(--ui);font-weight:800;color:#fff;letter-spacing:.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
svg{display:block}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#1a0c4d;visibility:hidden}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.abs{position:absolute}
.grow{flex:1}

/* ---------- text helpers ---------- */
.ol{-webkit-text-stroke:var(--sw,8px) var(--oc,var(--ink));paint-order:stroke fill;text-shadow:0 .07em 0 var(--oc,var(--ink))}
.ol4{--sw:6px}.ol6{--sw:10px}.ol8{--sw:14px}
.gold-t{color:#fff3a0}
.dim{color:#cbbcff}

/* ---------- buttons (face + outlined lip, pressed = sinks onto lip) ---------- */
.btn{--b1:#a47bff;--b2:#6a35f0;--b3:#3b1aa8;position:relative;top:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:68px;padding:0 30px;border-radius:22px;font-size:30px;font-weight:900;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 100%);border:4px solid var(--ink);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--b3),0 10px 0 var(--ink),0 18px 20px rgba(8,0,40,.42);
  text-shadow:0 2px 0 rgba(0,0,0,.3),-2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink),0 3px 0 var(--ink);
  transition:top .07s ease-out,box-shadow .07s ease-out,filter .15s}
.btn::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:42%;border-radius:15px 15px 34px 34px/15px 15px 20px 20px;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.05));pointer-events:none;z-index:0}
.btn:active,.btn.press{top:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 0 0 var(--b3),0 4px 0 var(--ink),0 6px 10px rgba(8,0,40,.4)}
.btn[disabled]{filter:grayscale(.85) brightness(.8);pointer-events:none}
.btn.pink{--b1:#ff8cc8;--b2:#ff2f8f;--b3:#a80f57}
.btn.gold{--b1:#fff07a;--b2:#ffa51f;--b3:#b45f00}
.btn.cyan{--b1:#7ff2ff;--b2:#1aa6e8;--b3:#0b5f9c}
.btn.green{--b1:#8cf5b6;--b2:#1fc46a;--b3:#0b7a3e}
.btn.violet{--b1:#9a78ff;--b2:#5a2fe0;--b3:#2f1494}
.btn.dark{--b1:#4b3a9a;--b2:#2a1a6e;--b3:#150b3d}
.btn.sm{height:50px;font-size:22px;padding:0 22px;border-radius:17px}
.btn.xl{height:96px;font-size:46px;padding:0 70px;border-radius:30px}
.btn.round{width:60px;height:60px;padding:0;border-radius:50%}
.btn.round::before{border-radius:50%;left:10px;right:10px;height:40%}
.btn .sh{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.btn .sh::before{content:"";position:absolute;top:-20%;bottom:-20%;width:34%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{left:-60%}38%,100%{left:150%}}
.pulse{display:inline-block;animation:pulse 1.15s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.sub{display:block;font-size:.5em;font-weight:800;opacity:.95}

/* ---------- character wrapper ---------- */
.chw{position:relative;width:100%;height:100%}
.chw svg{width:100%;height:100%;overflow:visible}
.chr .m,.chr .m2{display:none}
.chr[data-f=smile] .m-smile,.chr[data-f=open] .m-open,.chr[data-f=o] .m-o,.chr[data-f=sad] .m-sad,.chr[data-f=mad] .m-mad{display:inline}
.chr .br{transform-box:fill-box;transform-origin:center}
.chr[data-f=mad] .brL{transform:rotate(16deg) translateY(3px)}
.chr[data-f=mad] .brR{transform:rotate(-16deg) translateY(3px)}
.chr[data-f=sad] .brL{transform:rotate(-14deg) translateY(2px)}
.chr[data-f=sad] .brR{transform:rotate(14deg) translateY(2px)}
.chr[data-f=open] .br,.chr[data-f=o] .br{transform:translateY(-5px)}
.chr .eye{transform-box:fill-box;transform-origin:center}
.chr.blink .eye{transform:scaleY(.08)}
.chr.rb{animation:hue 3.2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.halo{animation:halo 1.8s ease-in-out infinite}
@keyframes halo{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- currency / header ---------- */
.hdr{position:absolute;left:0;right:0;top:0;height:96px;padding:16px 26px 0;display:flex;align-items:flex-start;gap:16px;z-index:6;
  background:linear-gradient(180deg,rgba(16,6,60,.88),rgba(16,6,60,0))}
.pbadge{position:relative;display:flex;align-items:center;gap:12px;height:64px;padding-right:22px}
.pc{width:100%;height:100%}
.pav{position:relative;width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 40% 30%,#ffe9ff,#ff9ad6 60%,#c24bff);overflow:hidden;
  box-shadow:0 0 0 3px var(--gold),0 4px 0 3px var(--ink)}
.pav .chw{position:absolute;left:-18px;top:-10px;width:100px;height:125px}
.pinfo{display:flex;flex-direction:column;gap:4px}
.plv{font-size:24px;line-height:1;--sw:7px}
.plv small{font-size:.62em;color:var(--gold)}
.pbar{width:150px;height:14px;border-radius:7px;background:#190a4c;border:3px solid var(--ink);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(180deg,#8cf5b6,#1fc46a);border-radius:5px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.cur{position:relative;height:48px;min-width:176px;padding:0 10px 0 56px;border-radius:24px;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:26px;
  background:linear-gradient(180deg,#34197f,#170a4a);border:4px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 4px 0 rgba(10,0,40,.5)}
.cur .ic{position:absolute;left:-8px;top:-8px;width:58px;height:58px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.cur b{font-weight:900;font-variant-numeric:tabular-nums;--sw:6px}
.cur .plus{width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#8cf5b6,#1fc46a);border:3px solid var(--ink);font-size:26px;line-height:26px;font-weight:900;
  box-shadow:0 3px 0 #0b7a3e;transition:transform .07s}
.cur .plus:active{transform:translateY(3px);box-shadow:0 0 0 #0b7a3e}
.hdr .btn.round{width:52px;height:52px}

/* ---------- tab bar ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:8;display:none;align-items:flex-end;justify-content:center;gap:10px;padding:0 120px 0;
  background:linear-gradient(180deg,#3e20a8 0%,#1f0f66 100%);border-top:5px solid var(--ink);box-shadow:0 -10px 0 rgba(10,0,40,.18)}
#tabbar.on{display:flex}
#tabbar::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--pink),var(--gold),var(--cyan),var(--pink));opacity:.9}
.tab{position:relative;flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;color:#a995ff;padding-top:6px}
.tab svg{width:46px;height:46px;transition:transform .15s}
.tab.on{color:#fff}
.tab.on svg{transform:translateY(-4px) scale(1.12);filter:drop-shadow(0 0 10px rgba(255,210,63,.8))}
.tab.on::after{content:"";position:absolute;left:22%;right:22%;bottom:8px;height:6px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tab:active svg{transform:scale(.9)}
.tab.big{flex:none;width:200px;height:142px;margin-bottom:-4px;color:#fff;justify-content:flex-end;padding-bottom:12px}
.tab.big .bub{position:absolute;left:50%;top:0;width:128px;height:128px;margin-left:-64px;border-radius:50%;
  background:radial-gradient(circle at 38% 28%,#ffc6e6,#ff4fa3 45%,#b3125f);border:5px solid var(--ink);box-shadow:0 8px 0 #5d0b34,0 0 28px rgba(255,79,163,.7),inset 0 -8px 0 rgba(0,0,0,.15)}
.tab.big svg{position:relative;width:78px;height:78px;margin-top:-6px}
.tab.big span{position:relative;z-index:1;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.tab.big.on::after{display:none}
.tab.big:active .bub{transform:translateY(5px)}
.tab .dot{position:absolute;right:30px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid var(--ink);font-size:16px;line-height:20px;text-align:center}
.tab.big .dot{right:30px;top:2px;z-index:2}

/* ---------- title ---------- */
#s-title{background:linear-gradient(180deg,#1b0c66 0%,#5b24d6 46%,#ff5fb0 82%,#ffb36b 100%)}
.rays{position:absolute;left:50%;top:44%;width:1900px;height:1900px;margin:-950px 0 0 -950px;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0deg 7deg,rgba(255,255,255,0) 7deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tsvg{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;left:0;right:0;top:34px;text-align:center;isolation:isolate}
.logo-l1{display:flex;justify-content:center;gap:2px;height:178px}
.lg{position:relative;display:inline-block;font-size:172px;line-height:1.02;font-weight:900;color:transparent;isolation:isolate;
  background:linear-gradient(180deg,#fffbc2 0%,#ffe45a 30%,#ffa81f 62%,#ff5a3c 100%);-webkit-background-clip:text;background-clip:text;
  animation:drop .75s cubic-bezier(.2,1.7,.45,1) both,wob 1.9s ease-in-out infinite;
  animation-delay:calc(var(--i)*.09s),calc(1s + var(--i)*-.31s)}
.lg::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:var(--ink);-webkit-text-stroke:26px var(--ink);text-shadow:0 14px 0 var(--ink),0 22px 24px rgba(10,0,50,.5)}
.lg::after{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#fff;-webkit-text-stroke:15px #fff}
.lg2{position:relative;display:inline-block;margin-top:-6px;font-size:84px;font-weight:900;line-height:1.1;color:#fff;letter-spacing:.08em;
  transform:rotate(-2deg);animation:drop2 .8s .75s cubic-bezier(.2,1.6,.4,1) both}
.lg2 span{position:relative;display:inline-block;padding:0 40px;border-radius:14px;
  background:linear-gradient(180deg,#ff7ac0,#ff2f8f);border:5px solid var(--ink);box-shadow:0 8px 0 var(--ink),0 18px 22px rgba(10,0,50,.4);
  text-shadow:0 5px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink)}
@keyframes drop{0%{transform:translateY(-520px) rotate(-30deg) scale(1.2);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes drop2{0%{transform:translateY(-400px) rotate(8deg) scale(.6);opacity:0}100%{transform:rotate(-2deg);opacity:1}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-3deg) scale(1,1)}22%{transform:translateY(-14px) rotate(2.5deg) scale(.95,1.07)}48%{transform:translateY(2px) rotate(-1.5deg) scale(1.07,.93)}74%{transform:translateY(-6px) rotate(4deg) scale(1,1)}}
.tstart{position:absolute;left:0;right:0;bottom:66px;text-align:center;z-index:3;animation:rise .6s 1.4s both}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.tap{margin-top:34px;font-size:22px;letter-spacing:.3em;color:#fff;opacity:.9;animation:blinkt 1.4s ease-in-out infinite;--sw:6px}
@keyframes blinkt{0%,100%{opacity:.35}50%{opacity:1}}
.ver{position:absolute;right:20px;bottom:14px;font-size:15px;color:#e6d9ff;opacity:.8}
.tch{position:absolute;bottom:20px;z-index:2}
.fl{position:absolute;bottom:-60px;opacity:.0;animation:floaty linear infinite}
@keyframes floaty{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.7}100%{transform:translateY(-820px) rotate(360deg);opacity:0}}

/* ---------- home ---------- */
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.hrays{position:absolute;left:50%;top:48%;width:1500px;height:1500px;margin:-750px 0 0 -750px;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.12) 0deg 6deg,rgba(255,255,255,0) 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%);mask-image:radial-gradient(circle,#000 10%,transparent 60%);animation:spin 90s linear infinite}
.bandrow{position:absolute;left:18px;right:18px;top:100px;height:88px;display:flex;gap:14px;z-index:4}
.ban{position:relative;flex:1;height:88px;border-radius:20px;border:4px solid var(--ink);overflow:hidden;display:flex;align-items:center;padding:0 16px 0 112px;
  box-shadow:0 6px 0 var(--ink),0 12px 18px rgba(10,0,50,.35);transition:transform .07s;text-align:left}
.ban:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.ban::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%);pointer-events:none}
.ban .bt{position:relative;display:flex;flex-direction:column;gap:2px;line-height:1.1;z-index:1}
.ban .bt b{font-size:26px;font-weight:900;--sw:8px}
.ban .bt small{font-size:17px;font-weight:800;color:#fff}
.ban .tag{position:absolute;left:8px;top:6px;z-index:2;padding:2px 10px;border-radius:10px;background:var(--red);border:3px solid var(--ink);font-size:14px;transform:rotate(-6deg)}
.ban .bart{position:absolute;left:4px;top:0;width:104px;height:88px;z-index:1}
.ban .bart .pc{position:absolute;left:0;top:2px;width:104px;height:130px}
.ban.b1{background:linear-gradient(100deg,#ff8a3d,#ff3f95 70%,#c13bff)}
.ban.b2{background:linear-gradient(100deg,#1fd0ff,#2d7bff 70%,#6a3bff)}
.ban.b3{background:linear-gradient(100deg,#37d98a,#16a88f 70%,#1e7fc4)}
.ban .sh{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ban .sh::before{content:"";position:absolute;top:-20%;bottom:-20%;width:26%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.2s ease-in-out infinite}
.tools{position:absolute;left:22px;top:214px;display:flex;flex-direction:column;gap:20px;z-index:4}
.tool{position:relative;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;--sw:6px}
.tool .tb{position:relative;width:78px;height:78px;border-radius:24px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#9d7cff,#5a2fe0);box-shadow:0 6px 0 #2f1494,0 6px 0 3px var(--ink),0 12px 14px rgba(10,0,50,.3);transition:transform .07s}
.tool:active .tb{transform:translateY(5px);box-shadow:0 1px 0 #2f1494,0 1px 0 3px var(--ink)}
.tool .tb svg{width:44px;height:44px}
.tool .dot{position:absolute;right:-6px;top:-8px;width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid var(--ink);font-size:15px;line-height:20px;text-align:center;z-index:2}
.hchar{position:absolute;left:470px;top:196px;width:340px;height:425px;z-index:3;cursor:pointer}
.ped{position:absolute;left:380px;top:560px;width:520px;height:90px;z-index:2}
.ped i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,244,170,.9),rgba(255,120,200,.5) 45%,rgba(255,120,200,0) 70%)}
.ped b{position:absolute;left:50px;right:50px;top:14px;bottom:8px;border-radius:50%;border:5px dashed rgba(255,255,255,.75);animation:spin 18s linear infinite}
.ped u{position:absolute;left:100px;right:100px;top:26px;bottom:20px;border-radius:50%;background:linear-gradient(180deg,#ffe98a,#ff9a3d);border:4px solid var(--ink);box-shadow:0 8px 0 #a64d00,0 8px 0 4px var(--ink)}
.bubble{position:absolute;left:404px;top:138px;max-width:260px;padding:10px 18px;border-radius:20px;background:#fff;color:var(--ink);font-size:20px;border:4px solid var(--ink);z-index:5;
  box-shadow:0 5px 0 var(--ink);transform-origin:80% 100%;animation:bpop .35s cubic-bezier(.2,1.8,.4,1) both;pointer-events:none}
.bubble::after{content:"";position:absolute;left:60px;bottom:-16px;width:22px;height:22px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
@keyframes bpop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.nameplate{position:absolute;left:470px;width:340px;top:604px;text-align:center;font-size:22px;z-index:4;pointer-events:none}
.power{position:absolute;right:26px;top:276px;width:340px;height:82px;border-radius:22px;border:4px solid var(--ink);z-index:4;padding:8px 18px;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(180deg,rgba(60,28,150,.95),rgba(26,12,86,.95));box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 6px 0 var(--ink)}
.power small{font-size:17px;color:#cbbcff}
.power b{font-size:36px;line-height:1;color:var(--gold);--sw:8px;font-variant-numeric:tabular-nums}
.power .pcl{position:absolute;right:16px;top:10px;font-size:16px;text-align:right;color:#fff}
.vs{position:absolute;right:26px;top:374px;width:340px;text-align:center;font-size:19px;z-index:4;--sw:6px}
.matchbtn{position:absolute;right:26px;top:428px;z-index:4}
.matchbtn .btn{width:340px;height:156px;border-radius:38px;font-size:68px;flex-direction:column;gap:0;line-height:1;letter-spacing:.2em;padding-left:.2em}
.matchbtn .btn small{font-size:20px;letter-spacing:.1em;margin-top:6px}
.matchbtn .btn::before{height:36%}
.matchbtn .halo2{position:absolute;inset:-26px;border-radius:60px;background:radial-gradient(closest-side,rgba(255,225,90,.95),rgba(255,160,40,0));filter:blur(10px);animation:glow 1.2s ease-in-out infinite;z-index:-1}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.08)}}
.ticker{position:absolute;left:22px;bottom:122px;width:380px;height:40px;border-radius:20px;overflow:hidden;background:rgba(20,8,70,.8);border:3px solid var(--ink);z-index:4;font-size:17px;line-height:34px}
.ticker div{position:absolute;white-space:nowrap;animation:tick 16s linear infinite;color:#ffe9a0}
@keyframes tick{from{transform:translateX(380px)}to{transform:translateX(-100%)}}

/* ---------- gacha ---------- */
.gtitle{position:absolute;left:34px;top:104px;z-index:4;transform:rotate(-3deg)}
.gtitle h2{font-size:64px;line-height:1;font-weight:900;color:#fff;--sw:18px}
.gtitle small{display:inline-block;margin-top:10px;padding:2px 18px;border-radius:14px;background:linear-gradient(180deg,#ff7ac0,#ff2f8f);border:4px solid var(--ink);font-size:20px;box-shadow:0 4px 0 var(--ink)}
.spot{position:absolute;left:30px;top:96px;width:690px;height:520px;overflow:hidden}
.spot .cone{position:absolute;left:50%;top:-20px;width:560px;height:620px;margin-left:-280px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 90%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:.7}
.spot .gch{position:absolute;left:50%;top:62px;width:336px;height:420px;margin-left:-168px;transition:opacity .4s,transform .4s}
.spot .gch.out{opacity:0;transform:translateX(-60px) scale(.9)}
.spot .gch.in{animation:chin .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes chin{from{opacity:0;transform:translateX(70px) scale(.9)}to{opacity:1;transform:none}}
.spot .gped{position:absolute;left:50%;top:456px;width:420px;height:62px;margin-left:-210px}

const COST1=150,COST10=1500,PITY=50;
function rollRarity(){const x=Math.floor(Math.random()*10000);   // 0.01% resolution
  if(x<1)return 6; if(x<101)return 5; if(x<401)return 4; if(x<1601)return 3; if(x<5101)return 2; return 1}
function pullOne(){
  let r=rollRarity();
  if(S.pity>=PITY-1&&r<4)r=4;               // 50連目: ★4以上 確定
  S.pity=r>=4?0:S.pity+1;
  const def=pick(ROSTER.filter(c=>c.r===r));
  const had=S.owned[def.id]||0;S.owned[def.id]=had+1;S.pulls++;
  return{def,r,isNew:had===0,count:had+1};
}
const pityLeft=()=>PITY-S.pity;
function addExp(n){S.exp+=n;let need=100+S.lv*50;while(S.exp>=need){S.exp-=need;S.lv++;need=100+S.lv*50}}

const fxc=$('#fx'),fxx=fxc.getContext('2d');const P=[];let fxDirty=false;

function confetti(n,o={}){const{x=640,y=360,spread=TAU,angle=-Math.PI/2,power=1000,rain=false,cols=CONF}=o;
  for(let i=0;i<n;i++){const a=rain?Math.PI/2+rand(-.25,.25):angle+rand(-spread/2,spread/2),sp=rain?rand(160,380):rand(.2,1)*power;
    P.push({k:'c',x:rain?rand(0,1280):x,y:rain?rand(-80,-10):y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:rand(0,TAU),vr:rand(-9,9),w:rand(10,18),h:rand(6,11),col:pick(cols),life:rand(2.6,4.2),age:0,ph:rand(0,TAU)})}}
function sparks(n,o={}){const{x=640,y=360,power=500,col='#fff',cols=null,size=14,grav=300,life=.9,star=true,spread=TAU,angle=0}=o;
  for(let i=0;i<n;i++){const a=angle+rand(-spread/2,spread/2),sp=rand(.2,1)*power;P.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:grav,size:rand(size*.5,size),col:cols?pick(cols):col,life:rand(life*.6,life),age:0,star,rot:rand(0,TAU),vr:rand(-5,5)})}}
function ring(x,y,col,o={}){P.push({k:'r',x,y,r:o.r0||10,vr:o.vr||1100,col,life:o.life||.65,age:0,lw:o.lw||12})}
function bolt(x1,y1,x2,y2,col='#d9a6ff'){const pts=[[x1,y1]],n=9;for(let i=1;i<n;i++){const t=i/n;pts.push([lerp(x1,x2,t)+rand(-46,46),lerp(y1,y2,t)+rand(-12,12)])}pts.push([x2,y2]);P.push({k:'b',pts,col,life:.32,age:0})}
function firework(x,y,cols){const c=cols||CONF;const col=pick(c);for(let i=0;i<54;i++){const a=i/54*TAU+rand(-.05,.05),sp=rand(180,430);P.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:240,size:rand(5,9),col:cols?pick(cols):col,life:rand(.9,1.5),age:0,star:false,drag:1.4,rot:0,vr:0})}

function fxStep(dt){

  fxDirty=true;fxx.clearRect(0,0,1280,720);

}

async function playReveal(results,opts={}){

  RV.results=results;RV.n=results.length;RV.preview=!!opts.preview;

    A(ball,[{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'});

    if(R===6&&i===5){ball.classList.remove('dark');ball.classList.add('rainbow');SFX.glitch()}
    await W(R>=4?(i===R-1?680:480):(R>=2?420:640));if(!alive())return}
  /* 3) crack */
  ball.classList.remove('shake','s2','s3');SFX.crack();vib(20);const ck=rq('.crack');ck.style.opacity=1;$$('.crack path',rv).forEach((p,i)=>A(p,[{strokeDashoffset:520},{strokeDashoffset:0}],{duration:240,delay:i*60}));

  flash.style.background=R===6?'#fff':lighten(C,.7);A(flash,[{opacity:0},{opacity:1,offset:.1},{opacity:R>=5?.0:0}],{duration:R>=5?900:420});
  ring(640,360,C,{vr:1700,life:.8,lw:26});ring(640,360,'#fff',{vr:1000,life:.6,lw:10});
  sparks(R>=4?70:34,{x:640,y:360,power:1000,cols:R===6?RBC:[C,'#fff'],size:22,life:1.2});
  glow.style.setProperty('--gc',C);A(glow,[{opacity:0,transform:'scale(.2)'},{opacity:.85,transform:'scale(1)'}],{duration:520,easing:'ease-out'});
  rays.style.setProperty('--rc',rgba(C,R>=4?.55:.3));rays.classList.add('on');A(rays,[{opacity:0},{opacity:R>=4?.7:.35}],{duration:600});
  if(R===6){rays.style.background='repeating-conic-gradient(from 0deg,#ff5f6d 0 6deg,#ffd23f 6deg 12deg,#5fff8a 12deg 18deg,#42e6ff 18deg 24deg,#b55fff 24deg 30deg,#ff5fd2 30deg 36deg)';rays.style.animation='spin 16s linear infinite,hue 2.4s linear infinite';bg.style.background='radial-gradient(ellipse at 50% 55%,#6a1f9a 0%,#1d0a4a 60%,#07021c 100%)'}
  /* 5) rarity specific show */
  if(R===1){await W(520)}
  else if(R===2){confetti(40,{x:640,y:360,power:900,cols:['#5fe08a','#b9ffd1','#fff']});ring(640,360,'#9affbd',{vr:900,life:.9,lw:16});await W(750)}
  else if(R===3){A(beam,[{opacity:0,transform:'scaleX(.1)'},{opacity:.95,transform:'scaleX(1)',offset:.3},{opacity:0,transform:'scaleX(1.4)'}],{duration:1000});confetti(80,{x:640,y:360,power:1100,cols:['#4aa8ff','#8ccaff','#fff','#ffd23f']});sparks(26,{x:640,y:360,power:700,cols:['#8ccaff','#fff'],size:18});
    await cutin(3,best);if(!alive())return;await W(300)}
  else if(R===4){shake(rv,16,600);for(let k=0;k<4;k++)setTimeout(()=>{if(!alive())return;bolt(rand(300,980),-10,640+rand(-70,70),360,'#c37bff');SFX.bolt();flash.style.background='#e6c8ff';A(flash,[{opacity:.6},{opacity:0}],{duration:220})},k*230);
    confetti(150,{x:640,y:360,power:1300,cols:['#c37bff','#ff4fa3','#ffd23f','#fff','#42e6ff']});await W(300);if(!alive())return;await cutin(4,best);if(!alive())return;await W(200)}
  else if(R===5){shake(rv,22,900);setTimeout(()=>{if(!alive())return;A(flash,[{opacity:1},{opacity:0}],{duration:500});SFX.burst()},520);
    for(let k=0;k<9;k++)setTimeout(()=>{if(!alive())return;firework(rand(160,1120),rand(70,330),['#ffd23f','#fff3a0','#ffa51f','#fff']);SFX.bolt()},400+k*260);
    confetti(200,{x:640,y:360,power:1500,cols:['#ffd23f','#fff3a0','#ffa51f','#fff','#ff4fa3']});confetti(120,{rain:true,cols:['#ffd23f','#fff3a0','#ffa51f']});

    M.pitcher.setPose('cheer');await sleepRaw(kind==='miss'?750:300);if(!al())return;ball.style.display='none';$('#mBs').style.display='none';await sleepRaw(500)}
  if(!al())return;
  if(add){M.score+=add;setScore()}
  M.batter.setPose('ready');M.resolve&&M.resolve();
}
async function matchEnd(tk){
  M.state='over';const win=M.score>=M.target;S.plays++;const margin=Math.max(0,M.score-M.target);
  const gems=win?250+margin*40:30,coins=win?400+M.score*40:100+M.score*20,exp=win?60:20;if(win)S.wins++;S.gems+=gems;S.coins+=coins;addExp(exp);save();
  popText(win?'WIN!':'LOSE',win?'hr':'bad',`${M.score} - ${M.target}`);if(win){SFX.win();SFX.cheer(2);confetti(160,{rain:true});confetti(80,{x:640,y:300,power:1200,spread:Math.PI*1.2,angle:-Math.PI/2});M.batter.setPose('cheer');M.pitcher.setPose('sad')}else{SFX.lose();M.batter.setPose('sad');M.pitcher.setPose('cheer')}
  await sleepRaw(1900);if(!mAlive(tk))return;
  modal({title:win?'しょうり!':'ざんねん…',html:`<div class="ol ol4" style="font-size:44px">${M.score} - ${M.target}点</div><div class="reward"><div>${IC.gem}<b class="ol">+${gems}</b></div><div>${IC.coin}<b class="ol">+${coins}</b></div></div><p style="margin-top:12px;font-size:22px;color:#cbbcff">${win?'ガチャで あたらしい選手を むかえよう!':'ミート補正の高い選手ほど タイミングが ゆるくなるよ'}</p>`,
    buttons:[{t:'ホームへ',c:'violet',fn:()=>go('home')},{t:'もう一度',c:'gold',shine:1,fn:()=>go('match')}]});
  M.on=false;SFX.coin();
}

/* =====================================================================
   input / main loop / boot
   ===================================================================== */
function toStage(cx,cy){const W=innerWidth,H=innerHeight,portrait=H>W&&matchMedia('(pointer:coarse)').matches;let x=cx-W/2,y=cy-H/2;if(portrait){const nx=y,ny=-x;x=nx;y=ny}return[x/SCALE+640,y/SCALE+360]}
stage.addEventListener('pointerdown',e=>{AU.init();if(cur!=='match'&&!e.target.closest('#reveal')){const[x,y]=toStage(e.clientX,e.clientY);sparks(5,{x,y,power:260,cols:['#fff','#ffe36a','#ff8cc8'],size:11,life:.5,grav:120})}},{passive:true});
stage.addEventListener('click',e=>{
  const mb=e.target.closest('[data-mb]');
  if(mb){const m=$('#modal'),b=m._b&&m._b[+mb.dataset.mb];closeModal();SFX.tap();if(b&&b.fn)b.fn();return}
  const t=e.target.closest('[data-act]');if(!t)return;AU.init();
  switch(t.dataset.act){
    case'start':SFX.ok();go('home');break;
    case'tab':if(cur===t.dataset.to)return;SFX.tap();go(t.dataset.to);break;
    case'back':SFX.back();go('home');break;
    case'match':SFX.ok();go('match');break;
    case'pull':SFX.ok();doPull(+t.dataset.n);break;
    case'rates':SFX.tap();openRates();break;
    case'preview':closeModal();SFX.ok();previewRarity(+t.dataset.r);break;
    case'freegems':SFX.tap();openFreeGems();break;
    case'settings':SFX.tap();openSettings();break;
    case'toast':SFX.back();toast(t.dataset.msg);break;
    case'char':SFX.tap();charDetail(t.dataset.id);break;
    case'hpoke':{const pc=$('.hchar .pc');if(pc&&pc._g){const r=t.getBoundingClientRect();pc._g.poke((e.clientX-(r.left+r.width/2))/r.width*2);
        const d=mainDef(),b=$('#bubble');if(b){b.textContent=pick([...HOME_LINES,d.line,d.line]);b.style.animation='none';void b.offsetWidth;b.style.animation=''}}break}
    case'rv-skip':SFX.tap();finishNow();break;
    case'rv-close':SFX.back();closeReveal();break;
    case'rv-again':SFX.ok();if(RV.preview)playReveal(RV.results,{preview:true});else doPull(RV.n);break;
    case'mexit':SFX.back();modal({title:'試合をやめる?',html:'ここでやめると ほうしゅうは もらえません。',buttons:[{t:'つづける',c:'violet'},{t:'やめる',c:'pink',fn:()=>go('home')}]});break;
  }
});
addEventListener('keydown',e=>{if(e.code==='Space'&&cur==='match'){e.preventDefault();onSwing()}});
document.addEventListener('contextmenu',e=>e.preventDefault());

let last=performance.now(),tsec=0,evAcc=0;
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;tsec+=dt;FR++;
  const gdt=(M.on&&now<M.freezeUntil)?0:dt;
  for(const g of LIVE)g.update(gdt,tsec);
  matchUpdate(dt,now);fxStep(dt);
  evAcc+=dt;if(evAcc>=1){evAcc=0;const el=$('#evT');if(el)el.textContent=evText()}
  requestAnimationFrame(loop);
}
fit();showScreen('title');requestAnimationFrame(loop);
window.__GB={get S(){return S},go,playReveal,previewRarity,doPull,SCREENS,M,RV,openRates,charDetail,confetti,firework,rollRarity,pullOne,pityLeft};
})();
