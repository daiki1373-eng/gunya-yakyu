<div class="tx" style="margin-top:12px">${G.heroOut?'主人公はケガで欠場…':`主人公：${d('ab')}打数${d('h')}安打 本塁打${d('hr')} 打点${d('rbi')} 盗塁${d('sb')}${h.pos===1?`　投球${Math.floor(d('outs')/3)}回 奪三振${d('k')} 失点${d('ra')}`:''}`}<br>${note}</div>
<button class="mb go" style="width:300px;margin:16px auto" onclick="afterResult(${r.win})">つぎへ</button></div>`)}
let LASTR=null;
async function afterResult(win){uiOff();if(win){await kouka();if(S.round>=5){champion();return}S.round++;S.slots=2;MSG=`勝利！ 次は ${RL[S.round]}。練習で備えよう`;save();hub()}else endYear(false,S.round)}
async function kouka(){const sc=SCH();V.mode='kouka';V.k={c:sc.c,c2:sc.c2};hudOff();const s=sc.s,L=[`${s}の空 高く`,'白き雲 わたる 校庭に','夢ひろげ 駆ける 若き日よ',`ああ ${s} ${s} 栄えあれ`];let skip=false;window.skipK=()=>{skip=true};
ui(`<div id="lyr"></div><button class="mb" style="position:absolute;right:14px;top:14px;width:120px" onclick="skipK()">スキップ</button><div style="position:absolute;left:0;right:0;top:40px;text-align:center;font-size:38px;font-weight:900;color:#ffe14a;text-shadow:3px 3px 0 #000">${sc.n}　校歌斉唱</div>`);
sndFan();await sleep(900);const mg=playMel();for(let i=0;i<4&&!skip;i++){$('#lyr').textContent=L[i];for(let t=0;t<36&&!skip;t++)await sleep(100)}if(mg){try{mg.gain.value=0}catch(e){}}uiOff();V.mode='yard'}
function champion(){S.titles++;V.mode='kouka';V.k={c:SCH().c,c2:SCH().c2};sndFan();sndCheer();ui(`<div class="ttl"><div class="logo" style="font-size:72px">全国制覇！！</div><div class="sub">${S.hero.name}と${SCH().n}、甲子園の頂点へ！</div><div class="mn"><button class="mb go" onclick="endYear(true,5)">つぎへ</button></div></div>`)}
function endYear(champ,lr){const h=S.hero,label=champ?'全国制覇！':(lr>=3?`甲子園 ${RL[lr].replace('甲子園 ','')}敗退`:`${RL[lr]}敗退`);
h.yrs.push(`${S.grade}年:${label}`);h.best=Math.max(h.best,champ?7:lr+1);if(champ||lr>=3)S.koshien++;save();V.mode='yard';hudOff();
ui(`<div class="pn" style="left:140px;top:100px;width:680px;height:300px"><h2>${S.grade}年生の夏が終わった</h2><div style="font-size:30px;margin:14px 0;text-align:center;color:#ffe14a">${label}</div><div class="tx">${h.yrs.join('<br>')}</div><button class="mb go" style="width:260px;margin:14px auto" onclick="afterYear()">${S.grade>=3?'卒業へ':'新学年へ'}</button></div>`)}
function afterYear(){const h=S.hero;
if(S.grade>=3){S.hist.push({name:h.name,gen:S.gen,pos:h.pos,school:SCH().s,yrs:h.yrs.slice(),rec:Object.assign({},h.rec),best:h.best});save();
ui(`<div class="pn" style="left:140px;top:80px;width:680px;height:340px"><h2>卒業</h2><div class="tx" style="font-size:17px">${h.name}は${SCH().n}を卒業した。<br>${h.yrs.join('<br>')}<br><br>記録は「記録」に残ります。次の世代へ！</div><button class="mb go" style="width:300px;margin:14px auto" onclick="newGame(1)">新しい主人公をつくる</button></div>`)}
else{S.grade++;STN.forEach(([k])=>{h[k]=Math.min(99,h[k]+ri(1,3))});h.fat=Math.max(0,h.fat-30);h.inj=0;S.tS+=3;S.ph='spring';S.slots=4;S.round=0;S.res=[];MSG=`${S.grade}年生になった！ 能力が少し成長した`;save();hub()}}
function records(){const h=S.hero,f=r=>`${r.g}試合 / 打数${r.ab} 安打${r.h} 本塁打${r.hr} 打点${r.rbi} 盗塁${r.sb} / 投球回${Math.floor(r.outs/3)}${['','⅓','⅔'][r.outs%3]} 奪三振${r.k} 失点${r.ra} 勝${r.w}`;
ui(`<div class="pn" style="left:40px;top:24px;width:880px;height:492px"><h2>記録</h2><div class="tx">全国制覇 ${S.titles}回　甲子園出場 ${S.koshien}回<br><b>${h.name}（${S.gen}代目・${PN[h.pos]}）</b><br>${f(h.rec)}<br>${h.yrs.join(' / ')}<br><br><b></b><br>${S.hist.slice().reverse().map(o=>`${o.gen}代目 ${o.name}（${PN[o.pos]}）<br>${f(o.rec)}<br>${o.yrs.join(' / ')}<br>`).join('<br>')||'まだいません'}</div><button class="mb" style="width:200px;margin:10px auto" onclick="hub()">もどる</button></div>`)}
async function bootGame(){window.Gunya3D?.init($('#gl'));await window.NativeGame?.init({pause:pauseGame});await window.NativeGame?.restore(KEY);title();requestAnimationFrame(frame)}bootGame();
</script></body></html>
