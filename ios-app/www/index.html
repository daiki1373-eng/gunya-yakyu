<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>甲子園への道</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#172c27;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:#fff7e7}
#stage{position:absolute;left:50%;top:50%;width:960px;height:540px;margin:-270px 0 0 -480px;background:#72956a;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:auto}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;background:linear-gradient(transparent 80%,rgba(25,43,39,.05))}
#rot{display:none;position:fixed;inset:0;z-index:999;background:#173e33;font-size:26px;text-align:center;align-items:center;justify-content:center;line-height:1.8}
#hud{position:absolute;inset:0;display:none;pointer-events:none;z-index:10;text-shadow:0 1px 2px #102a23;font-weight:bold}
.hb{position:absolute;background:rgba(24,59,47,.94);border:1px solid #d8d1a9;border-radius:9px;padding:6px 10px;box-shadow:0 3px 12px #132b2630}
#sb{left:8px;top:8px;min-width:200px;font-size:18px;line-height:24px}
#sb div{display:flex;justify-content:space-between;gap:8px}#sb .cur{color:#ffe14a}
#sb .inn{justify-content:center;border-top:1px solid #6e8d75;margin-top:3px;padding-top:3px;color:#e4d4a4}
#cnt{right:8px;top:8px;font-size:16px;line-height:22px}#cnt .cr{display:flex;gap:10px;align-items:center}
.gg{display:inline-block;width:54px;height:7px;background:#12291f;border:1px solid #89a084;vertical-align:middle}.gg i{display:block;height:100%;background:linear-gradient(90deg,#cd9154,#f1d37c)}
.lamp{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:3px;background:#19382e;border:1px solid #93a48a;vertical-align:-2px}
.lamp.on.s{background:#efd46f;box-shadow:0 0 5px #efd46f55}.lamp.on.b{background:#91cb81}.lamp.on.o{background:#ec8b71}
.dia{position:relative;width:70px;height:52px}
.bs{position:absolute;width:15px;height:15px;transform:rotate(45deg);border:2px solid #e8e5cc;background:#1d3c31}.bs.on{background:#efd46f}
.tel{position:absolute;left:250px;width:460px;text-align:center;padding:6px 10px;font-size:19px;border:1px solid #d6c8a1;border-radius:8px;display:none}
#tel1{top:8px;background:linear-gradient(#38664d,#244a38)}
#tel2{top:56px;background:rgba(27,48,36,.9);font-size:17px;color:#f3dfab}
#flash{position:absolute;left:0;right:0;top:190px;text-align:center;font-size:56px;font-style:italic;color:#ffe8a5;text-shadow:0 3px 0 #30553e,0 5px 14px #102a2380;opacity:0}
#flash.show{animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:0;transform:translateY(10px) scale(.94)}18%{opacity:1;transform:translateY(-2px) scale(1.025)}32%{transform:translateY(0) scale(1)}78%{opacity:1}100%{opacity:0}}
#info{position:absolute;left:300px;width:360px;bottom:6px;text-align:center;font-size:14px;background:rgba(25,49,35,.84);padding:4px;border-radius:6px}
#bl{position:absolute;left:10px;bottom:10px}
#br{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:124px 124px;gap:6px}
.gb{pointer-events:auto;width:124px;height:64px;border:2px solid #ede6cc;border-radius:12px;color:#fff9e9;font-weight:bold;font-size:21px;font-family:inherit;text-shadow:0 1px 2px #18332980;cursor:pointer;box-shadow:0 4px 0 #193d30,0 5px 13px #17352935;transition:transform .1s,filter .1s}
.gb:active{filter:brightness(1.12);transform:translateY(2px)}
.gb.st{background:#64765c;width:110px}.gb.st.on{background:#ead18b;color:#244333;text-shadow:none}
#ui{position:absolute;inset:0;display:none;z-index:20}
.pn{position:absolute;background:linear-gradient(145deg,#2e5742,#193b2f);border:2px solid #e7dab1;border-radius:14px;padding:14px 16px;box-shadow:0 9px 28px #102b2859;overflow:auto}
.pn h2{margin:0 0 8px;font-size:24px;color:#f2d88d;text-shadow:0 1px 2px #18372b}
.mb{display:block;width:100%;margin:7px 0;padding:10px 12px;font-weight:bold;font-size:20px;font-family:inherit;color:#fff8e7;border:2px solid #d8d1aa;border-radius:10px;background:linear-gradient(#467658,#2d563f);text-shadow:0 1px 2px #18372b;cursor:pointer;box-shadow:0 3px 0 #19382b;transition:transform .1s,filter .1s}
.mb:active{filter:brightness(1.13);transform:translateY(2px)}.mb[disabled]{opacity:.4;pointer-events:none}.mb.go{background:linear-gradient(#b97649,#8f5232)}
.ttl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(0deg,#183c32b0,transparent 80%);padding-top:6px}
.title-kicker{font-size:15px;letter-spacing:5px;font-weight:bold;color:#f5e8bf;margin-bottom:12px;text-shadow:0 2px 5px #163d32}
.logo{font-size:72px;font-weight:900;color:#fff0c7;text-shadow:0 3px 0 #31523a,0 7px 18px #17392e80;letter-spacing:5px;font-style:normal}
.sub{font-size:19px;margin:9px 0 23px;color:#fff4d6;text-shadow:0 2px 4px #153b2d}.mn{width:300px}
.mn .mb:first-child{background:linear-gradient(#f2d495,#dcba76);color:#254733;text-shadow:none;border-color:#fff0c7;box-shadow:0 3px 0 #9c814c}.title-note{font-size:13px;margin-top:15px;color:#e0e6ca;letter-spacing:1px}
.st{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:16px}.st span{width:76px}.st b{width:56px;text-align:right}
.bar{flex:1;height:12px;background:#000;border:1px solid #9ac}.bar i{display:block;height:100%}
.warn{background:#975139;padding:4px 8px;margin:6px 0;border:1px solid #edd5af;border-radius:5px;font-size:16px}
.tx{font-size:15px;line-height:1.55}
.sch{border:3px solid #678;border-radius:8px;padding:6px 10px;margin:5px 0;font-size:15px;cursor:pointer;background:rgba(255,255,255,.07)}.sch.on{border-color:#ffe14a;background:rgba(255,225,74,.18)}
label{display:block;margin:7px 0;font-size:16px}input,select{font-size:18px;font-family:inherit;padding:5px;width:100%;margin-top:3px;color:#213e30;background:#fff5df;border:1px solid #c6c39c;border-radius:5px;accent-color:#e3be6c}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border:1px solid #89a;padding:3px 6px;text-align:center}
#lyr{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:34px;font-weight:bold;text-shadow:3px 3px 0 #000;letter-spacing:4px}
#mute{position:absolute;right:6px;top:140px;z-index:70;width:38px;height:38px;border-radius:50%;border:1px solid #e1d8b5;background:rgba(26,56,42,.88);color:#fff;font-size:18px}
#form-ui{z-index:45;left:175px;top:30px;width:610px;height:480px;pointer-events:auto;background:linear-gradient(#315b45,#1b3d30)}
#form-ui h2{font-size:22px;margin:0 0 7px}#form-ui .form-controls{width:292px}#form-ui label{font-size:14px;margin:9px 0}#form-ui output{float:right;color:#ffe39a;font-variant-numeric:tabular-nums}#form-ui input{padding:0;margin:3px 0;height:17px;accent-color:#f1c662}#form-ui select{font-size:16px;padding:5px;margin:0}
#form-ui button{cursor:pointer;font-family:inherit}#form-ui .form-tabs,#form-ui .form-stage,#form-ui .form-tools{display:flex;gap:5px;margin:8px 0}#form-ui .form-tabs button,#form-ui .form-stage button,#form-ui .form-tools button,#form-play{flex:1;padding:6px 0;font-size:13px;font-weight:bold;color:#fff5dc;background:#436b50;border:1px solid #9daa86;border-radius:5px}#form-ui .form-tabs button.on,#form-ui .form-stage button.on{background:#e2c483;color:#254333}
#form-ui .form-sliders{height:240px;overflow:auto;padding:0 3px}#form-ui .form-sliders:has(.form-stage) label{margin:15px 0}#form-ui .form-tools{position:absolute;left:14px;bottom:57px;width:292px;height:29px;margin:0}#form-preview{position:absolute;right:12px;top:64px;width:250px;height:300px;border-radius:10px;background:#bdd4bf}#form-play{position:absolute;right:12px;top:372px;width:250px}#form-ui .form-close{position:absolute;bottom:8px;left:14px;width:576px;font-size:18px;margin:0;padding:7px}
#form-ui .form-sliders:not(:has(.form-stage)) label{margin:3px 0;font-size:13px;line-height:16px}#form-ui .form-sliders:not(:has(.form-stage)) input{display:block;height:14px;margin:1px 0}

#gl{position:absolute;inset:0;width:960px;height:540px}#pause{position:absolute;right:6px;top:186px;z-index:70;width:38px;height:38px;border-radius:50%;border:1px solid #e1d8b5;background:#1a382ae0;color:white;font-size:18px;display:none}#pause-ui{position:absolute;inset:0;z-index:80;background:#173b2cb8;backdrop-filter:blur(5px)}#pause-ui[hidden]{display:none}#pause-ui:not([hidden]){display:grid;place-items:center}#pause-ui>div{width:300px;text-align:center;font-size:28px}

let HM='main',MSG='',NG=null;
function title(){V.mode='yard';hudOff();const has=!!localStorage.getItem(KEY);
ui(`<div class="ttl"><div class="title-kicker">ぐにゃぐにゃ野球、開幕。</div><div class="logo">甲子園への道</div><div class="sub">しなる投球、よろける守備。でも、一球は本気。</div><div class="mn"><button class="mb" onclick="newGame()">はじめから</button>${has?'<button class="mb" onclick="loadGame()">つづきから</button>':''}<button class="mb" onclick="help()">あそびかた</button></div><div class="title-note">全力で投げて、ちょっとよろけて、また一球。</div></div>`)}
function help(){ui(`<div class="pn" style="left:60px;top:30px;width:840px;height:480px"><h2>あそびかた</h2><div class="tx">
球が来たらタイミングよくボタンを押す！ボタンが打法です：通常打ち／長打狙い(強振・当たりにくい)／流し打ち(逆方向)／バント(送りに)。早いと引っ張り、遅いと流れます。ストライクゾーンの枠は出ません。球をよく見よう。<br>
球種ボタンを押して投げます。<b>ボタンの中のタップ位置がコース指定</b>（上=高め・左右=内外。画面には出ません）。制球が低いとバラけます。「投球フォーム」で構え・踏み込み・リリースの腕／体／脚に加え、全身回転・腕回転・横ひねり・胴の長さ・ジャンプを変更できます（見た目のみ・今のプレイ中に有効）。<br>
自動。<b>盗塁</b>ボタンをONにして打席へ（ランナーがいる時だけ表示）。<br>
必殺ゲージが満タンになると「必殺」ボタンで必殺技（投球＝魔球系／打撃＝特殊打法）が使えます。主人公は作成時に種族を選べて、種族で能力が変わります。<br>
大会の合間に練習で能力アップ。ただし<b>疲労</b>がたまると試合で能力が下がり、ケガもします。休養で回復。<br>
地方予選3勝→甲子園3勝で優勝！ 3年の夏が終わると卒業し、新しい主人公で世代交代します。セーブは自動です。<br>打球が出たら、守備は1〜4で送球先、攻撃は↑で進塁・↓で帰塁・スペースで停止（Tabで走者切替）。<br>PCキー：Z/X/C/V=打法、矢印=投球コース、1〜5=球種、F=投球フォーム</div>
<button class="mb" style="width:200px;margin:10px auto" onclick="title()">もどる</button></div>`)}
function newGame(gen){NG={sc:gen?S.sc:0,gen:!!gen};
const op=PN.map((n,i)=>i?`<option value="${i}">${n}</option>`:'').join('');
ui(`<div class="pn" style="left:30px;top:18px;width:900px;height:504px;display:flex;gap:18px"><div style="width:330px"><h2>主人公をつくる</h2>
<label>名前<input id="nm" maxlength="6" value="青野 翔"></label><label>守備位置<select id="ps">${op}</select></label>
<label>投げ<select id="th"><option value="R">右投げ</option><option value="L">左投げ</option></select></label><label>打ち<select id="bt"><option value="R">右打ち</option><option value="L">左打ち</option></select></label>
<label>種族<select id="sp"><option value="human">人間（バランス）</option><option value="beetle">カブトムシ（長打特化・鈍足）</option><option value="dog">イヌ（俊足・守備）</option><option value="panda">パンダ（変化・制球）</option></select></label>
${gen?'':'<label>試合のイニング数<select id="inn"><option>3</option><option selected>5</option><option>7</option><option>9</option></select></label>'}</div>
<div style="flex:1"><h2>${gen?SCH().n+'（世代交代）':'学校をえらぶ'}</h2>${gen?'':SCHOOLS.map((s,i)=>`<div class="sch" id="sc${i}" onclick="selSch(${i})"><b style="color:${s.c==='#e8e8f0'?'#fff':s.c}">■</b> <b>${s.n}</b>（チーム力${s.st}）<br>${s.d}</div>`).join('')}
<button class="mb go" onclick="ngGo()">この内容で始める！</button></div></div>`);if(!gen)selSch(0)}
function selSch(i){NG.sc=i;SCHOOLS.forEach((_,j)=>{const e=$('#sc'+j);if(e)e.classList.toggle('on',j===i)})}
function ngGo(){const nm=($('#nm').value||'球児').trim().slice(0,6),ps=+$('#ps').value,th=$('#th').value,bt=$('#bt').value,sp=$('#sp').value;
if(NG.gen){S.gen++;S.hero=newHero(nm,ps,th,bt,sp);S.grade=1;S.tS=SCH().st+ri(-2,5)+Math.min(S.titles,3)*2;genMates();S.ph='spring';S.slots=4;S.round=0;S.res=[]}
else{S={sc:NG.sc,inn:+$('#inn').value,hero:newHero(nm,ps,th,bt,sp),grade:1,gen:1,tS:SCHOOLS[NG.sc].st,ph:'spring',slots:4,round:0,res:[],hist:[],titles:0,koshien:0};genMates()}
MSG='';HM='main';save();hub()}
function loadGame(){try{S=JSON.parse(localStorage.getItem(KEY));if(S.hero&&!S.hero.sp)S.hero.sp='human';HM='main';MSG='';hub()}catch(e){newGame()}}
const STN=[['meet','ミート','#f55'],['power','パワー','#f90'],['speed','走力','#4c4'],['field','守備','#4ad'],['arm','肩','#aaf'],['velo','球速','#f5a'],['ctrl','制球','#5df'],['brk','変化球','#da5'],['stam','スタミナ','#ee5']];
const PR={meet:'打撃練習',power:'筋力トレ',speed:'ダッシュ',field:'守備練習',arm:'遠投',velo:'投げ込み',ctrl:'制球練習',brk:'変化球',stam:'走り込み'};
function hub(){V.mode='yard';hudOff();const h=S.hero,sc=SCH();
const bars=STN.map(([k,l,c])=>`<div class="st"><span>${l}</span><div class="bar"><i style="width:${h[k]}%;background:${c}"></i></div><b>${k==='velo'?Math.round(105+h.velo*.5)+'km':h[k]}</b></div>`).join('');
const ph=S.ph==='spring'?`${S.grade}年生・春季練習`:`${S.grade}年生・夏の大会 次：${RL[S.round]}`;let m='';
if(HM==='practice')m=`<h2>練習メニュー</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">${STN.map(([k])=>`<button class="mb" style="font-size:17px;padding:8px" onclick="doPractice('${k}')">${PR[k]}</button>`).join('')}<button class="mb" style="font-size:17px;padding:8px" onclick="doPractice('team')">チーム練習</button></div><button class="mb" onclick="HM='main';hub()">もどる</button>`;
else m=`<h2>${ph}</h2><div class="tx" style="min-height:62px;white-space:pre-line;color:#ffe9a0">${MSG||'練習で能力を伸ばそう！'}</div><div class="tx">練習できる回数：残り ${S.slots}回</div>
<button class="mb" ${S.slots<=0||h.inj>0?'disabled':''} onclick="HM='practice';hub()">練習する</button><button class="mb" ${S.slots<=0?'disabled':''} onclick="doRest()">休養する</button>
<button class="mb go" onclick="${S.ph==='spring'?'goTour()':'startMatch()'}">${S.ph==='spring'?'夏の大会へ進む':RL[S.round]+'へ！'}</button>
<div style="display:flex;gap:8px"><button class="mb" onclick="records()">記録</button><button class="mb" onclick="help2()">ヘルプ</button><button class="mb" onclick="title()">タイトル</button></div>`;
ui(`<div class="pn" style="left:20px;top:20px;width:470px;height:500px"><div class="tx" style="color:#9df">${sc.n}　${S.gen}代目</div><div style="font-size:28px;font-weight:bold;margin:2px 0 6px">${h.name}<small style="font-size:15px"> ${S.grade}年 ${PN[h.pos]}・${SPEC[h.sp||'human'].n} ${h.thr==='R'?'右':'左'}投${h.bat==='R'?'右':'左'}打</small></div>
<div class="st"><span>疲労</span><div class="bar"><i style="width:${h.fat}%;background:${h.fat>70?'#e33':h.fat>40?'#ea3':'#3c3'}"></i></div><b>${h.fat}</b></div>${h.inj>0?`<div class="warn">ケガ：あと${h.inj}試合 離脱</div>`:''}${bars}<div class="tx">チーム力 ${Math.round(S.tS)}　${S.res.slice(-2).join('<br>')}</div></div><div class="pn" style="left:510px;top:20px;width:430px;height:500px">${m}</div>`)}
function help2(){ui(`<div class="pn" style="left:60px;top:30px;width:840px;height:480px"><div class="tx" style="font-size:17px">疲労が高いと試合で能力が下がり、ケガの原因になります。練習の合間に「休養」を挟みましょう。ケガ中は練習できず、試合にも出られません。<br>打撃は「球が近づいてきたらボタン」。球種・コースを見て打法を使い分けよう。<br>投球はボタンの<b>タップ位置</b>がコース指定です。</div><button class="mb" style="width:200px" onclick="hub()">もどる</button></div>`)}
function doPractice(k){const h=S.hero;if(S.slots<=0||h.inj>0)return;S.slots--;
if(k==='team'){S.tS=Math.min(80,S.tS+.9);h.fat=cl(h.fat+7,0,100);MSG='チーム練習！ チーム力が少し上がった'}
else{const f=h.fat>80?.3:h.fat>60?.6:1;let g=Math.round(ri(1,3)*f*(S.sc===4?1.25:1)*(1-h[k]/160)*1.4);if(g<1&&R()<.5)g=1;h[k]=Math.min(99,h[k]+g);h.fat=cl(h.fat+(k==='stam'?20:ri(11,17)),0,100);MSG=`${PR[k]}！ ${STN.find(s=>s[0]===k)[1]}が +${g}${f<1?'（疲れで効果ダウン）':''}`}
if(h.fat>60&&R()<(h.fat-60)/110*.55){h.inj=ri(1,3);MSG+=`\n⚠ ケガをしてしまった…（${h.inj}試合離脱）`}
HM='main';save();hub()}
function doRest(){const h=S.hero;if(S.slots<=0)return;S.slots--;h.fat=cl(h.fat-38,0,100);if(h.inj>0)h.inj--;MSG='ゆっくり休養。疲労が回復した'+(h.inj>0?`（ケガ：あと${h.inj}試合）`:h.inj===0?'':'');HM='main';save();hub()}
function goTour(){S.ph='tour';S.round=0;S.slots=2;S.res=[];MSG='いよいよ夏の大会！';save();hub()}
async function startMatch(){uiOff();const opp=mkOpp(S.round),r=await playMatch(opp,RL[S.round]);afterMatch(r)}
function afterMatch(r){const h=S.hero;h.rec.g++;let note='';
if(G.heroOut)h.inj=Math.max(0,h.inj-1);else{h.fat=cl(h.fat+(h.pos===1?Math.min(40,Math.round(G.heroPC/4)):8),0,100);if(h.fat>80&&R()<.2){h.inj=ri(1,3);note=`⚠ 試合でケガ！（${h.inj}試合離脱）`}}
if(r.win&&h.pos===1&&!G.heroOut)h.rec.w++;S.res.push(`${RL[S.round]} ${r.win?'○':'●'} ${r.me}-${r.you} ${r.opp}`);LASTR=r;save();
const home=G.myTop?'you':'me',away=G.myTop?'me':'you',n=Math.max(G.maxInn,G.line.me.length,G.line.you.length),hd=[];for(let i=0;i<n;i++)hd.push(i+1);
const row=k=>`<tr><td>${G[k].short}</td>${hd.map(i=>`<td>${G.line[k][i-1]===undefined?'-':G.line[k][i-1]}</td>`).join('')}<th>${G.sc[k]}</th></tr>`;
const d=(a,c)=>h.rec[a]-G.rec0[a];
ui(`<div class="pn" style="left:60px;top:40px;width:840px;height:460px"><h2>${r.win?'勝利！':'敗戦…'} ${RL[S.round]}${r.called?'（コールド）':''}</h2><table><tr><th></th>${hd.map(i=>`<th>${i}</th>`).join('')}<th>計</th></tr>${row(away)}${row(home)}</table>
<div class="tx" style="margin-top:12px">${G.heroOut?'主人公はケガで欠場…':`主人公：${d('ab')}打数${d('h')}安打 本塁打${d('hr')} 打点${d('rbi')} 盗塁${d('sb')}${h.pos===1?`　投球${Math.floor(d('outs')/3)}回 奪三振${d('k')} 失点${d('ra')}`:''}`}<br>${note}</div>
<button class="mb go" style="width:300px;margin:16px auto" onclick="afterResult(${r.win})">つぎへ</button></div>`)}
let LASTR=null;
async function afterResult(win){uiOff();if(win){await kouka();if(S.round>=5){champion();return}S.round++;S.slots=2;MSG=`勝利！ 次は ${RL[S.round]}。練習で備えよう`;save();hub()}else endYear(false,S.round)}
async function kouka(){const sc=SCH();V.mode='kouka';V.k={c:sc.c,c2:sc.c2};hudOff();const s=sc.s,L=[`${s}の空 高く`,'白き雲 わたる 校庭に','夢ひろげ 駆ける 若き日よ',`ああ ${s} ${s} 栄えあれ`];let skip=false;window.skipK=()=>{skip=true};
ui(`<div id="lyr"></div><button class="mb" style="position:absolute;right:14px;top:14px;width:120px" onclick="skipK()">スキップ</button><div style="position:absolute;left:0;right:0;top:40px;text-align:center;font-size:38px;font-weight:900;color:#ffe14a;text-shadow:3px 3px 0 #000">${sc.n}　校歌斉唱</div>`);
sndFan();await sleep(900);const mg=playMel();for(let i=0;i<4&&!skip;i++){$('#lyr').textContent=L[i];for(let t=0;t<36&&!skip;t++)await sleep(100)}if(mg){try{mg.gain.value=0}catch(e){}}uiOff();V.mode='yard'}
function champion(){S.titles++;V.mode='kouka';V.k={c:SCH().c,c2:SCH().c2};sndFan();sndCheer();ui(`<div class="ttl"><div class="logo" style="font-size:72px">全国制覇！！</div><div class="sub">${S.hero.name}と${SCH().n}、甲子園の頂点へ！</div><div class="mn"><button class="mb go" onclick="endYear(true,5)">つぎへ</button></div></div>`)}
function endYear(champ,lr){const h=S.hero,label=champ?'全国制覇！':(lr>=3?`甲子園 ${RL[lr].replace('甲子園 ','')}敗退`:`${RL[lr]}敗退`);
h.yrs.push(`${S.grade}年:${label}`);h.best=Math.max(h.best,champ?7:lr+1);if(champ||lr>=3)S.koshien++;save();V.mode='yard';hudOff();
ui(`<div class="pn" style="left:140px;top:100px;width:680px;height:300px"><h2>${S.grade}年生の夏が終わった</h2><div style="font-size:30px;margin:14px 0;text-align:center;color:#ffe14a">${label}</div><div class="tx">${h.yrs.join('<br>')}</div><button class="mb go" style="width:260px;margin:14px auto" onclick="afterYear()">${S.grade>=3?'卒業へ':'新学年へ'}</button></div>`)}
function afterYear(){const h=S.hero;
if(S.grade>=3){S.hist.push({name:h.name,gen:S.gen,pos:h.pos,school:SCH().s,yrs:h.yrs.slice(),rec:Object.assign({},h.rec),best:h.best});save();
ui(`<div class="pn" style="left:140px;top:80px;width:680px;height:340px"><h2>卒業</h2><div class="tx" style="font-size:17px">${h.name}は${SCH().n}を卒業した。<br>${h.yrs.join('<br>')}<br><br>記録は「記録」に残ります。次の世代へ！</div><button class="mb go" style="width:300px;margin:14px auto" onclick="newGame(1)">新しい主人公をつくる</button></div>`)}
else{S.grade++;STN.forEach(([k])=>{h[k]=Math.min(99,h[k]+ri(1,3))});h.fat=Math.max(0,h.fat-30);h.inj=0;S.tS+=3;S.ph='spring';S.slots=4;S.round=0;S.res=[];MSG=`${S.grade}年生になった！ 能力が少し成長した`;save();hub()}}
function records(){const h=S.hero,f=r=>`${r.g}試合 / 打数${r.ab} 安打${r.h} 本塁打${r.hr} 打点${r.rbi} 盗塁${r.sb} / 投球回${Math.floor(r.outs/3)}${['','⅓','⅔'][r.outs%3]} 奪三振${r.k} 失点${r.ra} 勝${r.w}`;
ui(`<div class="pn" style="left:40px;top:24px;width:880px;height:492px"><h2>記録</h2><div class="tx">全国制覇 ${S.titles}回　甲子園出場 ${S.koshien}回<br><b>${h.name}（${S.gen}代目・${PN[h.pos]}）</b><br>${f(h.rec)}<br>${h.yrs.join(' / ')}<br><br><b></b><br>${S.hist.slice().reverse().map(o=>`${o.gen}代目 ${o.name}（${PN[o.pos]}）<br>${f(o.rec)}<br>${o.yrs.join(' / ')}<br>`).join('<br>')||'まだいません'}</div><button class="mb" style="width:200px;margin:10px auto" onclick="hub()">もどる</button></div>`)}
async function bootGame(){window.Gunya3D?.init($('#gl'));await window.NativeGame?.init({pause:pauseGame});await window.NativeGame?.restore(KEY);title();requestAnimationFrame(frame)}bootGame();
</script></body></html>
